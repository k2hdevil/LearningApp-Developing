# AWS Amplify Hosting 커스텀 HTTP 헤더
#
# 커스텀 헤더는 amplify.yml 이 아니라 저장소 루트의 이 파일에 넣습니다.
# monorepo 는 appRoot 별로 선언하는 형식을 씁니다.
#   https://docs.aws.amazon.com/amplify/latest/userguide/monorepo-custom-headers.html
#   https://docs.aws.amazon.com/amplify/latest/userguide/custom-header-YAML-format.html
#
# 이 파일의 헤더는 Amplify 콘솔의 Custom headers 설정을 덮어씁니다.
# 바꾼 뒤에는 재배포해야 적용됩니다.
#
# CSP 는 빌드된 dist/ 를 이 헤더와 함께 서빙하고 헤드리스 브라우저로 확인했습니다.
# 위반 0건, Google Fonts 스타일시트 로드, Noto Sans Mono 실제 로드,
# 코드 블록 19개의 구문 하이라이팅 색 8종 정상 적용을 확인했습니다.
applications:
  - appRoot: webapp
    customHeaders:
      - pattern: '**/*'
        headers:
          # HTTPS 로만 접속하게 합니다. Amplify 기본 도메인은 HTTPS 를 제공합니다.
          - key: 'Strict-Transport-Security'
            value: 'max-age=63072000; includeSubDomains'
          # 선언된 Content-Type 을 브라우저가 추측으로 뒤집지 않게 합니다.
          - key: 'X-Content-Type-Options'
            value: 'nosniff'
          # 다른 사이트가 이 페이지를 프레임에 담지 못하게 합니다.
          # CSP frame-ancestors 와 겹치지만 구형 브라우저용으로 함께 둡니다.
          - key: 'X-Frame-Options'
            value: 'DENY'
          - key: 'Referrer-Policy'
            value: 'strict-origin-when-cross-origin'
          # 이 앱은 카메라·마이크·위치를 쓰지 않습니다.
          - key: 'Permissions-Policy'
            value: 'camera=(), microphone=(), geolocation=(), payment=()'
          # script-src 'self' 가 XSS 를 막는 핵심입니다. 빌드 산출물에 인라인
          # <script> 가 없으므로 'unsafe-inline' 없이 동작합니다.
          #
          # style-src 의 'unsafe-inline' 은 지금 빌드에는 필요하지 않습니다.
          # 빼도 구문 하이라이팅 색 8종이 그대로 적용되는 것을 확인했습니다.
          # React 가 style 을 markup 속성이 아니라 CSSOM 으로 넣기 때문입니다.
          # 그래도 남겨 둡니다. CSP 는 Amplify 에서만 적용되고 로컬 개발 서버에는
          # 걸리지 않으므로, Cloudscape 업그레이드가 런타임에 <style> 을 주입하기
          # 시작하면 게이트도 렌더 검사도 잡지 못하고 배포 후에야 깨집니다.
          # 정적 문서 사이트에서 인라인 스타일을 막아 얻는 이득보다 그 위험이 큽니다.
          #
          # 웹폰트는 index.html 이 Google Fonts 에서 불러오므로
          # style-src 에 fonts.googleapis.com, font-src 에 fonts.gstatic.com 이
          # 필요합니다. CSS 안의 data: URI 40건 때문에 img-src 와 font-src 에
          # data: 를 둡니다. 콘텐츠 마크다운은 같은 오리진에서 fetch 하므로
          # connect-src 는 'self' 로 충분합니다.
          - key: 'Content-Security-Policy'
            value: >-
              default-src 'self';
              script-src 'self';
              style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
              font-src 'self' data: https://fonts.gstatic.com;
              img-src 'self' data:;
              connect-src 'self';
              object-src 'none';
              base-uri 'self';
              frame-ancestors 'none';
              form-action 'none'
