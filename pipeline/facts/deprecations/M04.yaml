# 폐기·변경 레지스트리
#
# 교재(Developing on AWS 강사용 덱)에 등장하지만 현재는 종료·비권장·변경된 항목을 기록합니다.
# 본문에서 조용히 지우지 않고 여기에 근거와 함께 남긴 뒤, 각 모듈 끝
# '교재 대비 변경 사항' 섹션에 delta로 표시합니다. 수강생이 공식 교재를 들고
# 있으므로 "책에는 있는데 자료에는 없다"는 질문에 답할 수 있어야 합니다.
#
# state 값
#   ended       : 서비스·버전 지원 종료. 본문에서 제거하고 대체안을 제시한다.
#   discouraged : 동작하지만 권장되지 않음. 본문 주 경로에서 빼고 주의로만 남긴다.
#   changed     : 동작·기본값·표기가 바뀜. 본문을 새 내용으로 교체한다.
#   incorrect   : 교재 기술이 사실과 다름. 교정한다.
#
# verified_on 은 아래 항목을 공식 문서로 확인한 날짜입니다.

verified_on: 2026-08-25

items:
  - id: aws-cloud9-new-customers
    module: M04
    state: ended
    title: AWS Cloud9
    courseware_location: '슬라이드 2 어젠다 강사 노트, 슬라이드 32 "IDE 고려 사항" 강사 노트, 슬라이드 38 "실습 1 워크플로" 강사 참고 사항'
    detail: >-
      AWS Cloud9 은 신규 고객에게 더 이상 제공되지 않습니다. 기존 AWS Cloud9 고객은
      서비스를 평소와 같이 계속 사용할 수 있습니다. 교재는 실습 1 을 "AWS Cloud9 을
      사용하여 개발 환경에서 IAM 권한을 구성하고 테스트합니다"로 소개하고, 슬라이드 38
      강사 참고 사항은 Python 실습이 여전히 Cloud9 에 배포되어 있다고 적습니다.
      Cloud9 을 쓰지 않는 계정에서는 이 절차를 그대로 따를 수 없습니다.
    replacement: AWS IDE 툴킷(VS Code·JetBrains·Visual Studio) 또는 AWS CloudShell
    evidence: https://docs.aws.amazon.com/cloud9/latest/user-guide/welcome.html

  - id: aws-toolkit-for-eclipse
    module: M04
    state: ended
    title: AWS Toolkit for Eclipse
    courseware_location: '슬라이드 26 "다른 이름을 가진 여러 개의 프로파일 사용하기: JetBrains" 강사 노트의 툴킷 문서 링크 4개 중 Eclipse 항목'
    detail: >-
      교재가 인용한 toolkit-for-eclipse/v1/user-guide/ 경로 전체가 현재 JetBrains
      툴킷 문서(toolkit-for-jetbrains/latest/userguide/welcome.html)로 리다이렉트됩니다.
      Eclipse 용 AWS Toolkit 의 별도 사용 설명서가 더 이상 제공되지 않습니다.
      같은 슬라이드는 프로파일을 지원하는 IDE 목록에 Eclipse 를 포함합니다.
    replacement: JetBrains·Visual Studio·Visual Studio Code 용 AWS Toolkit
    evidence: https://docs.aws.amazon.com/toolkit-for-jetbrains/latest/userguide/welcome.html

  - id: java-sdk-v1-m04
    module: M04
    state: ended
    title: AWS SDK for Java 1.x
    courseware_location: '슬라이드 28 "보안 인증 정보: 우선 순위 순서" 강사 노트의 Java 문서 링크, 슬라이드 32 "IDE 고려 사항" 강사 노트의 JVM TTL 문서 링크'
    detail: >-
      AWS SDK for Java 1.x 는 2025년 12월 31일 지원이 종료되었습니다.
      교재가 인용한 두 문서 모두 sdk-for-java/v1/developer-guide/ 경로입니다.
      JVM TTL 문서는 v1 경로 안에서 jvm-ttl-dns.html 로 리다이렉트되지만
      여전히 v1 안내서입니다.
    replacement: AWS SDK for Java 2.x (software.amazon.awssdk)
    evidence: https://docs.aws.amazon.com/sdk-for-java/v1/developer-guide/getting-started.html

  - id: iam-user-long-term-keys-as-default
    module: M04
    state: discouraged
    title: IAM 사용자 장기 액세스 키를 개발 기본 경로로 사용
    courseware_location: '슬라이드 8 "자격 증명 기반 정책", 슬라이드 24 "AWS 영구 보안 인증 정보 설정", 슬라이드 28 "보안 인증 정보: 우선 순위 순서"'
    detail: >-
      교재는 IAM 사용자를 만들고 aws configure 로 액세스 키를 ~/.aws/credentials 에
      저장하는 것을 개발 환경 구성의 기본 절차로 제시합니다. 현재 IAM 보안 모범 사례는
      사람 사용자에게 자격 증명 공급자와의 페더레이션으로 임시 보안 인증 정보를 쓰도록
      요구하고, 중앙 집중식 액세스 관리에는 AWS IAM Identity Center 를 권장합니다.
      워크로드는 IAM 역할의 임시 자격 증명을 씁니다. 장기 액세스 키는 IAM 역할을 쓸 수
      없는 워크로드 등 예외 사용 사례로 한정됩니다. JetBrains 툴킷 문서도 "목적이 있는
      소프트웨어를 개발하거나 실제 데이터를 다룰 때는 IAM 사용자로 인증하지 말라"고
      명시합니다.
    replacement: AWS IAM Identity Center, IAM 역할, AWS CLI 버전 2 의 aws login, AWS CloudShell
    evidence: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html

  - id: root-user-access-keys
    module: M04
    state: discouraged
    title: 루트 사용자 액세스 키 생성
    courseware_location: '슬라이드 7 "IAM의 작동 방식" 강사 노트(보안 주체로 루트 사용자 나열), 슬라이드 13 "IAM 사용자 계정이 항상 필요한가?" 다이어그램의 루트 계정'
    detail: >-
      루트 사용자는 청구 정보를 포함해 계정의 모든 서비스·리소스에 완전한 액세스 권한을
      가지므로 액세스 키를 만들지 않도록 강력히 권장됩니다. 교재는 루트 사용자를 보안 주체
      목록과 역할 예시 다이어그램에 등장시키지만 보호 방법을 다루지 않습니다.
      또한 모든 계정 유형(독립 실행형·관리·멤버)이 루트 사용자에 MFA 를 구성해야 하며,
      MFA 가 없으면 첫 콘솔 로그인 시도로부터 35일 이내에 등록해야 합니다.
    replacement: 루트 작업은 콘솔에서 수행. 프로그래밍 방식이 필요하면 루트 자격 증명으로 aws login
    evidence: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html

  - id: sdk-retry-legacy-mode
    module: M04
    state: discouraged
    title: SDK 재시도 legacy 모드
    courseware_location: '슬라이드 32 "IDE 고려 사항" 강사 노트의 오류 재시도 및 지수 백오프'
    detail: >-
      legacy 모드는 standard 모드 도입 전 각 SDK 의 동작이며 표준 재시도 할당량이 없어
      서비스 장애 중에도 전속력으로 재시도를 계속합니다. 재시도 횟수·백오프 타이밍·재시도
      대상 오류·스로틀링 동작이 언어마다 다릅니다. Java·Python·Ruby·PHP·C++·CLI 에만
      존재하고 .NET·Go·Kotlin·Rust·Swift·JavaScript 에는 없습니다. 문서는 legacy 를
      쓰고 있다면 standard 로 전환하도록 권장합니다. 교재는 지수 백오프 개념만 설명하고
      모드 구분을 다루지 않습니다.
    replacement: standard 모드 (retry_mode=standard / AWS_RETRY_MODE=standard)
    evidence: https://docs.aws.amazon.com/sdkref/latest/guide/feature-retry-behavior.html

  - id: policy-types-two-only
    module: M04
    state: changed
    title: "'가장 일반적인 두 가지 정책 유형' 서술"
    courseware_location: 슬라이드 7 "IAM의 작동 방식" 강사 노트
    detail: >-
      교재는 "가장 일반적인 두 가지 정책 유형은 자격 증명 기반 정책과 리소스 기반
      정책입니다"로 서술하고 권한 경계를 별도 고급 기능으로 다룹니다. 현재 AWS 는
      9가지 정책 유형을 지원합니다: 자격 증명 기반, 리소스 기반, VPC 엔드포인트 정책,
      권한 경계, SCP, RCP, ACL, AWS RAM 리소스 공유, 세션 정책. 권한을 부여하는 것은
      자격 증명 기반·리소스 기반·ACL·RAM 공유이고 나머지는 상한만 정합니다.
    replacement: 9가지 정책 유형. 권한 부여 정책과 상한 정책을 구분해 설명
    evidence: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html

  - id: root-always-allowed-wording
    module: M04
    state: changed
    title: "'루트 보안 인증 정보로 요청하는 경우는 항상 허용됩니다' 서술"
    courseware_location: '슬라이드 17 "IAM 정책: 평가 로직" 강사 노트'
    detail: >-
      단일 계정 관점에서는 참입니다. 현재 문서도 기본 암시적 거부의 예외로 AWS 계정
      루트 사용자가 완전한 액세스를 갖는다고 명시합니다. 그러나 AWS Organizations 의
      SCP 는 멤버 계정의 각 AWS 계정 루트 사용자를 포함해 보안 주체의 권한을 제한하고,
      RCP 도 루트 사용자를 포함한 자격 증명의 유효 권한에 영향을 줄 수 있습니다.
      멤버 계정의 루트 자격 증명 자체를 제거할 수도 있습니다.
    replacement: 단일 계정에서는 참, AWS Organizations 안에서는 SCP·RCP 가 루트 사용자도 제한
    evidence: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html

  - id: poweruseraccess-notaction-scope
    module: M04
    state: changed
    title: PowerUserAccess 의 NotAction 제외 대상
    courseware_location: '슬라이드 11 "권한 경계: 1/2" 강사 노트'
    detail: >-
      교재는 "NotAction 요소를 사용하여 IAM 및 AWS Organizations 를 제외한 모든 AWS
      서비스와 모든 리소스에 대한 모든 작업을 허용", "서비스 연결 역할을 생성하기 위해
      IAM 권한만 부여됩니다"로 기재합니다. 기본 버전 v12 는 account:* 도 제외하고,
      두 번째 문장에서 account:GetAccountInformation,
      account:GetGovCloudAccountInformation, account:GetPrimaryEmail,
      account:ListRegions, iam:CreateServiceLinkedRole,
      iam:DeleteServiceLinkedRole, iam:ListRoles,
      organizations:DescribeEffectivePolicy, organizations:DescribeOrganization
      9개 작업을 허용합니다.
    replacement: iam:*, organizations:*, account:* 제외 + 9개 예외 허용 작업 (v12)
    evidence: https://docs.aws.amazon.com/aws-managed-policy/latest/reference/PowerUserAccess.html

  - id: web-identity-federation-naming
    module: M04
    state: changed
    title: "웹 ID 페더레이션 명칭과 지원 공급자 목록"
    courseware_location: 슬라이드 30 "임시 보안 인증 정보" 강사 노트
    detail: >-
      교재는 "AWS STS 웹 ID 페더레이션은 Amazon, Facebook, Google 및 OpenID
      Connect(OIDC) 호환 공급자를 통한 로그인을 지원합니다"로 특정 소셜 공급자를
      나열합니다. 현재 문서는 이 기능을 OIDC 페더레이션(OIDC federation)으로 부르고
      OIDC 호환 IdP 전반을 대상으로 서술하며, GitHub Actions 를 대표 예로 듭니다.
      사람 사용자 시나리오에서 가입·로그인·사용자 프로필 관리가 필요하면 Amazon Cognito
      를 자격 증명 브로커로 쓰도록 안내합니다.
    replacement: OIDC 페더레이션. OIDC 호환 IdP 전반. 사람 사용자 시나리오에는 Amazon Cognito 검토
    evidence: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_oidc.html

  - id: cli-output-formats-three
    module: M04
    state: changed
    title: AWS CLI 출력 형식 목록
    courseware_location: 슬라이드 24 "AWS 영구 보안 인증 정보 설정" 강사 노트
    detail: >-
      교재는 "옵션에는 json, yaml, text 가 포함됩니다"로 세 가지를 나열합니다.
      현재는 json(기본값), yaml, yaml-stream, text, table, off 여섯 가지입니다.
      또한 --output text 는 --query 적용 전에 페이지를 나누고 페이지마다 쿼리를
      실행하므로 예상 밖의 출력이 늘 수 있습니다.
    replacement: json, yaml, yaml-stream, text, table, off
    evidence: https://docs.aws.amazon.com/cli/latest/userguide/cli-usage-output-format.html

  - id: credential-precedence-and-chain
    module: M04
    state: changed
    title: 보안 인증 정보 우선순위 목록
    courseware_location: '슬라이드 27 "설정 및 환경 변수" 강사 노트, 슬라이드 28 "보안 인증 정보: 우선 순위 순서"'
    detail: >-
      교재는 두 슬라이드에서 서로 다른 목록을 제시하고 인스턴스 프로파일을 우선순위
      목록의 마지막 항목으로 둡니다. 현재 문서는 두 개념을 분리합니다. 설정 값 조회
      우선순위는 코드 -> (Java·Kotlin) JVM 시스템 속성 -> 환경 변수 -> 공유 credentials
      파일 -> 공유 config 파일 -> SDK 기본값 6단이고, 자격 증명 공급자 체인은 AWS
      액세스 키, 웹 자격 증명·OIDC 페더레이션, 로그인 공급자, IAM Identity Center,
      역할 수임, 컨테이너(ECS·EKS), 프로세스(IAM Roles Anywhere 포함), IMDS(EC2
      인스턴스 프로파일)를 포함합니다. 인스턴스 프로파일은 설정 값 소스가 아니라
      자격 증명 공급자입니다.
    replacement: 설정 값 우선순위(6단)와 자격 증명 공급자 체인을 분리해 설명
    evidence: https://docs.aws.amazon.com/sdkref/latest/guide/standardized-credentials.html

  - id: jvm-ttl-60-seconds
    module: M04
    state: changed
    title: JVM DNS TTL 권장값 60초
    courseware_location: 슬라이드 32 "IDE 고려 사항" 강사 노트
    detail: >-
      교재는 "60초 이하의 TTL 값으로 JVM 을 구성하는 것이 좋습니다"로 기재합니다.
      현재 AWS SDK for Java 2.x 문서의 권장값은 5초입니다. 또한
      networkaddress.cache.ttl 은 시스템 속성이 아니라 보안 속성(security property)
      이므로 -D 명령줄 플래그로 설정할 수 없다는 점이 명시되어 있습니다.
    replacement: TTL 5초. Security.setProperty 또는 java.security 파일로 설정
    evidence: https://docs.aws.amazon.com/sdk-for-java/latest/developer-guide/jvm-ttl-dns.html

  - id: sigv4-replay-window
    module: M04
    state: changed
    title: SigV4 재전송 공격 방어 기간 표기
    courseware_location: 슬라이드 29 "보안 인증 정보를 사용하여 요청에 서명" 강사 노트
    detail: >-
      교재는 "모든 요청에는 요청 만료 기간이 있습니다(요청의 타임스탬프로부터 n분).
      정확한 요청 만료 기간은 서비스마다 다릅니다"로 기재합니다. 현재 문서는 대부분의
      경우 요청이 타임스탬프로부터 5분 안에 AWS 에 도달해야 하며 그렇지 않으면 AWS 가
      요청을 거부한다고 명시합니다. 같은 페이지에 교재에 없는 SigV4a(비대칭 서명)가
      추가되었습니다.
    replacement: 대부분의 경우 5분. 다중 리전 요청에는 SigV4a 사용
    evidence: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_sigv.html

  - id: courseware-doc-url-redirects
    module: M04
    state: changed
    title: 구버전 문서 경로와 http 스킴 링크
    courseware_location: 슬라이드 17·24·25·27·28·29·32 강사 노트의 인용 링크
    detail: >-
      교재가 인용한 URL 중 여럿이 다른 경로로 리다이렉트됩니다.
      AccessPolicyLanguage_EvaluationLogic.html -> reference_policies_evaluation-logic.html,
      getting-started_create-admin-group.html -> getting-started-account-iam.html,
      cli-configure-profiles.html -> cli-configure-files.html,
      cli-configure-quickstart.html -> cli-chap-configure.html,
      sdkref settings-global.html -> settings-reference.html,
      general/latest/gr/signature-version-4.html 과 signing_aws_api_requests.html
      -> IAM/latest/UserGuide/reference_sigv.html,
      general/latest/gr/api-retries.html -> sdkref feature-retry-behavior.html.
      또한 두 링크(AccessPolicyLanguage_EvaluationLogic.html,
      signing_aws_api_requests.html)는 http 스킴을 씁니다.
    replacement: 본문에서는 모두 https 최종 경로로 교체
    evidence: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html

  - id: boto3-doc-domain-moved
    module: M04
    state: changed
    title: Boto3 문서 도메인
    courseware_location: '슬라이드 28 "보안 인증 정보: 우선 순위 순서" 강사 노트의 Boto3 링크'
    detail: >-
      교재는 Boto3 자격 증명 문서를
      boto3.amazonaws.com/v1/documentation/api/latest/guide/credentials.html 로
      인용합니다. 현재 이 URL 은 docs.aws.amazon.com/boto3/latest/guide/credentials.html
      로 리다이렉트되고, AWS SDKs and Tools 참조 가이드의 SDK 별 체인 목록도 이 경로를
      가리킵니다.
    replacement: https://docs.aws.amazon.com/boto3/latest/guide/credentials.html
    evidence: https://docs.aws.amazon.com/boto3/latest/guide/credentials.html

  - id: demo-bucket-name-invalid
    module: M04
    state: incorrect
    title: 데모 버킷 이름 DevonAWStest_bucket
    courseware_location: '슬라이드 19 "데모: 권한 테스트 (AWS Management Console)" 강사 노트'
    detail: >-
      교재 데모는 aws s3 mb s3://DevonAWStest_bucket 을 두 번 실행합니다.
      범용 버킷 이름은 소문자·숫자·마침표(.)·하이픈(-)만 쓸 수 있어 대문자와 밑줄을
      포함한 이 이름은 명명 규칙 위반입니다. 권한과 무관하게 실패하므로 데모가 의도한
      "권한 부족으로 실패 -> 역할 수임 후 성공" 시나리오를 정확히 보여 주지 못합니다.
    replacement: '소문자·하이픈만 사용한 이름 (예: devonawstest-bucket)'
    evidence: https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucketnamingrules.html

  - id: demo-role-name-inconsistency
    module: M04
    state: incorrect
    title: 데모 역할 이름 혼용
    courseware_location: '슬라이드 19 "데모: 권한 테스트 (AWS Management Console)" 강사 노트'
    detail: >-
      같은 데모 안에서 역할 이름이 ContractorAccess(역할 정의), Contractors3access
      (데모 도입부), S3access(ContractorAccess 정책의 Resource 와 assume-role 명령의
      --role-arn)로 혼용됩니다. 정책의 Resource 가 가리키는 이름과 명령의 역할 이름이
      일치하지 않으면 sts:AssumeRole 허용이 매칭되지 않습니다.
    replacement: 정책 Resource 와 일치하는 role/S3access 로 통일
    evidence: https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRole.html

  - id: demo-account-id-inconsistency
    module: M04
    state: incorrect
    title: 데모 계정 ID 혼용
    courseware_location: 슬라이드 18·19 데모 강사 노트
    detail: >-
      슬라이드 18 은 111122223333, 1234567891011(13자리), 111722413196 을 섞어 씁니다.
      AWS 계정 ID 는 12자리이므로 1234567891011 은 형식 위반입니다. 슬라이드 19 는
      ContractorAccess 정책의 Resource 에 112233445566 을, assume-role 명령의
      --role-arn 에 111722413196 을 써서 두 계정이 서로 다릅니다. 이 상태로는
      sts:AssumeRole 허용이 명령 대상 역할과 매칭되지 않습니다.
    replacement: 문서 예시용 12자리 계정 ID(111122223333 등)로 통일
    evidence: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic-cross-account.html

  - id: demo-temp-key-akia-prefix
    module: M04
    state: incorrect
    title: 임시 보안 인증 정보 예시에 AKIA 접두사 사용
    courseware_location: '슬라이드 19 "데모: 권한 테스트 (AWS Management Console)" 강사 노트의 export 명령'
    detail: >-
      교재는 assume-role 로 받은 임시 자격 증명을 내보내는 예시에
      export AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE 을 씁니다. AKIA 는 IAM 사용자 또는
      루트 사용자의 장기 액세스 키 접두사이고, AWS STS 작업으로 만든 임시 보안 인증
      정보의 액세스 키는 ASIA 로 시작합니다. 예시 값이 장기 키 형태여서 임시 자격 증명의
      특징을 가립니다.
    replacement: ASIA 로 시작하는 예시 값 사용
    evidence: https://docs.aws.amazon.com/IAM/latest/UserGuide/security-creds-programmatic-access.html

  - id: jetbrains-eclipse-preferences-wording
    module: M04
    state: incorrect
    title: "'JetBrains용 AWS Toolkit는 Eclipse 기본 설정 창을 통해' 서술"
    courseware_location: '슬라이드 26 "다른 이름을 가진 여러 개의 프로파일 사용하기: JetBrains" 강사 노트'
    detail: >-
      교재는 "JetBrains용 AWS Toolkit는 Eclipse 기본 설정 창을 통해 프로세스를
      간소화합니다"라고 기재해 서로 다른 IDE 를 섞었습니다. 현재 JetBrains 툴킷의
      IAM 자격 증명 설정 경로는 AWS Connection Settings -> Set up authentication ->
      Authenticate with IAM -> AWS Toolkit: Setup Authentication 대화 상자입니다.
    replacement: JetBrains 툴킷의 AWS Connection Settings 기반 설정 경로
    evidence: https://docs.aws.amazon.com/toolkit-for-jetbrains/latest/userguide/setup-credentials.html

  - id: most-restrictive-policy-wording
    module: M04
    state: incorrect
    title: "'충돌이 있는 경우 가장 제한적인 정책이 적용됩니다' 서술"
    courseware_location: '슬라이드 17 "IAM 정책: 평가 로직" 강사 노트'
    detail: >-
      결과적으로는 맞지만 규칙 서술이 부정확합니다. AWS 는 두 허용 정책의 범위를 비교해
      좁은 쪽을 고르는 것이 아니라, 적용 가능한 모든 정책(SCP, RCP, 리소스 기반,
      자격 증명 기반, 권한 경계, 세션 정책)에서 Deny 문장을 먼저 찾고 하나라도 있으면
      그 시점에 최종 결정을 거부로 확정합니다. 명시적 거부가 명시적 허용을 무시합니다.
    replacement: 명시적 거부 우선 규칙과 계층별 평가 순서로 설명
    evidence: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic_policy-eval-denyallow.html

  - id: instance-profile-in-precedence-list
    module: M04
    state: incorrect
    title: 설정 값 우선순위 목록에 인스턴스 프로파일 포함
    courseware_location: 슬라이드 27·28 강사 노트의 우선순위 목록
    detail: >-
      교재는 "작업별 파라미터 > 환경 변수 > 공유 보안 인증 정보 파일 > 공유 구성 파일 >
      인스턴스 프로파일" 순서로 제시합니다. 인스턴스 프로파일은 설정 값을 읽어 오는
      소스가 아니라 자격 증명 공급자 체인의 한 공급자(IMDS 자격 증명 공급자)입니다.
      현재 문서는 설정 값 조회 우선순위와 자격 증명 공급자 체인을 별도 개념으로
      분리해 설명합니다.
    replacement: 설정 값 우선순위와 자격 증명 공급자 체인을 분리
    evidence: https://docs.aws.amazon.com/sdkref/latest/guide/settings-reference.html
