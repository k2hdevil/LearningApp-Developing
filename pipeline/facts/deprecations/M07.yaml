      내용은 하위 페이지 work-witih-clients.html 의 "Create a service client" 절에 있습니다.
    replacement: https://docs.aws.amazon.com/sdk-for-java/latest/developer-guide/work-witih-clients.html
    evidence: https://docs.aws.amazon.com/sdk-for-java/latest/developer-guide/work-witih-clients.html

  - id: ondemand-pricing-page-path
    module: M07
    state: changed
    title: 온디맨드 용량 요금 페이지 경로
    courseware_location: '슬라이드 15 "읽기 및 쓰기 작업" 강사 노트 링크'
    detail: >-
      교재가 인용한 aws.amazon.com/dynamodb/pricing/on-demand/ 은 현재
      aws.amazon.com/dynamodb/pricing/ 으로 리디렉션됩니다. 온디맨드 전용 요금 페이지가
      통합 요금 페이지로 이동했습니다.
    replacement: https://aws.amazon.com/dynamodb/pricing/
    evidence: https://aws.amazon.com/dynamodb/pricing/

  - id: rcu-wcu-on-demand-mislabel
    module: M07
    state: incorrect
    title: "RCU·WCU를 '온디맨드 모드의 예약 용량'이라고 기재"
    courseware_location: '슬라이드 16 "요금 옵션" 강사 노트 마지막 문단'
    detail: >-
      교재 원문은 "중요한 차이점은 온디맨드 모드의 RRU와 WRU는 사용된 용량을 나타내는
      반면 온디맨드 모드의 RCU와 WCU는 예약 용량을 나타낸다는 것입니다"입니다.
      RCU·WCU 는 프로비저닝된 용량 모드의 단위이므로 두 번째 '온디맨드'는
      '프로비저닝'의 오기입니다. 같은 노트 앞부분과 슬라이드 본문은
      "프로비저닝 모드의 처리량은 RCU 및 WCU로 지정됩니다"라고 올바르게 기재해
      자체 모순입니다.
    replacement: >-
      온디맨드 모드의 RRU·WRU 는 사용된 용량, 프로비저닝된 용량 모드의 RCU·WCU 는
      예약(프로비저닝)된 용량
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Constraints.html

  - id: item-collection-10gb-unconditional
    module: M07
    state: incorrect
    title: 항목 컬렉션 10GB 한도를 무조건적 제약으로 기재
    courseware_location: '슬라이드 18 "예: 로컬 보조 인덱스" 강사 노트'
    detail: >-
      교재는 "항목 컬렉션의 총 크기는 10GB를 초과할 수 없습니다"라고 조건 없이
      기재합니다. 공식 문서는 이 제약이 로컬 보조 인덱스가 하나 이상 있는 테이블에만
      적용된다고 명시합니다. LSI 가 없으면 DynamoDB 가 항목 컬렉션을 필요한 만큼
      여러 파티션에 자동 분할합니다. 10GB 는 파티션의 최대 크기입니다.
    replacement: >-
      LSI 가 하나 이상 있는 테이블에서만 항목 컬렉션이 10GB 를 초과할 수 없다.
      LSI 가 없으면 여러 파티션으로 자동 분할된다
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Constraints.html

  - id: lsi-sort-key-scalar-wording
    module: M07
    state: incorrect
    title: "LSI 정렬 키가 '스칼라 속성이 될 수 있다'는 서술"
    courseware_location: '슬라이드 18 "예: 로컬 보조 인덱스" 강사 노트'
    detail: >-
      교재는 "이 정렬 키는 스칼라 속성이 될 수 있습니다"라고만 기재합니다. 공식 문서는
      LSI 의 정렬 키가 문자열·숫자·이진 형식의 키가 아닌(non-key) 기본 테이블 속성이어야
      한다고 명시합니다. 또 LSI 의 기본 키는 반드시 복합(파티션 키 + 정렬 키)이어야 하고,
      인덱스 키 스키마의 모든 속성은 최상위 속성이어야 하며 문서·세트 형식은 허용되지
      않습니다.
    replacement: >-
      LSI 정렬 키는 문자열·숫자·이진 형식의 키가 아닌 기본 테이블 최상위 속성.
      LSI 기본 키는 반드시 복합
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/SecondaryIndexes.html

  - id: boto3-client-resource-comment
    module: M07
    state: incorrect
    title: "boto3.client 위에 '서비스 리소스 가져오기' 주석"
    courseware_location: '슬라이드 36 "Python 예제: DynamoDB 서비스 클라이언트 생성" 코드'
    detail: >-
      교재 코드는 dynamodb = boto3.client('dynamodb') 바로 위에
      "# 서비스 리소스 가져오기" 라는 주석을 달고, 슬라이드 설명은
      "서비스 이름이 포함된 하위 수준 클라이언트를 생성합니다"라고 기재합니다.
      boto3 에서 client() 와 resource() 는 별개의 인터페이스이므로 주석이 잘못되었습니다.
      리소스는 boto3.resource('dynamodb') 로 가져옵니다.
    replacement: '# 하위 수준 클라이언트 생성 (리소스는 boto3.resource(''dynamodb''))'
    evidence: https://boto3.amazonaws.com/v1/documentation/api/latest/guide/resources.html

  - id: dynamodb-stores-data-in-rows-quiz
    module: M07
    state: incorrect
    title: "슬라이드 25 결과 표의 'Notes' 열 이름"
    courseware_location: '슬라이드 25 "AWS CLI와 상호 작용" 결과 표'
    detail: >-
      슬라이드 25 결과 표의 헤더가 `UserId | NoteId | Notes | Favorite` 로 표기되어
      있습니다. 같은 덱의 다른 모든 슬라이드(8, 12, 13, 14, 18, 19)와 put-item 명령의
      항목 JSON 은 모두 속성 이름을 `Note` 로 씁니다. `Notes` 는 테이블 이름과 혼동된
      오기입니다.
    replacement: 'Note (Notes 는 테이블 이름)'
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.CoreComponents.html

  - id: slide13-json-syntax
    module: M07
    state: incorrect
    title: 슬라이드 13 JSON 예제의 문법 오류
    courseware_location: '슬라이드 13 "항목 및 속성 유형" JSON 예제'
    detail: >-
      슬라이드 13 의 JSON 예제에서 "Tags": ["DynamoDB", "NoSQL"] 뒤에 쉼표가 없어
      그다음 "Meta" 항목과 이어지지 않습니다. 원문 그대로는 유효한 JSON 이 아닙니다.
      이 자료에서는 쉼표를 넣어 유효한 JSON 으로 고쳐 실었습니다.
    replacement: '"Tags": ["DynamoDB", "NoSQL"], 로 쉼표 추가'
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.NamingRulesDataTypes.html
