# 폐기·변경 레지스트리 (M07 모듈 7: 데이터베이스 시작하기)
#
# 교재(Developing on AWS 강사용 덱)에 등장하지만 현재는 종료·비권장·변경된 항목을 기록합니다.
# 본문에서 조용히 지우지 않고 여기에 근거와 함께 남긴 뒤, 모듈 끝
# '교재 대비 변경 사항' 장에 delta로 표시합니다. 수강생이 공식 교재를 들고
# 있으므로 "책에는 있는데 자료에는 없다"는 질문에 답할 수 있어야 합니다.
#
# state 값
#   ended       : 서비스·버전 지원 종료. 본문에서 제거하고 대체안을 제시한다.
#   discouraged : 동작하지만 권장되지 않음. 본문 주 경로에서 빼고 주의로만 남긴다.
#   changed     : 동작·기본값·표기가 바뀜. 본문을 새 내용으로 교체한다.
#   incorrect   : 교재 기술이 사실과 다름. 교정한다.
#
# verified_on 은 아래 항목을 공식 문서로 확인한 날짜입니다.

verified_on: 2026-08-30

items:
  - id: java-sdk-v1-dynamodb-namespaces
    module: M07
    state: ended
    title: AWS SDK for Java 1.x DynamoDB 네임스페이스
    courseware_location: '슬라이드 33 "SDK 종속성 정의" 표의 Java 열'
    detail: >-
      교재 표는 Java 하위 수준을 com.amazonaws.services.dynamodbv2.AmazonDynamoDB,
      상위 수준을 com.amazonaws.services.dynamodbv2.datamodeling.DynamoDBMapper 로
      기재합니다. 둘 다 AWS SDK for Java 1.x 네임스페이스이고, 1.x 는
      2025년 12월 31일 지원이 종료되었습니다. 같은 교재의 슬라이드 35 예제 코드는
      이미 2.x 문법(DynamoDbClient.builder())을 사용하므로 교재 안에서 세대가 섞여 있습니다.
    replacement: >-
      하위 수준은 software.amazon.awssdk.services.dynamodb.DynamoDbClient 와
      software.amazon.awssdk.services.dynamodb.model.*, 상위 수준은
      software.amazon.awssdk.enhanced.dynamodb.DynamoDbEnhancedClient (DynamoDB Enhanced Client)
    evidence: https://docs.aws.amazon.com/sdk-for-java/v1/developer-guide/getting-started.html

  - id: boto3-resource-interface-dynamodb
    module: M07
    state: discouraged
    title: boto3 리소스(resource) 인터페이스
    courseware_location: '슬라이드 33 Python 열 · 슬라이드 36 "Python 예제: DynamoDB 서비스 클라이언트 생성"'
    detail: >-
      AWS Python SDK 팀은 boto3 리소스 인터페이스에 새 기능을 추가할 계획이 없습니다.
      기존 인터페이스는 boto3 수명 주기 동안 계속 동작하지만 최신 서비스 기능은
      클라이언트 인터페이스를 통해 제공됩니다. boto3 의 DynamoDB 상위 수준 인터페이스가
      바로 이 리소스 인터페이스(boto3.resource('dynamodb') 와 dynamodb.Table)이므로,
      교재 슬라이드 33 의 Python 상위 수준 칸이 비어 있는 이유를 설명할 때 이 점을
      함께 알려야 합니다. 슬라이드 36 은 boto3.client('dynamodb') 를 만들면서 바로 위
      주석에 "서비스 리소스 가져오기"라고 적어 두 인터페이스를 혼동시킵니다.
    replacement: boto3 클라이언트 인터페이스 boto3.client('dynamodb')
    evidence: https://boto3.amazonaws.com/v1/documentation/api/latest/guide/resources.html

  - id: dynamodb-latency-10ms-wording
    module: M07
    state: changed
    title: "'10밀리초 미만' 지연 시간 표기"
    courseware_location: '슬라이드 10 "애플리케이션 개발에 Amazon DynamoDB를 선택해야 하는 이유" 강사 노트'
    detail: >-
      교재는 "규모와 관계없이 10밀리초 미만의 대기 시간", "평균 서비스 지연 시간은 보통
      10밀리초 미만"으로 기재합니다. 현재 DynamoDB 공식 문서의 표현은
      "한 자리 밀리초(single-digit millisecond) 성능"입니다.
    replacement: 규모와 관계없이 한 자리 밀리초 성능
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html

  - id: elasticache-engine-list
    module: M07
    state: changed
    title: ElastiCache 지원 엔진 목록
    courseware_location: '슬라이드 6 "AWS 데이터베이스 서비스 비교" 강사 노트'
    detail: >-
      교재는 "Amazon ElastiCache - 완전관리형 Redis 또는 Memcached 엔진을 지원하는
      인 메모리 데이터 캐시"로 기재합니다. 현재 ElastiCache 는 Valkey, Memcached,
      Redis OSS 세 엔진을 지원하고 서버리스와 노드 기반 배포 옵션을 제공합니다.
    replacement: 'Valkey, Memcached, Redis OSS'
    evidence: https://docs.aws.amazon.com/decision-guides/latest/databases-on-aws-how-to-choose/databases-on-aws-how-to-choose.html

  - id: aws-database-service-table
    module: M07
    state: changed
    title: AWS 데이터베이스 서비스 비교 표
    courseware_location: 슬라이드 6 "AWS 데이터베이스 서비스 비교"
    detail: >-
      교재 표는 관계형 행에 Amazon RDS 와 Amazon Redshift 를 함께 넣고, 강사 노트에서
      Amazon Aurora 를 RDS 가 지원하는 엔진 중 하나로 기재합니다. 현재 AWS 결정 안내서는
      OLTP 관계형 계열을 Aurora 계열(Aurora PostgreSQL 호환, Aurora MySQL 호환,
      Aurora DSQL)과 RDS 엔진 6종(PostgreSQL, MySQL, MariaDB, SQL Server, Oracle, Db2)의
      합계 9개 엔진으로 설명하고, Amazon Redshift 는 OLAP 데이터 웨어하우징 서비스로
      OLTP 표에서 분리합니다. Amazon MemoryDB, Aurora PostgreSQL Limitless Database,
      벡터 데이터 모델은 교재에 없습니다. 교재 표에도 "이 표는 AWS 데이터베이스 서비스의
      전체 목록이 아닙니다"라는 각주가 붙어 있습니다.
    replacement: >-
      관계형(Aurora 계열 + RDS 6종) / 키 값(DynamoDB) / 문서(DocumentDB) /
      인 메모리(ElastiCache, MemoryDB) / 그래프(Neptune) / 시계열(Timestream) /
      와이드 컬럼(Keyspaces). Redshift 는 OLAP
    evidence: https://docs.aws.amazon.com/decision-guides/latest/databases-on-aws-how-to-choose/databases-on-aws-how-to-choose.html

  - id: nosql-workbench-three-tools
    module: M07
    state: changed
    title: NoSQL Workbench 세 도구 구성
    courseware_location: 슬라이드 22 "NoSQL Workbench"
    detail: >-
      교재는 도구를 데이터 모델러 / 시각화 프로그램(visualizer) / 작업 빌더 세 가지로
      소개합니다. 현재 DynamoDB 공식 문서는 데이터 모델러(Data modeler)와
      작업 빌더(Operation builder) 두 가지만 나열하고 시각화를 별도 도구로 두지 않습니다.
      데이터 모델러가 샘플 데이터 구성과 액세스 패턴 검증까지 담당합니다. 또 현재
      NoSQL Workbench 에는 DynamoDB local 이 포함되어 있습니다. Amazon Keyspaces 쪽
      문서에는 여전히 시각화(visualizer) 항목이 있습니다.
    replacement: '데이터 모델러, 작업 빌더 (DynamoDB local 포함)'
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/workbench.html

  - id: dynamodb-quotas-page-split
    module: M07
    state: changed
    title: 'DynamoDB 할당량 문서 경로 Limits.html'
    courseware_location: '슬라이드 17 "보조 인덱스" 강사 노트의 Limits.html 링크'
    detail: >-
      교재가 인용한 Limits.html 은 현재 ServiceQuotas.html 로 리디렉션됩니다.
      또한 문서가 두 페이지로 나뉘어, 조정 가능한 서비스 할당량은 ServiceQuotas.html
      (Quotas in Amazon DynamoDB), 항목 크기·키 길이·데이터 형식 같은 고정 제약은
      Constraints.html (Constraints in Amazon DynamoDB) 에 있습니다.
    replacement: >-
      https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ServiceQuotas.html
      (할당량) 및
      https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Constraints.html
      (제약)
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ServiceQuotas.html

  - id: java-sdk-using-html-path
    module: M07
    state: changed
    title: 'Java SDK 서비스 클라이언트 생성 문서 경로 using.html'
    courseware_location: '슬라이드 35 "Java 예제: DynamoDB 서비스 클라이언트 생성" 강사 노트 링크'
    detail: >-
