  # ------------------------------------------------------------------ changed
  - id: xray-console-superseded
    status: changed
    title: X-Ray 콘솔이 CloudWatch 콘솔로 대체됨
    courseware_location: 슬라이드 26 다이어그램 · 슬라이드 36 데모 노트
    courseware_says: 'X-Ray 콘솔을 트레이스 확인 창구로 제시'
    verified: AWS 는 X-Ray 콘솔을 더 이상 개발하지 않는다. CloudWatch 콘솔에 X-Ray 콘솔에서 재설계된 기능이 들어 있고 X-Ray 콘솔의 모든 기능을 포함한다.
    evidence: xray-console-not-developed
    replacement: Amazon CloudWatch 콘솔
    courseware_internal: false

  - id: service-map-to-trace-map
    status: changed
    title: 서비스 맵과 ServiceLens 맵이 트레이스 맵으로 통합됨
    courseware_location: 슬라이드 26·30·31 · 슬라이드 36
    courseware_says: '서비스 맵(Service map)'
    verified: X-Ray 서비스 맵과 CloudWatch ServiceLens 맵은 CloudWatch 콘솔의 X-Ray 트레이스 맵으로 통합되었다. 현재 X-Ray 개요 문서도 이 도식을 트레이스 맵이라 부른다.
    evidence: xray-servicemap-merged
    replacement: CloudWatch 콘솔의 X-Ray 트레이스 맵
    courseware_internal: false

  - id: cloudwatch-events-renamed
    status: changed
    title: CloudWatch Events 가 Amazon EventBridge 로 이름이 바뀜
    courseware_location: 슬라이드 20 강사 노트
    courseware_says: 'CloudWatch Events를 생성하여 향후 이벤트를 알림'
    verified: EventBridge 는 이전에 CloudWatch Events 라 불렸다. API 는 동일하고 기존 규칙도 그대로 보이지만, EventBridge 에 추가되는 새 기능은 CloudWatch Events 에 추가되지 않는다.
    evidence: eventbridge-rename
    replacement: Amazon EventBridge
    courseware_internal: false

  - id: lambda-passive-tracing-removed
    status: changed
    title: Lambda 가 업스트림 헤더만으로 트레이스를 자동 전송하지 않음
    courseware_location: 슬라이드 27·36 (트레이싱 모드 미언급)
    courseware_says: 'API Gateway → Lambda 트레이스가 자연히 수집되는 것으로 전제'
    verified: 이전에는 API Gateway 같은 업스트림이 트레이싱 헤더를 추가하면 Lambda 가 트레이스를 자동으로 보냈다. 지금은 보내지 않으며 Active 트레이싱을 명시적으로 켜야 한다. Active 를 켜지 않으면 기본값은 PassThrough 다.
    evidence: lambda-xray-passive-change
    replacement: 'Tracing 을 Active 로 설정 (SAM 템플릿의 Tracing 속성 또는 콘솔)'
    courseware_internal: false

  - id: lambda-segment-structure
    status: changed
    title: Lambda X-Ray 세그먼트 구조가 바뀌는 중
    courseware_location: 슬라이드 27 다이어그램
    courseware_says: '초기화 / 호출 하위 세그먼트로 나뉜 구조'
    verified: 기존 형식은 Initialization·Invocation·Overhead 하위 세그먼트를 가졌다. 새 형식에는 Invocation 세그먼트가 없고 Init 하위 세그먼트만 남으며, 사용자 하위 세그먼트가 함수 세그먼트에 직접 붙고 aws.responseLatency 등이 주석으로 담긴다. AWS 가 전환을 진행 중이라 계정 안에서 두 형식이 섞여 보일 수 있다.
    evidence: lambda-xray-subsegments-new
    courseware_internal: false

  - id: cloudwatch-agent-collects-traces
    status: changed
    title: CloudWatch 에이전트가 트레이스도 수집함
    courseware_location: 슬라이드 17·18·19
    courseware_says: 'CloudWatch 에이전트 - Amazon EC2, On-premises servers (지표·로그 수집 용도로만 제시)'
    verified: CloudWatch 에이전트는 EC2·온프레미스·컨테이너화된 애플리케이션에서 지표·로그·트레이스를 수집한다. 버전 1.300025.0 이상은 OpenTelemetry 또는 X-Ray 클라이언트 SDK 의 트레이스를 X-Ray 로 보내므로 별도 트레이스 수집 데몬이 필요하지 않다.
    evidence: cw-agent-traces
    courseware_internal: false

  - id: cloudwatch-otel-metrics
    status: changed
    title: CloudWatch 가 OpenTelemetry 지표를 지원함
