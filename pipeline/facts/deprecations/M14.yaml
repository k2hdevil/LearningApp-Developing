# 모듈 14(애플리케이션 관찰) 교재 대비 변경 사항 대장
#
# status 값
#   incorrect   교재 기술 오류
#   changed     동작·기본값·이름이 변경됨
#   discouraged 비권장 (대체 경로가 권장됨)
#   ended       지원 종료 또는 일반 제공 종료
#
# courseware_internal: true 는 외부 문서와의 불일치가 아니라 교재 안에서
# 서로 어긋나는 경우입니다. 이 항목에는 evidence 를 비워 둡니다.

module: M14-Observability_Summary
verified_on: '2026-08-25'

items:
  # ---------------------------------------------------------------- incorrect
  - id: alarm-doc-url-path
    status: incorrect
    title: 경보 사용 설명서 URL 경로
    courseware_location: 슬라이드 15 강사 노트
    courseware_says: 'https://docs.aws.amazon.com/AmazonCloudWatch/latest/DeveloperGuide/AlarmThatSendsEmail.html'
    verified: 현재 경로는 /AmazonCloudWatch/latest/monitoring/AlarmThatSendsEmail.html 이다. DeveloperGuide 경로는 유효하지 않다.
    evidence: cw-alarm-doc-path
    courseware_internal: false

  - id: cli-metric-name-mismatch
    status: incorrect
    title: CLI 예시의 경보 이름과 지표 불일치
    courseware_location: 슬라이드 17·18·19 터미널 예시
    courseware_says: '--alarm-name NotesWriteCapacityUnitsLimit 인데 --metric-name ConsumedReadCapacityUnits'
    verified: 쓰기 용량 경보라면 지표는 ConsumedWriteCapacityUnits 여야 한다. 두 지표는 별개로 존재한다.
    evidence: ddb-capacity-metrics
    courseware_internal: false

  - id: cli-wrong-dimension
    status: incorrect
    title: DynamoDB 네임스페이스에 EC2 측정 기준 사용
    courseware_location: 슬라이드 17·18·19 터미널 예시
    courseware_says: '--namespace AWS/DynamoDB 와 --dimensions "Name=InstanceId,Value=i-12345678" 을 함께 사용'
    verified: DynamoDB 지표의 측정 기준은 TableName, GlobalSecondaryIndexName, Operation, OperationType, Verb, ReceivingRegion, Source, StreamLabel, DelegatedOperation 이다. InstanceId 는 없다.
    evidence: ddb-dimensions
    courseware_internal: false

  - id: cli-alarm-action-arn
    status: incorrect
    title: 경보 작업에 CloudWatch 경보 ARN 지정
    courseware_location: 슬라이드 17·18·19 터미널 예시
    courseware_says: '--alarm-actions arn:aws:cloudwatch:us-east-2:111122223333:alarm:Notes-WriteCapacityUnitsLimit-BasicAlarm'
    verified: AlarmActions 유효 값은 EC2 작업, Auto Scaling 정책, Lambda 함수, SNS 주제, Systems Manager OpsItem·대응 계획, Amazon Q Developer 운영 조사 ARN 이다. CloudWatch 경보 ARN 은 유효 값이 아니다.
    evidence: cw-putmetricalarm-actions
    courseware_internal: false

  - id: cli-missing-evaluation-periods
    status: incorrect
    title: datapoints-to-alarm 만 있고 evaluation-periods 가 없음
    courseware_location: 슬라이드 17·18·19 터미널 예시
    courseware_says: '--datapoints-to-alarm 5 만 지정'
    verified: DatapointsToAlarm 은 M out of N 경보의 M 이고 EvaluationPeriods 가 N 이다. N 없이 M 만 주면 의도한 평가 동작을 정의할 수 없다.
    evidence: cw-putmetricalarm-mn
    courseware_internal: false

  - id: cli-missing-threshold
    status: incorrect
    title: 임계값과 비교 연산자 누락
    courseware_location: 슬라이드 17·18·19 터미널 예시
    courseware_says: '--threshold 와 --comparison-operator 가 없음'
    verified: 임계값과 비교 연산자가 없으면 경보가 무엇을 위반으로 볼지 정의되지 않는다. ComparisonOperator 유효 값은 GreaterThanOrEqualToThreshold 등 네 가지(이상 탐지 경보는 세 가지 추가)다.
    evidence: cw-comparison-operators
    courseware_internal: false

  - id: cli-split-into-two-lines
    status: incorrect
    title: CLI 명령이 두 줄로 분리되어 있음
    courseware_location: 슬라이드 17·18·19 터미널 예시
    courseware_says: '--dimensions 절이 줄바꿈 이후 별도 줄에 놓여 있고 줄 연결 문자가 없음'
    verified: 그대로 붙여 넣으면 두 개의 명령으로 실행되어 --dimensions 절이 유실된다. 줄을 이으려면 셸의 줄 연결 문자가 필요하다.
    evidence: cw-dimension-syntax
    courseware_internal: false

  - id: three-pillars-inconsistent
    status: incorrect
    title: 3대 요소를 슬라이드마다 다르게 표기
    courseware_location: 슬라이드 8·9 대 슬라이드 25
    courseware_says: '슬라이드 8·9 는 로깅 / 지표 / 트레이싱, 슬라이드 25 는 로깅 / 모니터링 / 트레이싱'
    verified: 슬라이드 38 지식 확인 2번 해설이 "지표, 트레이스 및 로그"라고 못박으므로 슬라이드 25 가 틀린 쪽이다.
    evidence: ''
    courseware_internal: true

  - id: cloudwatch-does-tracing
    status: incorrect
    title: CloudWatch 기능에 트레이싱을 넣어 놓고 트레이싱은 X-Ray 에 배정
    courseware_location: 슬라이드 11 강사 노트 대 슬라이드 9
    courseware_says: '슬라이드 11 은 CloudWatch 의 기능으로 "지표 수집 및 트레이싱"을 들고, 슬라이드 9 는 트레이싱을 AWS X-Ray 에 배정'
    verified: 두 슬라이드의 역할 배분이 어긋난다. 실제로는 X-Ray 트레이스를 CloudWatch 콘솔에서 보는 구조이므로 둘 다 부분적으로만 맞다.
    evidence: ''
    courseware_internal: true

  - id: cold-start-typo
    status: incorrect
    title: 콜드 스타트 표기 오류
    courseware_location: 슬라이드 27 다이어그램
    courseware_says: 'code-start 컨테이너 다운로드'
    verified: cold start 의 오타다. Lambda 실행 환경 초기화는 Init 단계에서 확장 시작(Extension init), 런타임 부트스트랩(Runtime init), 함수 정적 코드 실행(Function init) 세 작업을 수행한다. 함수 코드와 레이어 다운로드는 AWS::Lambda 세그먼트가 담는 실행 환경 준비 과정에 포함된다.
    evidence: lambda-init-phase
    courseware_internal: false

  - id: fault-typo
    status: incorrect
    title: 결함을 결합으로 표기
    courseware_location: 슬라이드 30 강사 노트
    courseware_says: '성공한 호출과 오류 및 결합의 비율을 바탕으로 색상을 적용'
    verified: X-Ray 는 오류를 Error(400 시리즈), Fault(500 시리즈), Throttle(429)로 분류한다. 문맥상 결함(fault)의 오타다.
    evidence: xray-error-classification
    courseware_internal: false

  - id: logging-protocols-term
    status: incorrect
    title: 로깅 프레임워크를 프로토콜이라 표기
    courseware_location: 슬라이드 16 본문
    courseware_says: '지원되는 로깅 프로토콜 - Apache log4net, Apache Log4j, Nlog, Serilog'
    verified: 이들은 프로토콜이 아니라 로깅 프레임워크·라이브러리다. CloudWatch Logs 에 로그를 보내는 방법으로 문서가 드는 것은 CloudWatch 에이전트, AWS CLI 의 put-log-events, PutLogEvents API 다.
    evidence: cw-logs-send-methods
    courseware_internal: false

  - id: alarm-consecutive-periods
    status: incorrect
    title: 경보 평가를 연속 기간으로만 설명
    courseware_location: 슬라이드 15 강사 노트
    courseware_says: '임계값이 연속 기간 3개에 대해 위반된 경우에만 경보가 작업을 호출합니다'
    verified: 실제 동작은 M out of N 이다. Datapoints to Alarm(M)이 Evaluation Periods(N)보다 작으면 연속이 아니어도 경보가 발생한다. 또 평가 범위가 N 보다 넓어 누락 데이터가 있으면 더 과거 데이터 포인트를 끌어와 평가한다.
    evidence: cw-alarm-m-of-n
    courseware_internal: false

  - id: alarm-single-metric-only
    status: incorrect
    title: 경보가 감시하는 대상을 단일 지표로 한정
    courseware_location: 슬라이드 13 본문 · 슬라이드 38 지식 확인 5번
    courseware_says: '경보는 지정된 기간 동안 단일 지표를 관찰하고'
    verified: 지표 경보는 단일 CloudWatch 지표 또는 지표 math 표현식의 결과를 감시한다. 그 밖에 PromQL 경보, 로그 경보, 다른 경보의 상태를 조합하는 복합 경보가 있다.
    evidence: cw-alarm-types
    courseware_internal: false

  - id: fault-patterns-mismatch
    status: incorrect
    title: 흔한 결함 패턴 목록이 문서와 다름
    courseware_location: 슬라이드 21 본문
    courseware_says: '무한 루프 / 다운스트림 속도 저하 / 잘못된 API 버전 / 트리거 확인'
    verified: Application Insights 문서가 추가 인사이트를 제공한다고 드는 흔한 문제는 .NET·SQL 스택의 애플리케이션 지연 시간, SQL Server 백업 실패, 메모리 누수, 대용량 HTTP 요청, 취소된 I/O 작업이다. 교재 목록과 겹치지 않는다.
    evidence: cw-app-insights-stacks
    courseware_internal: false

  - id: runsqlquery-void-await
    status: incorrect
    title: void 메서드에서 await 사용
    courseware_location: 슬라이드 34 예시 코드
    courseware_says: 'public void RunSqlQuery(string connectionString) 안에서 await command.ExecuteXmlReaderAsync() 호출'
    verified: void 메서드에서는 await 를 쓸 수 없다. async Task 로 선언해야 컴파일된다. 이 문서는 코드를 그대로 싣지 않고 교정해 실었다.
    evidence: ''
    courseware_internal: true

  - id: ihostingenvironment-old
    status: incorrect
    title: 오래된 호스팅 환경 인터페이스 이름
    courseware_location: 슬라이드 34 예시 코드
