  - id: lambda-python38-runtime-ended
    module: M13
    state: ended
    title: python3.8 런타임
    courseware_location: '슬라이드 14·15 본문 템플릿의 "Runtime: python3.8" 과 슬라이드 22 본문의 "sam init --runtime python3.8"'
    detail: >-
      교재는 SAM 템플릿 두 곳과 sam init 예시에서 Lambda 런타임 python3.8 을
      씁니다. Lambda 런타임 문서의 Deprecated runtimes 표에 python3.8(Python 3.8,
      Amazon Linux 2)의 지원 종료일이 2024년 10월 14일, 함수 생성 차단이 2027년
      2월 1일, 함수 업데이트 차단이 2027년 3월 3일로 기재되어 있습니다. sam init
      의 --runtime 옵션은 여전히 python3.8 을 허용 값 목록에 두지만, 그 값으로
      만든 함수는 지원 종료된 런타임을 쓰게 됩니다. 현재 지원되는 Python 런타임은
      python3.15(지원 종료 미예정), python3.14, python3.13, python3.12,
      python3.11, python3.10 입니다.
    replacement: '지원되는 Python 런타임(python3.12 이상 권장. python3.13·python3.14 는 지원 종료 예정일 2029-06-30)'
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html

