    replacement: '개발 반복에는 sam sync --watch(AWS SAM Accelerate), 프로덕션 배포에는 sam deploy 또는 CI/CD 파이프라인'
    evidence: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/accelerate.html

  - id: sam-deployment-preference-missing
    module: M13
    state: changed
    title: 'AWS SAM 배포 전략을 CodeDeploy 설명만으로 다룸'
    courseware_location: '슬라이드 25~26 "배포 전략" 섹션 전체(슬라이드 3·32 의 모듈 목표 4번 "다양한 AWS SAM 배포 전략 설명"에 대응)'
    detail: >-
      교재의 배포 전략 섹션은 본문에 Canary, Linear, All-at-once 세 단어만 있고
      강사 노트 전체가 AWS CodeDeploy 설명입니다. AWS SAM 템플릿에서 배포 전략을
      선언하는 방법이 덱에 없습니다. 공식 문서는 AWS SAM 이 CodeDeploy 를 내장해
      점진적 Lambda 배포를 제공하며 몇 줄의 구성으로 새 버전 배포와 별칭 자동 생성,
      점진적 트래픽 이동, 사전·사후 트래픽 테스트 함수, CloudWatch 경보 기반 자동
      롤백을 해 준다고 기술합니다. 관련 속성은 AutoPublishAlias(별칭 이름을 주면
      SAM 이 Amazon S3 URI 변경으로 새 코드를 감지해 버전을 게시하고 별칭을 그
      버전으로 가리킴), DeploymentPreference 의 Type(Canary / Linear / AllAtOnce),
      Alarms(트리거되면 자동 롤백), Hooks(PreTraffic / PostTraffic 검증 함수)입니다.
      사전 정의 Type 값은 Canary10Percent30Minutes, Canary10Percent5Minutes,
      Canary10Percent10Minutes, Canary10Percent15Minutes,
      Linear10PercentEvery10Minutes, Linear10PercentEvery1Minute,
      Linear10PercentEvery2Minutes, Linear10PercentEvery3Minutes, AllAtOnce 아홉
      개이며 SAM 표기는 All-at-once 가 아니라 AllAtOnce 입니다.
      DeploymentPreference 를 지정하면 SAM 이 스택당 하나인 CodeDeploy 애플리케이션
      (ServerlessDeploymentApplication), 함수별 배포 그룹, CodeDeployServiceRole
      역할을 만듭니다. CodeDeploy 는 트래픽을 옮겨 올 이전 버전을 요구하므로 첫
      점진적 배포는 AutoPublishAlias 만으로 한 번 배포한 뒤 DeploymentPreference 를
      추가하는 두 단계로 해야 합니다.
    replacement: 'AWS::Serverless::Function 의 AutoPublishAlias + DeploymentPreference(Type / Alarms / Hooks). 첫 배포는 2단계'
    evidence: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/automating-updates-to-serverless-apps.html

  - id: codedeploy-predefined-config-names-missing
    module: M13
    state: changed
    title: '배포 구성을 Canary / Linear / All-at-once 세 단어로만 제시'
    courseware_location: '슬라이드 26 본문의 텍스트 상자 3개와 강사 노트의 AWS Lambda 컴퓨팅 플랫폼 설명'
    detail: >-
      교재는 사전 정의 배포 구성의 이름을 하나도 제시하지 않습니다. CodeDeploy 의
      Lambda 컴퓨팅 플랫폼용 사전 정의 배포 구성은 아홉 개이고 이름이 정해져
      있습니다. CodeDeployDefault.LambdaCanary10Percent5Minutes,
      LambdaCanary10Percent10Minutes, LambdaCanary10Percent15Minutes,
      LambdaCanary10Percent30Minutes, CodeDeployDefault.LambdaLinear10PercentEvery1Minute,
      LambdaLinear10PercentEvery2Minutes, LambdaLinear10PercentEvery3Minutes,
      LambdaLinear10PercentEvery10Minutes, CodeDeployDefault.LambdaAllAtOnce.
      EC2/온프레미스 플랫폼의 사전 정의 구성은 CodeDeployDefault.AllAtOnce,
      HalfAtATime, OneAtATime 세 개이고 배포 구성을 지정하지 않으면
      CodeDeployDefault.OneAtATime 이 쓰입니다. 교재는 이 기본값도 다루지 않고,
      컴퓨팅 플랫폼을 EC2/온프레미스와 Lambda 둘로만 설명해 Amazon ECS 플랫폼을
