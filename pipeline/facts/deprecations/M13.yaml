    detail: >-
      교재의 워크플로는 sam init → sam build → sam local invoke → sam deploy
      네 단계입니다. 교재 이후 추가된 sam sync 는 로컬 변경을 클라우드에 계속
      동기화하며 AWS SAM Accelerate 의 일부입니다. --watch 옵션으로 실행하면
      애플리케이션을 빌드하고 CloudFormation 에 배포한 뒤 계속 실행되며 로컬 변경을
