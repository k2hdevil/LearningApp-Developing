  - id: cloudformation-change-sets-missing
    module: M13
    state: changed
    title: 'sam deploy 가 CloudFormation 변경 세트를 거친다는 사실이 교재에 없음'
    courseware_location: '슬라이드 24 본문의 배포 예시와 슬라이드 21 다이어그램의 "AWS CloudFormation → 스택" 구간'
    detail: >-
      교재는 sam deploy 를 실행하면 스택이 만들어진다고만 보여 주고 그 사이의
      변경 세트를 다루지 않습니다. sam deploy 는 CloudFormation 변경 세트를 만들어
      배포하며 --confirm-changeset 으로 실행 전 확인을 요구할 수 있고
      --no-execute-changeset 으로 변경 세트만 만들고 종료할 수 있습니다.
      sam deploy --guided 의 "Confirm changes before deploy" 프롬프트가 바로 이
      선택이고, 확인 화면에 추가·수정·삭제될 리소스 목록과 Replacement 여부가
      표시됩니다. CloudFormation 문서는 변경 세트가 제안한 변경이 실행 중인 리소스에
      줄 영향을 미리 보여 주고, 사용자가 실행하기로 결정할 때만 스택을 변경하며,
      변경 세트 생성 중에 속성 구문 오류·리소스 이름 충돌·서비스 할당량 한도 같은
      일반적인 실패 원인에 대해 배포 전 검증을 수행한다고 기술합니다. 롤백 관련
      옵션도 교재에 없습니다. 기본값은 오류 시 마지막 안정 상태로 롤백이고
      --disable-rollback 이나 --on-failure(ROLLBACK / DELETE / DO_NOTHING)로 바꿉니다.
    replacement: '변경 세트 검토(--confirm-changeset / --no-execute-changeset)와 롤백 제어(--on-failure)를 배포 절차에 포함'
    evidence: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-updating-stacks-changesets.html

  - id: sam-cli-install-prerequisites-changed
    module: M13
    state: changed
    title: 'AWS SAM CLI 설치 3단계(보안 인증 정보 구성 / 도커 설치(선택) / CLI 설치)'
    courseware_location: '슬라이드 19 "AWS SAM CLI 설치" 본문의 텍스트 상자 3개와 강사 노트 4단계'
    detail: >-
      교재는 사전 준비를 AWS 계정 생성, IAM 권한·보안 인증 정보 구성, 도커
      설치(선택), AWS SAM CLI 설치로 제시합니다. 현재 사전 요구 사항 페이지는
      AWS 계정과 IAM 자격 증명·액세스 키 페어, 그리고 자격 증명 구성을 위한
      AWS CLI 를 요구 사항으로 명시하고 단계를 AWS 계정 가입 → AWS CLI 설치 →
      AWS CLI 로 자격 증명 구성 → (선택) AWS Toolkit for VS Code 설치로 제시합니다.
      이 페이지에는 도커 항목이 없습니다. 대신 도커는 로컬 테스트에서 필요합니다.
      sam local invoke 문서는 AWS SAM CLI 가 도커를 사용해 로컬 컨테이너에서 함수를
      빌드한 다음 호출한다고 명시하므로, 로컬 테스트를 하려면 도커가 사실상
      필수입니다. 설치 방법도 바뀌었습니다. 2023년 9월부터 AWS 는 AWS 관리형
      Homebrew 설치 관리자를 유지하지 않고 운영 체제별 첫 번째 당사자 설치 방법을
      권장하며, AWS SAM CLI 는 MacOS 13.x 보다 오래된 버전을 지원하지 않습니다.
    replacement: 'AWS 계정 → AWS CLI 설치 → aws configure 로 자격 증명 구성 → AWS SAM CLI 설치. 로컬 테스트를 하려면 도커 필요, (선택) AWS Toolkit for VS Code'
    evidence: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/prerequisites.html

  - id: sam-policy-templates-missing
    module: M13
    state: changed
    title: 'Policies 값으로 AWS 관리형 정책 이름만 제시'
    courseware_location: '슬라이드 14 본문 템플릿의 "Policies: AmazonDynamoDBReadOnlyAccess" 줄과 강사 노트'
    detail: >-
      교재는 Policies 값의 예로 AWS 관리형 정책 이름 하나만 듭니다. 문서는 Policies
      가 받는 값으로 AWS SAM 정책 템플릿, AWS 관리형·고객 관리형 정책의 ARN,
      정해진 목록에 있는 AWS 관리형 정책의 이름, YAML 맵으로 작성한 인라인 IAM 정책
      네 가지를 제시합니다. AWS SAM 정책 템플릿은 Lambda 함수와 Step Functions 상태
      머신의 권한을 애플리케이션이 쓰는 리소스로 좁히기 위한 사전 정의 정책이며 표에
      79행이 있습니다. 자리표시자 값이 필요한 템플릿은 객체로, 필요 없는 템플릿은
      빈 객체로 지정해야 하고 빈 객체를 빠뜨리면 sam build 에서 오류가 납니다.
      DynamoDB 관련 템플릿은 DynamoDBReadPolicy, DynamoDBWritePolicy,
      DynamoDBCrudPolicy, DynamoDBStreamReadPolicy, DynamoDBReconfigurePolicy,
      DynamoDBBackupFullAccessPolicy, DynamoDBRestoreFromBackupPolicy 입니다.
    replacement: 'Policies 에 SAM 정책 템플릿(예: DynamoDBReadPolicy 와 TableName 자리표시자)을 써서 대상 리소스로 권한을 좁힘'
    evidence: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-policy-templates.html

  # ---------------------------------------------------------------
  # discouraged — 동작하지만 권장되지 않음
  # ---------------------------------------------------------------
  - id: sam-package-as-separate-step
    module: M13
    state: discouraged
    title: 'sam build && sam package --s3-bucket <bucket_name>'
    courseware_location: '슬라이드 24 본문 첫 예시와 강사 노트("sam package 및 sam deploy 명령을 사용합니다")'
    detail: >-
      교재는 배포 전에 sam package 로 아티팩트를 만들고 S3 버킷 이름을 직접 넘기는
      절차를 제시합니다. sam package 명령 참조 문서는 참고(Note)로 "sam deploy 가
      이제 sam package 의 기능을 암시적으로 수행한다. sam deploy 명령을 직접 써서
      애플리케이션을 패키징하고 배포할 수 있다" 고 명시합니다. sam deploy 는 .zip
      아티팩트를 압축해 S3 에 업로드하고 필요하면 버킷을 새로 만들며(출력에
      Managed S3 bucket 으로 표시), 컨테이너 이미지는 Amazon ECR 에 업로드하고
      필요하면 리포지토리를 만듭니다. 버킷을 자동 생성하려면 --resolve-s3 를 쓰고
      --s3-bucket 과 함께 지정하면 오류가 납니다. sam package 자체는 폐기되지
      않았으므로 패키징된 템플릿을 파일로 얻어야 하는 경우
      (--output-template-file)에는 여전히 유용합니다.
    replacement: 'sam build 후 sam deploy(필요하면 --resolve-s3). 패키징 결과 템플릿이 따로 필요할 때만 sam package'
    evidence: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-cli-command-reference-sam-package.html

  - id: broad-managed-policy-for-function
    module: M13
    state: discouraged
    title: AmazonDynamoDBReadOnlyAccess
    courseware_location: '슬라이드 14 본문 템플릿의 Policies 줄'
    detail: >-
      교재는 list 함수에 AWS 관리형 정책 AmazonDynamoDBReadOnlyAccess 를 붙입니다.
      Policies 에 지정한 정책은 함수의 기본 IAM 실행 역할에 추가되므로, 계정의 모든
      DynamoDB 테이블을 읽을 수 있는 권한이 함수에 붙습니다. SAM 정책 템플릿을 쓰면
      대상 테이블을 자리표시자로 지정해 권한을 그 테이블로 좁힐 수 있고
      (예: DynamoDBReadPolicy 에 TableName 지정), 커넥터를 쓰면 함수와 테이블
      사이의 Read / Write 의도만 선언하고 SAM 이 필요한 권한을 생성합니다.
      실습·데모용으로는 동작하지만 최소 권한 원칙과 거리가 있습니다.
    replacement: 'DynamoDBReadPolicy 정책 템플릿 또는 AWS::Serverless::Connector 로 대상 리소스에 한정'
    evidence: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-policy-templates.html

