    title: 'samconfig.toml 구성 파일이 교재에 없음'
    courseware_location: '슬라이드 21 강사 노트의 Deploy 항목과 슬라이드 24 본문의 배포 예시 세 줄'
    detail: >-
      교재는 배포 설정을 저장하는 구성 파일을 한 번도 언급하지 않습니다.
      sam deploy --guided 는 대화형 흐름의 응답을 프로젝트의 samconfig.toml 에
      기록하고, 이후 배포에서는 sam deploy 만 실행해도 그 값으로 배포합니다. 대화형
      흐름의 기본값은 ~/.aws/config, ~/.aws/credentials, 프로젝트의 samconfig.toml
      세 곳에서 가져오고 대괄호가 기본값을 표시합니다. 묻는 항목에는 Stack Name,
