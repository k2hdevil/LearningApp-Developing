    replacement: 'Lambda 플랫폼 사전 정의 구성 9개(CodeDeployDefault.Lambda* 계열). EC2/온프레미스 기본값은 CodeDeployDefault.OneAtATime'
    evidence: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations.html

  - id: samconfig-toml-missing
    module: M13
