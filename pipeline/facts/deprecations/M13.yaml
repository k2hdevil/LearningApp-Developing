# 폐기·변경 레지스트리 (M13 · 모듈 13 애플리케이션 배포)
#
# 교재(Developing on AWS 강사용 덱)에 등장하지만 현재는 종료·비권장·변경된 항목을 기록합니다.
# 본문에서 조용히 지우지 않고 여기에 근거와 함께 남긴 뒤, 모듈 문서의
# '교재 대비 변경 사항' 장에 delta로 표시합니다. 수강생이 공식 교재를 들고
# 있으므로 "책에는 있는데 자료에는 없다"는 질문에 답할 수 있어야 합니다.
#
# state 값
#   ended       : 서비스·버전 지원 종료. 본문에서 제거하고 대체안을 제시한다.
#   discouraged : 동작하지만 권장되지 않음. 본문 주 경로에서 빼고 주의로만 남긴다.
#   changed     : 동작·기본값·표기가 바뀜. 본문을 새 내용으로 교체한다.
#   incorrect   : 교재 기술이 사실과 다름. 교정한다.
#
# courseware_internal: true 는 교재 안에서 본문과 강사 노트가 어긋나는 등
#   외부 문서로 검증할 대상이 아닌 항목입니다. evidence 를 비워 둡니다.
#
# verified_on 은 아래 항목을 공식 문서로 확인한 날짜입니다.

verified_on: 2026-09-01

items:
  # ---------------------------------------------------------------
  # incorrect — 교재 기술이 공식 문서와 다름 (외부 근거 있음)
  # ---------------------------------------------------------------
  - id: transform-lowercase-serverless
    module: M13
    state: incorrect
    title: 'Transform: AWS::serverless-2016-10-31'
    courseware_location: '슬라이드 14 "AWS SAM 템플릿 구조" 본문의 템플릿 두 번째 줄'
    detail: >-
      슬라이드 14 의 SAM 템플릿이 Transform 값을 AWS::serverless-2016-10-31 로 적어
      serverless 의 첫 글자가 소문자입니다. 공식 문서가 명시하는 값은
      AWS::Serverless-2016-10-31 로 대문자 S 이고, 이 선언은 AWS SAM 템플릿 파일에
      필수(required)이며 CloudFormation 템플릿 파일을 AWS SAM 템플릿 파일로
      식별하는 역할을 합니다. 같은 코드 블록의 리소스 유형은 Type
      AWS::Serverless::Function 으로 대문자 S 를 쓰므로 교재 안에서도 표기가
      갈립니다. 문서는 언어 확장을 쓸 때 AWS::LanguageExtensions 를 서버리스
      변환보다 앞에 두어야 한다는 순서 규칙도 제시합니다.
    replacement: 'Transform: AWS::Serverless-2016-10-31 (대문자 S)'
    evidence: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-specification-template-anatomy.html

  - id: globals-described-as-variables
    module: M13
    state: incorrect
    title: 'Globals 를 "AWS SAM 템플릿 내에서 사용할 전역 변수" 로 설명'
    courseware_location: '슬라이드 14 본문의 주석 텍스트 상자(TextBox 12), Globals 줄을 가리킴'
    detail: >-
      슬라이드 14 의 주석 상자가 Globals 를 전역 변수를 설정하는 섹션으로 설명합니다.
      공식 문서는 Globals 를 모든 서버리스 함수와 API 에 공통인 속성을 정의하는
      AWS SAM 고유 섹션으로 기술합니다. 동일한 Runtime, Memory, VPCConfig,
      Environment, Cors 구성을 가진 리소스가 여럿일 때 모든 리소스에 중복하지 않고
      한 번만 선언해 상속시키는 것이 목적입니다. 상속하는 리소스 유형은
      AWS::Serverless::Api, CapacityProvider, Function, HttpApi, SimpleTable,
      StateMachine, MicrovmImage, NetworkConnector 이고 리소스별로 지원되는 속성
      목록이 정해져 있습니다. 재정의 규칙도 있습니다. 원시 값은 리소스 값이 대체하고,
      맵은 병합되며 중복 키는 리소스 항목이 우선하고, 리스트는 Globals 항목이 리소스
      리스트 앞에 추가됩니다. 리소스는 Globals 에 선언한 속성에 새 값을 줄 수는
      있지만 제거할 수는 없습니다. 템플릿에서 값을 파라미터화하는 섹션은 Globals 가
      아니라 Parameters 입니다. 슬라이드 14 가 Globals 안에 적은 내용
      (Api 의 MethodSettings)도 변수가 아니라 리소스 속성의 공통값입니다.
    replacement: '여러 리소스가 공통으로 쓰는 속성을 한 번만 선언해 상속시키는 섹션. 값 파라미터화는 Parameters 섹션'
    evidence: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-specification-template-anatomy-globals.html

  - id: use-container-unavailable-for-python-dotnet
    module: M13
    state: incorrect
    title: '일부 언어(예: .NET 또는 Python)에서는 -use-container 옵션을 사용할 수 없습니다'
    courseware_location: '슬라이드 23 "AWS SAM 명령: build/local" 강사 노트의 첫 문단'
    detail: >-
      강사 노트가 .NET 또는 Python 에서 --use-container 를 쓸 수 없다고 단정합니다.
      현재 sam build 명령 참조 문서에는 런타임이나 언어에 따라 --use-container 를
      쓸 수 없다는 서술이 없습니다. 오히려 --build-image 옵션 설명이 --use-container
      와 함께 쓰는 예로 Python 빌드 이미지를 제시합니다
      (sam build --use-container --build-image amazon/aws-sam-cli-build-image-python3.8
      과 Function1 에 같은 이미지를 지정하는 키-값 형태). 문서가 명시하는
      --use-container 관련 제약은 --build-in-source 와 호환되지 않는다는 것뿐이고,
      --build-image / --container-env-var / --container-env-var-file 은 반대로
      --use-container 없이 쓰면 오류가 납니다. 또 강사 노트는 옵션을 -use-container
      로 하이픈 하나만 적는데 슬라이드 본문은 --use-container 로 올바르게 적어
      교재 안에서도 표기가 갈립니다. 정확한 표기는 --use-container 이고 짧은 형식은
      -u 입니다.
    replacement: '--use-container(-u)는 네이티브 컴파일 종속성이 있을 때 Lambda 같은 도커 컨테이너에서 빌드하는 옵션. 언어별 미지원 서술 없음. --build-in-source 와만 비호환'
    evidence: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-cli-command-reference-sam-build.html

  - id: template-file-labeled-config-file
    module: M13
    state: incorrect
    title: '"구성 파일을 사용하여 배포" 주석을 sam deploy --template-file 에 붙임'
    courseware_location: '슬라이드 24 "AWS SAM 명령: package/deploy" 본문 세 번째 예시와 슬라이드 21 강사 노트의 Deploy 항목'
    detail: >-
      슬라이드 24 는 주석 "# 구성 파일을 사용하여 배포" 아래에
      sam deploy --template-file deploy.yml 을 제시합니다. --template-file
      (--template, -t)은 AWS SAM 템플릿의 경로와 이름을 지정하는 옵션이고 기본값은
      template.[yaml|yml] 입니다. SAM 의 구성 파일은 --config-file 로 지정하며
      기본값은 프로젝트 루트의 samconfig.toml 이고 환경 이름은 --config-env
      (기본값 default)로 고릅니다. sam deploy --guided 가 응답을 samconfig.toml 에
      기록하고 이후 배포에서는 sam deploy 만 실행해도 그 값이 쓰입니다. 슬라이드 21
      강사 노트의 "구성 파일을 사용할 때 대화형 프롬프트를 통해 배포하려면
      sam deploy 명령을 실행합니다" 도 같은 혼동입니다. 대화형 배포(--guided)와
      구성 파일 기반 배포는 서로 다른 경로입니다.
    replacement: '템플릿 지정은 --template-file, 구성 파일 지정은 --config-file(기본값 samconfig.toml). 대화형 배포는 --guided'
    evidence: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-cli-command-reference-sam-deploy.html

  - id: delete-function-with-read-role
    module: M13
    state: incorrect
    title: 'Delete 함수에 DynamoDBReadRole 을 지정'
    courseware_location: '슬라이드 15 "AWS SAM 프로젝트 구조" 본문 템플릿의 Role 줄'
    detail: >-
      슬라이드 15 의 템플릿은 Delete 함수를 정의하면서 실행 역할로
      DynamoDBReadRole 이라는 읽기 역할을 지정합니다. DynamoDB 항목을 삭제하려면
      쓰기 권한이 필요하므로 이름과 목적이 어긋납니다. 또 슬라이드 14 는 Policies
      속성으로 관리형 정책 이름을 주고 슬라이드 15 는 Role 속성으로 기존 역할 ARN 을
      주는데, 문서는 Role 을 설정하면 Policies 가 무시된다고 명시하고 Role 을 주지
      않으면 논리 ID 가 함수-논리-ID + Role 인 역할이 자동 생성된다고 기술합니다.
      Policies 에는 관리형 정책 이름·ARN·인라인 정책과 함께 AWS SAM 정책 템플릿을
      쓸 수 있고, DynamoDB 용 정책 템플릿에는 DynamoDBReadPolicy(읽기 전용),
      DynamoDBWritePolicy(쓰기 전용), DynamoDBCrudPolicy(생성·읽기·업데이트·삭제)
      등이 있습니다. 정책 템플릿은 자리표시자로 대상 테이블을 지정해 권한을 그
      테이블로 좁힙니다.
    replacement: 'Delete 함수에는 DynamoDBCrudPolicy 또는 DynamoDBWritePolicy 를 TableName 자리표시자와 함께 지정'
    evidence: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html

  - id: canary-two-increments-mistranslation
    module: M13
    state: incorrect
    title: 'Canary - 트래픽이 2 증분씩 이동합니다'
    courseware_location: '슬라이드 26 "배포 전략" 강사 노트의 AWS Lambda 컴퓨팅 플랫폼 배포 구성 설명'
    detail: >-
      강사 노트가 Canary 를 "트래픽이 2 증분씩 이동합니다" 로 옮겨 증분 크기가 2
      라는 뜻으로 읽힙니다. 원문은 트래픽이 두 번의 증분으로 이동한다
      (Traffic is shifted in two increments)는 뜻입니다. 공식 문서는 첫 증분에서
      갱신된 Lambda 함수 버전으로 이동하는 트래픽 비율과 남은 트래픽이 두 번째
      증분으로 이동하기 전 간격(분)을 사전 정의 옵션에서 고른다고 기술하며,
      예를 들어 CodeDeployDefault.LambdaCanary10Percent10Minutes 는 첫 증분에서
      10%를 이동하고 나머지 90%를 10분 뒤 배포합니다. 같은 노트의 뒤 문장
      ("남은 트래픽이 두 번째 증분으로 이동하기 전에 완료됩니다")은 올바르게
      두 번의 증분을 전제하므로 교재 안에서도 어긋납니다.
    replacement: 'Canary 는 트래픽을 두 번의 증분으로 이동. 첫 증분 비율과 두 번째 증분까지의 간격(분)을 사전 정의 구성으로 선택'
    evidence: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations.html

  - id: continuous-delivery-requires-manual-approval
    module: M13
    state: incorrect
    title: '지속적 전달은 프로덕션에 배포하기 전에 수동 승인 단계를 거쳐야 합니다'
    courseware_location: '슬라이드 7 "DevOps 프로세스" 강사 노트의 두 번째 줄'
    detail: >-
      강사 노트가 지속적 전달의 정의에 수동 승인을 필수 조건으로 넣습니다. 공식
      문서는 지속적 전달을 릴리스 프로세스가 자동화된 소프트웨어 개발 방법론으로
      기술하고, 프로덕션으로의 최종 푸시 전에 사람, 자동화된 테스트 또는 비즈니스
      규칙(a person, an automated test, or a business rule)이 최종 푸시 시점을
      결정한다고 명시합니다. 즉 결정 주체가 사람일 수도 있지만 자동화된 테스트나
      비즈니스 규칙일 수도 있으므로 수동 승인이 필수는 아닙니다. 문서는 지속적
      통합이 코드를 자동으로 빌드·테스트하는 데 초점을 두고, 지속적 전달은 프로덕션
      까지의 전체 릴리스 프로세스를 자동화한다는 대비로 두 개념을 구분합니다.
    replacement: '지속적 전달은 릴리스 프로세스를 자동화하고, 최종 프로덕션 푸시 시점은 사람·자동화된 테스트·비즈니스 규칙 중 하나가 결정'
    evidence: https://docs.aws.amazon.com/codepipeline/latest/userguide/concepts-continuous-delivery-integration.html

  # ---------------------------------------------------------------
  # changed — 동작·구성·범위가 바뀜 (교재 이후 추가된 항목 포함)
  # ---------------------------------------------------------------
  - id: sam-resource-types-expanded
    module: M13
    state: changed
    title: 'AWS SAM 리소스 유형 6개 목록'
    courseware_location: '슬라이드 16 "AWS SAM 리소스" 본문의 텍스트 상자 4개'
    detail: >-
      교재는 AWS::Serverless::Api, HttpApi, Function, LayerVersion, SimpleTable,
      StateMachine 여섯 개를 제시합니다. 현재 AWS SAM 리소스·속성 참조 페이지가
      나열하는 유형은 열세 개입니다. Api, Application, CapacityProvider, Connector,
      Function, GraphQLApi, HttpApi, WebSocketApi, LayerVersion, MicrovmImage,
      NetworkConnector, SimpleTable, StateMachine. 교재의 여섯 개는 모두 현재도
      유효하고, 교재 이후 추가된 일곱 개 중 Connector(리소스 간 권한),
      GraphQLApi(AWS AppSync), WebSocketApi, Application(중첩 서버리스 애플리케이션)이
      서버리스 애플리케이션 설계에 직접 영향을 줍니다. 강사 노트의 매핑 표는 여섯
      유형 중 넷만 다루고 HttpApi 와 LayerVersion 의 대응 서비스를 빠뜨립니다.
    replacement: '13개 유형. 교재 6개 + Application / CapacityProvider / Connector / GraphQLApi / WebSocketApi / MicrovmImage / NetworkConnector'
    evidence: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-specification-resources-and-properties.html

  - id: sam-connector-added
    module: M13
    state: changed
    title: '리소스 간 권한을 Policies 또는 Role 로만 지정'
    courseware_location: '슬라이드 14 본문의 Policies 줄과 슬라이드 15 본문의 Role 줄'
    detail: >-
      교재는 Lambda 함수 권한을 관리형 정책 이름(Policies)이나 기존 역할
      ARN(Role) 두 방식으로만 제시합니다. 교재 이후 추가된
      AWS::Serverless::Connector 는 두 리소스 사이의 권한을 구성합니다. 소스
      리소스 안에 Connectors 블록을 두는 임베디드 커넥터 구문과 독립 리소스로
      선언하는 AWS::Serverless::Connector 구문 두 가지가 있고, 문서는 대부분의
      사용 사례에 임베디드 구문을 권장하며 중첩 스택 리소스나 공유 리소스처럼 같은
      템플릿에 없는 소스를 참조할 때 독립 리소스 구문을 쓰라고 안내합니다.
      Permissions 의 유효 값은 Read 와 Write 두 개이고, 이 의도 선언을 SAM 이 필요한
      IAM 권한으로 변환합니다. 예를 들어 Lambda 함수가 DynamoDB 테이블에 Write 하는
      연결은 함수 리소스 안에 Connectors 블록을 두고 Destination 에 테이블의 Id 를,
      Permissions 에 Write 를 지정합니다.
    replacement: 'AWS::Serverless::Connector 또는 리소스 내 Connectors 블록으로 Read / Write 의도를 선언'
    evidence: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-connector.html

  - id: sam-cli-commands-expanded
    module: M13
    state: changed
    title: 'AWS SAM CLI 명령 7개(init / build / local invoke / local start-api / local generate-event / package / deploy)'
    courseware_location: '슬라이드 20~24 "AWS SAM을 이용한 로컬 테스트" 와 "AWS SAM 명령" 세 슬라이드'
    detail: >-
      교재가 다루는 명령은 일곱 개입니다. 현재 AWS SAM CLI 명령 참조 페이지가
      나열하는 명령은 스물넷입니다. sam build, sam delete, sam deploy, sam init,
      sam list, sam local callback, sam local execution, sam local generate-event,
      sam local invoke, sam local start-api, sam local start-lambda, sam logs,
      sam package, sam pipeline bootstrap, sam pipeline init, sam publish,
      sam remote callback, sam remote execution, sam remote invoke,
      sam remote test-event, sam sync, sam traces, sam validate. 특히 sam validate
      는 슬라이드 12 강사 노트가 CLI 기능으로 언급하면서 이름을 주지 않은 그
      기능이고, sam delete 는 데모가 만든 스택을 정리하는 명령이며, sam remote
      invoke 는 클라우드에 배포된 리소스를 직접 호출합니다. sam local 의 하위
      명령도 교재의 셋이 아니라 여섯(callback, execution, generate-event, invoke,
      start-api, start-lambda)입니다.
    replacement: '24개 명령. 교재 7개 + validate / sync / delete / list / logs / traces / publish / pipeline / remote 계열 / local start-lambda 등'
    evidence: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-command-reference.html

  - id: sam-sync-accelerate-added
    module: M13
    state: changed
    title: 'AWS SAM 워크플로 4단계(시작 → 구축 → 테스트 → 배포)'
