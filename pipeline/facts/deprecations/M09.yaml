  - id: outdated-doc-urls
    module: M09
    state: changed
    title: '교재가 인용한 옛 문서 경로 (limits.html / gettingstarted-limits.html / intro-permission-model.html / dg 의 API 참조 경로)'
    courseware_location: '슬라이드 41 강사 노트의 limits.html, 슬라이드 50 강사 노트의 gettingstarted-limits.html, 슬라이드 20 강사 노트의 intro-permission-model.html 과 dg/API_AddPermission.html, 슬라이드 21 강사 노트의 dg/API_CreateEventSourceMapping.html'
