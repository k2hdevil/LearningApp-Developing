# 폐기·변경 레지스트리 (M09 · 모듈 9 애플리케이션 로직 처리)
#
# 교재(Developing on AWS 강사용 덱)에 등장하지만 현재는 종료·비권장·변경된 항목을 기록합니다.
# 본문에서 조용히 지우지 않고 여기에 근거와 함께 남긴 뒤, 모듈 문서의
# '교재 대비 변경 사항' 장에 delta로 표시합니다. 수강생이 공식 교재를 들고
# 있으므로 "책에는 있는데 자료에는 없다"는 질문에 답할 수 있어야 합니다.
#
# state 값
#   ended       : 서비스·버전 지원 종료. 본문에서 제거하고 대체안을 제시한다.
#   discouraged : 동작하지만 권장되지 않음. 본문 주 경로에서 빼고 주의로만 남긴다.
#   changed     : 동작·기본값·표기가 바뀜. 본문을 새 내용으로 교체한다.
#   incorrect   : 교재 기술이 사실과 다름. 교정한다.
#
# verified_on 은 아래 항목을 공식 문서로 확인한 날짜입니다.

verified_on: 2026-08-30

items:
  - id: python38-runtime
    module: M09
    state: ended
    title: python3.8 런타임
    courseware_location: '슬라이드 34 "Lambda 함수 생성(AWS CLI)" 의 --runtime python3.8'
    detail: >-
      교재 슬라이드 34 의 create-function 예제는 --runtime python3.8 을 사용하고 강사 노트도
      "python3.8용 Lambda 함수를 생성" 이라고 기재합니다. python3.8 은 폐기된 런타임 표에
      있으며 지원 종료일은 2024년 10월 14일, 함수 생성 차단은 2027년 2월 1일, 함수 업데이트
      차단은 2027년 3월 3일입니다. 운영 체제는 Amazon Linux 2 였습니다.
    replacement: 현재 지원 런타임 표의 Python 런타임(python3.12·python3.13·python3.14 등). 표의 예상 폐기일은 계획 목적이며 변경될 수 있으므로 실제 채택 전에 표를 다시 확인합니다
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html

  - id: dotnet-core-runtimes
    module: M09
    state: ended
    title: .NET Core 런타임(dotnetcore1.0 / 2.0 / 2.1 / 3.1)
    courseware_location: '슬라이드 10 강사 노트의 런타임 목록 ".NET Core" 와 슬라이드 48 ".zip 파일 아카이브 배포" 표의 ".NET Core" 열'
    detail: >-
      교재는 런타임 이름과 배포 패키지 구분에 ".NET Core" 를 씁니다. .NET Core 계열 런타임은
      모두 지원 종료되었습니다. dotnetcore3.1 은 2023년 4월 3일, dotnetcore2.1 은
      2022년 1월 5일, dotnetcore1.0 은 2019년 6월 27일, dotnetcore2.0 은 2019년 5월 30일에
      각각 지원 종료되었습니다. 현재 지원되는 .NET 런타임 이름은 .NET 8(dotnet8),
      .NET 9(dotnet9, 컨테이너 전용), .NET 10(dotnet10) 입니다.
    replacement: .NET 8·.NET 10 관리형 런타임(dotnet8 / dotnet10). 컨테이너 전용으로는 dotnet9
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html

  - id: go1x-runtime
    module: M09
    state: ended
    title: Go 1.x 런타임(go1.x)
    courseware_location: '슬라이드 10 강사 노트의 런타임 목록 "Go"'
    detail: >-
      교재는 지원 런타임 목록에 Go 를 포함합니다. go1.x 관리형 런타임은 2024년 1월 8일에
      지원 종료되었고 함수 생성 차단은 2024년 2월 8일입니다. Lambda 는 go1.x 폐기 이후에도
      Go 언어를 계속 지원하지만 관리형 Go 런타임이 아니라 OS 전용 런타임(provided.al2023)으로
      실행합니다.
    replacement: OS 전용 런타임(provided.al2023)에 Go 실행 파일을 배포. 컨테이너 이미지의 경우 AWS OS 전용 기본 이미지 사용
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html

  - id: aws-toolkit-eclipse-doc
    module: M09
    state: ended
    title: AWS Toolkit for Eclipse 사용 설명서 링크와 Eclipse 툴킷 권장
    courseware_location: '슬라이드 23 강사 노트의 http://docs.aws.amazon.com/AWSToolkitEclipse/latest/GettingStartedGuide/lambda.html 와 슬라이드 54 지식 확인 3번 해설의 "Eclipse 및 Visual Studio 툴키트"'
    detail: >-
      교재가 인용한 AWS Toolkit for Eclipse 사용 설명서 URL 은 HTTP 404 를 반환합니다.
      후속 경로인 /toolkit-for-eclipse/v1/user-guide/ 와 그 하위 lambda.html 은 AWS Toolkit
      for JetBrains 사용 설명서로 리디렉션됩니다. 현재 Lambda 개발 도구 문서는 로컬 개발
      도구로 AWS Toolkit for VS Code 를 제시하며 Eclipse 툴킷을 언급하지 않습니다. 관련해
      AWS SDK for Java 1.x 는 2025년 12월 31일 지원 종료되었습니다.
    replacement: AWS Toolkit for VS Code(로컬 개발·디버깅·테스트·배포), JetBrains IDE 사용자는 AWS Toolkit for JetBrains, Visual Studio 사용자는 AWS Toolkit for Visual Studio
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/tools-to-develop-deploy-manage.html

  - id: csharp-package-toolkit-page
    module: M09
    state: ended
    title: 'csharp-package-toolkit.html (AWS Toolkit for Visual Studio 항목)'
    courseware_location: '슬라이드 23 강사 노트의 https://docs.aws.amazon.com/lambda/latest/dg/csharp-package-toolkit.html'
    detail: >-
      교재가 인용한 이 URL 은 개별 페이지로 남아 있지 않고 Lambda 개발자 안내서
      루트(/lambda/latest/dg/)로 리디렉션됩니다. HTTP 상태는 200 이지만 도착 지점이
      원래 다루던 항목이 아닙니다.
    replacement: 'Lambda 개발 도구 문서(tools-to-develop-deploy-manage.html) 또는 AWS Toolkit for Visual Studio 사용 설명서'
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/tools-to-develop-deploy-manage.html

  - id: boto3-resource-interface
    module: M09
    state: discouraged
    title: "boto3 리소스 인터페이스 boto3.resource('dynamodb')"
    courseware_location: '슬라이드 31 "예제: Lambda 함수(Python)" 의 dynamoDBResource = boto3.resource(''dynamodb'')'
    detail: >-
      교재 슬라이드 31 의 실습 코드는 DynamoDB 액세스에 boto3 리소스 인터페이스를 씁니다.
      Boto3 공식 문서는 AWS Python SDK 팀이 resources 인터페이스에 새 기능을 추가할 계획이
      없고, 기존 인터페이스는 boto3 수명 주기 동안 계속 동작하며, 새로운 서비스 기능은 client
      인터페이스로 이용할 수 있다고 명시합니다. 또 리소스 인스턴스는 스레드 안전하지 않아
      스레드·프로세스마다 새로 만들어야 합니다.
    replacement: "boto3.client('dynamodb'). 리소스 인터페이스 코드는 계속 동작하므로 실습 진행에는 문제가 없습니다"
    evidence: https://boto3.amazonaws.com/v1/documentation/api/latest/guide/resources.html

  - id: dlq-as-best-practice
    module: M09
    state: discouraged
    title: 'DLQ(Dead Letter Queue) 를 비동기 호출 모범 사례로 제시'
    courseware_location: '슬라이드 12 강사 노트의 "비동기식 호출에 대한 모범 사례는 DLQ(Dead Letter Queue)를 생성 및 사용하여 메시지 오류를 더 효과적으로 처리하는 것입니다"'
    detail: >-
      현재 문서는 DLQ 를 온-실패 대상(on-failure destination)의 대안으로 제시하고, 온-실패
      대상이 지원 대상이 더 많고 함수 응답 세부 정보를 호출 레코드에 포함한다고 기술합니다.
      DLQ 는 함수 수준에서만 추가·제거할 수 있고 응답 세부 정보 없이 이벤트 내용만 보냅니다.
      온-실패 대상은 함수·버전·별칭 단위로 구성할 수 있습니다. DLQ 자체는 여전히 지원되며
      Amazon SQS 표준 대기열 또는 Amazon SNS 표준 주제를 쓸 수 있습니다(FIFO 미지원).
    replacement: 온-실패 대상(on-failure destination). 대상은 SQS 표준 대기열, SNS 표준 주제, S3 버킷(실패 시에만), Lambda 함수, EventBridge 이벤트 버스
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/invocation-async-retain-records.html

  - id: runtime-bundled-sdk-no-bundling
    module: M09
    state: discouraged
    title: '"Python·Node.js 런타임에 SDK 가 내장되어 있으므로 번들링할 필요가 없다"'
    courseware_location: '슬라이드 24 강사 노트의 "Python 및 Node.js용 런타임에는 SDK가 내장되어 있으므로 이러한 SDK를 코드와 번들링할 필요가 없습니다"'
    detail: >-
      Node.js·Python·Ruby 런타임에 AWS SDK 버전이 포함된다는 사실 자체는 맞지만, 현재 문서는
      종속성을 완전히 제어하고 자동 런타임 업데이트 중 하위 호환성을 극대화하기 위해 코드가
      사용하는 SDK 모듈과 그 종속성을 배포 패키지나 Lambda 레이어에 항상 포함하도록
      권장합니다. 런타임 내장 SDK 는 배포에 추가 패키지를 포함할 수 없을 때(Lambda 콘솔 코드
      편집기, CloudFormation 인라인 코드)에만 쓰라고 기술합니다. 또 재귀 루프 감지에는 최소
      SDK 버전이 필요해, 런타임 내장 버전이 그보다 낮으면 감지가 동작하지 않습니다.
    replacement: 배포 패키지 또는 Lambda 레이어에 필요한 SDK 모듈을 명시적으로 포함
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html

  - id: quota-async-payload-256kb
    module: M09
    state: changed
    title: 비동기식 호출 페이로드 256KB
    courseware_location: '슬라이드 50 "Lambda 함수 한도" 표(2021년 9월 현재) 의 "호출 페이로드 — 동기식: 6MB, 비동기식: 256KB"'
    detail: >-
      현재 할당량 표의 호출 페이로드는 동기식 요청·응답 각각 6MB, 스트리밍 응답 200MB,
      비동기식 1MB 이며 요청 라인과 헤더 값 합계가 1MB 입니다. Invoke API 문서도 동기 6MB,
      비동기 1MB 로 기술합니다. 동기식 6MB 는 교재와 같습니다.
    replacement: 비동기식 호출 페이로드 1MB
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html

  - id: quota-tmp-10gb-fixed
    module: M09
    state: changed
    title: '/tmp 디렉터리 스토리지 10GB (고정값 표기)'
    courseware_location: '슬라이드 50 "Lambda 함수 한도" 표의 "/tmp 디렉터리 스토리지 — 10 GB"'
    detail: >-
      교재 표는 10GB 를 고정값처럼 제시합니다. 현재 문서는 /tmp 임시 스토리지를 512MB~10,240MB
      범위에서 1MB 단위로 구성하는 설정으로 기술하며, 512MB 까지는 추가 비용이 없고 그 이상은
      GB-초로 과금됩니다. SnapStart 는 512MB 를 초과하는 임시 스토리지를 지원하지 않습니다.
    replacement: 512MB~10,240MB(1MB 단위) 구성. update-function-configuration --ephemeral-storage 또는 콘솔 일반 구성에서 설정
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/configuration-ephemeral-storage.html

  - id: quota-console-inline-3mb
    module: M09
    state: changed
    title: '배포 패키지 "콘솔에서 인라인 편집: 3MB"'
    courseware_location: '슬라이드 50 "Lambda 함수 한도" 표의 "배포 패키지 — Zip: 50MB, 비압축: 250MB, 콘솔에서 인라인 편집: 3MB; 컨테이너 이미지: 10GB"'
    detail: >-
      현재 할당량 표의 배포 패키지 항목은 Lambda API·SDK 업로드 시 50MB(압축), 콘솔 업로드 시
      50MB, 레이어·사용자 지정 런타임을 포함한 압축 해제 250MB 입니다. "콘솔에서 인라인 편집
      3MB" 항목은 표에 없습니다. 콘솔 코드 편집기 사용 조건은 인터프리터 언어
      런타임(Python·Node.js·Ruby)과 배포 패키지가 압축 해제 기준 50MB 미만이라는 것이고,
      컨테이너 이미지 함수의 코드는 콘솔에서 직접 편집할 수 없습니다. Zip 50MB·비압축 250MB·
      컨테이너 10GB 는 교재와 같습니다.
    replacement: 콘솔 코드 편집기 사용 조건은 인터프리터 언어 런타임 + 압축 해제 50MB 미만
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html

  - id: burst-concurrency-name
    module: M09
    state: changed
    title: '"버스트 동시성" 이라는 항목 이름'
    courseware_location: '슬라이드 50 "Lambda 함수 한도" 표의 "버스트 동시성 — 함수당 10초당 최대 1,000회 동시 실행" 과 강사 노트의 버스트 설명'
    detail: >-
      수치(함수·리전당 10초당 실행 환경 1,000개)는 현재와 같습니다. 이름이 바뀌었습니다.
      현재 문서는 이를 동시성 조정 속도(concurrency scaling rate)라 부르고 할당량 표에서는
      동시성 조정 한도(concurrency scaling limit)로 표기하며, 10초당 실행 환경 1,000개 또는
      10초당 초당 요청 10,000건으로 기술합니다. 쓰지 않은 조정 속도는 누적되지 않습니다.
    replacement: 동시성 조정 속도(concurrency scaling rate) / 동시성 조정 한도(concurrency scaling limit)
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/scaling-behavior.html

  - id: snapstart-java-only
    module: M09
    state: changed
    title: 'SnapStart 지원 런타임 "Java 11 및 Java 17 관리형 런타임"'
    courseware_location: '슬라이드 17 "콜드 스타트 최소화하기 1/2" 본문의 "Java 11 및 Java 17 관리형 런타임에 사용 가능" 과 강사 노트의 "SnapStart는 Java 11 및 Java 17 관리형 런타임을 지원합니다"'
    detail: >-
      현재 SnapStart 지원 런타임은 Java 11 이상, Python 3.12 이상, .NET 8 이상입니다. 그 밖의
      관리형 런타임(예: nodejs24.x, ruby4.0), OS 전용 런타임, 컨테이너 이미지는 지원하지
      않습니다. SnapStart 는 프로비저닝된 동시성, Amazon EFS, Amazon S3 Files, 512MB 를 초과하는
      임시 스토리지를 지원하지 않고 게시된 버전과 버전을 가리키는 별칭에만 쓸 수 있습니다.
    replacement: Java 11 이상 / Python 3.12 이상 / .NET 8 이상
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/snapstart.html

  - id: snapstart-no-additional-cost
    module: M09
    state: changed
    title: 'SnapStart "추가 비용 없이"'
    courseware_location: '슬라이드 17 강사 노트의 "Java용 SnapStart는 일반적으로 함수 코드를 변경하지 않고도 추가 비용 없이 ... 시작 성능을 최대 10배까지 향상시킬 수 있습니다"'
    detail: >-
      추가 비용이 없는 것은 Java 관리형 런타임에 한정됩니다. 그 밖에는 SnapStart 를 켜고 게시한
      함수 버전마다 스냅샷 캐싱 요금(최소 3시간 과금)과 함수 인스턴스를 스냅샷에서 복원할 때마다
      복원 요금이 발생하며, 두 요금은 함수에 할당한 메모리 양에 따라 달라집니다. 교재가 Java 만
      다루던 시점에는 이 서술이 맞았지만 지원 런타임이 Python·.NET 으로 확대되면서 조건부가
      되었습니다.
    replacement: 'Java 관리형 런타임은 추가 비용 없음. Python·.NET 은 캐싱 요금(최소 3시간)과 복원 요금이 발생'
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/snapstart.html

  - id: snapstart-10x
    module: M09
    state: changed
