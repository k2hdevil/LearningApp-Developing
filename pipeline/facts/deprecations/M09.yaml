  - id: recursive-code-manual-only
    module: M09
    state: changed
    title: '재귀 코드 대응을 "동시 런타임 한도를 0으로 설정" 으로만 안내'
    courseware_location: '슬라이드 25 "Lambda 함수: 핸들러" 강사 노트의 "실수로 재귀 코드를 사용하게 된 경우 코드를 업데이트하는 동안 함수 동시 런타임 한도를 즉시 0으로 설정하여 해당 함수에 대한 모든 호출을 제한하십시오"'
    detail: >-
      현재 Lambda 는 특정 유형의 재귀 루프를 자동으로 감지해 중지하는 기능을 기본 제공합니다.
      X-Ray 트레이싱 헤더로 요청 체인을 추적해 같은 체인에서 함수가 약 16회 호출되면 다음
      호출을 중지하고 Health Dashboard·이메일로 알립니다. 활성 트레이싱을 켜지 않아도
      동작하고 무료입니다. 다만 감지 대상은 함수 자신, Amazon SQS, Amazon S3, Amazon SNS 사이의
      루프와 Lambda 함수만으로 구성된 루프이며 Amazon DynamoDB 처럼 다른 서비스가 포함된 루프는
      감지하지 못하므로 교재의 수동 조치(예약된 동시성 0)도 여전히 유효한 대응입니다.
    replacement: '재귀 루프 감지가 기본 동작. 감지되지 않는 조합에서는 예약된 동시성을 0으로 설정하는 수동 조치를 병행'
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/invocation-recursion.html

  - id: cli-payload-binary-format
    module: M09
    state: changed
    title: 'invoke --payload 에 JSON 문자열을 그대로 전달'
    courseware_location: '슬라이드 44 "예제: 함수 호출" 의 aws lambda invoke --function-name dictate-function --payload ''{"UserId": "newbie","NoteId": "2","VoiceId": "Joey"}'' response.txt'
    detail: >-
      AWS CLI 버전 2 에서는 --payload 에 JSON 문자열을 그대로 넘길 때
      --cli-binary-format raw-in-base64-out 옵션이 필요합니다. 기본값으로 만들려면
      aws configure set cli-binary-format raw-in-base64-out 을 실행합니다. Invoke API 문서는
      --payload '{ "key": "value" }' 처럼 JSON 을 직접 넣거나 --payload file://payload.json
      처럼 파일 경로를 줄 수 있다고 기술합니다.
    replacement: 'aws lambda invoke ... --cli-binary-format raw-in-base64-out --payload ''{...}'' response.json'
