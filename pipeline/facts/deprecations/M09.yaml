  - id: concurrency-limit-1000-fixed
    module: M09
    state: changed
    title: '"동시 실행 한도 1,000개" 를 고정 한도로 제시'
    courseware_location: '슬라이드 45 "오류 처리" 본문의 "요청이 너무 많음 (동시 실행 한도 1,000개)" 과 강사 노트의 "계정의 동시 실행 한도 1,000개로 인한 오류를 방지하고"'
    detail: >-
      1,000 이라는 값은 현재도 기본 할당량으로 유효합니다. 다만 현재 문서는 이를 증액 요청할 수
      있는(수만 단위까지) 기본 할당량으로 기술하고, 새 AWS 계정은 Lambda 함수·MicroVM 에 대해
      동시성·메모리 할당량이 축소된 상태로 시작해 사용량에 따라 자동으로 상향된다고 명시합니다.
      또 동시성 제어에는 예약된 동시성과 프로비저닝된 동시성 두 가지가 있고, 예약된 동시성은
      최대치와 최소치를 함께 설정하며 구성 자체에는 요금이 없습니다.
    replacement: '기본 할당량 1,000(리전당, 증액 가능). 신규 계정은 더 낮은 값에서 시작'
