  - id: code-stored-in-s3
    module: M09
    state: changed
    title: '"AWS Lambda 는 Amazon S3 에 코드를 저장하고 저장된 데이터를 암호화합니다"'
    courseware_location: '슬라이드 14 "AWS Lambda 런타임 수명 주기" 강사 노트의 코드 항목'
    detail: >-
      저장 중 암호화 부분은 현재도 맞습니다. Lambda 는 환경 변수, 업로드한 파일(배포 패키지와
      레이어 아카이브 포함), 이벤트 소스 매핑 필터 조건 객체, durable execution 데이터에 대해
      항상 저장 중 암호화를 제공합니다. 다만 저장 위치 서술이 달라졌습니다. 현재 문서는
      Lambda 관리형 스토리지(계정·리전당 300GB, 압축 해제 기준)를 기본으로 하고 사용자 S3
      버킷을 쓰는 자체 관리형 S3 코드 스토리지를 선택 옵션으로 제시합니다. 자체 관리형 S3
      코드 스토리지를 쓰면 Lambda 가 소스 코드 사본을 저장하지 않고 저장 중 암호화는 S3
      버킷 구성으로 관리됩니다.
    replacement: 'Lambda 관리형 스토리지(기본, 300GB) 또는 자체 관리형 S3 코드 스토리지. 두 경우 모두 저장 중 암호화 제공'
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/security-encryption-at-rest.html

  - id: same-account-no-permission
    module: M09
    state: incorrect
    title: '"같은 AWS 계정이면 명시적인 권한을 부여할 필요가 없습니다"'
    courseware_location: '슬라이드 20 "푸시 또는 직접 호출 모델" 강사 노트의 "참고: 사용자 정의 애플리케이션과 이 애플리케이션이 호출하는 Lambda 함수가 같은 AWS 계정에 속한 경우 명시적인 권한을 부여할 필요가 없습니다"'
    detail: >-
      현재 문서는 사용자가 Lambda 리소스에 액세스하려 하면 사용자의 자격 증명 기반 정책과
      리소스의 리소스 기반 정책을 모두 고려하고, Amazon S3 같은 AWS 서비스가 함수를 호출하면
      리소스 기반 정책만 고려한다고 기술합니다. 즉 같은 계정의 IAM 주체가 함수를 호출하려면
      자격 증명 기반 정책에 lambda:InvokeFunction 권한이 있어야 합니다. 호출 문제 해결 문서는
      "사용자 또는 수임하는 역할에 함수를 호출할 권한이 있어야 하며, 이 요구 사항은 함수를
      호출하는 Lambda 함수와 그 밖의 컴퓨팅 리소스에도 적용된다" 고 명시합니다. 같은 계정이면
      리소스 기반 정책을 별도로 추가하지 않아도 되는 경우가 있다는 정도는 맞지만, 어떤 권한도
      필요 없다는 서술은 사실과 다릅니다.
    replacement: '같은 계정의 IAM 주체도 lambda:InvokeFunction 권한이 필요하다(AWSLambdaRole 관리형 정책 또는 사용자 지정 정책). AWS 서비스 호출에는 리소스 기반 정책이 필요하다'
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/lambda-permissions.html

  - id: context-remaining-time-defaults
    module: M09
    state: incorrect
    title: '컨텍스트 "남은 시간" 의 기본값을 언어별로 다르게 기재'
    courseware_location: '슬라이드 27 "컨텍스트" 강사 노트 — Python get_remaining_time_in_millis "(기본값 = 3초)", Java getRemainingTimeInMillis() "(기본값 = 15분)", .NET RemainingTime "(기본값 = 15분)"'
    detail: >-
      같은 항목의 기본값을 언어별로 다르게 적은 교재 내부 불일치입니다. 세 언어의 컨텍스트
      문서는 모두 "시간 초과 전에 남은 밀리초 수를 반환한다" 고만 기술하고 기본값을 명시하지
      않습니다. 이 값은 함수에 구성된 시간 제한을 기준으로 계산되므로 언어별 기본값이 따로
      있는 것이 아닙니다. 함수 시간 제한 자체의 기본값은 3초이고 최대는 900초(15분)이므로,
      Python 의 3초는 함수 시간 제한 기본값을, Java·.NET 의 15분은 최대값을 잘못 옮긴 것으로
      보입니다.
    replacement: '세 언어 모두 "함수 시간 초과 전 남은 시간(밀리초)". 기준은 함수에 구성된 시간 제한이며 기본 3초, 최대 900초'
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/python-context.html

