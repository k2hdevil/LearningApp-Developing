  - id: stage-editor-window
    module: M10
    state: changed
    title: Stage Editor 창
    courseware_location: '슬라이드 30 "API Gateway 스테이지" 강사 노트'
    detail: >-
      교재는 "배포 프로세스가 완료되면 Stage Editor 창이 표시됩니다"라고 하고 Stage
      Editor 로 캐싱·요청 제한·로깅·스테이지 변수를 설정한다고 서술합니다. 현재 콘솔에서
      스테이지 설정은 Stages 창에서 스테이지를 고른 뒤 Stage details 의 Edit(캐시 설정,
      제한 설정, 방화벽·인증서 설정)과 Logs and tracing 의 Edit(실행 로깅 수준,
      Data tracing, Detailed metrics, 사용자 지정 액세스 로깅, X-Ray)으로 나뉘어
      있습니다. 스테이지가 배포에 대한 명명된 참조라는 정의와 스테이지로 할 수 있는
      다섯 가지는 그대로입니다. 스테이지 설정을 바꾼 뒤에는 API 를 다시 배포해야 새 설정이
      적용됩니다(로그·스테이지 변수 업데이트는 재배포가 필요하지 않습니다).
    replacement: 'Stages → 스테이지 → Stage details / Logs and tracing 의 Edit. 호출 URL 은 스테이지 상세의 Invoke URL'
    evidence: https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-stages.html

  - id: passthrough-two-conditions
    module: M10
    state: changed
    title: 통합 패스스루 조건 두 가지
    courseware_location: '슬라이드 14 "통합 유형" 강사 노트의 통합 패스스루 설명'
    detail: >-
      교재는 비프록시 통합에서 변환 없이 전달되는 조건을 두 가지로 나열합니다
      (① Content-Type 헤더가 지정된 매핑 템플릿과 일치하지 않음 ② 매핑 템플릿이 정의되지
      않음). 현재 문서는 이것을 세 가지 선택지가 있는 설정으로 기술합니다:
      WHEN_NO_MATCH(교재 ①에 해당), WHEN_NO_TEMPLATES(교재 ②에 해당, 문서가 권장),
      NEVER(전달하지 않고 매핑되지 않은 콘텐츠 유형은 HTTP 415 로 거부).
      Content-Type 헤더가 없으면 API Gateway 는 application/json 으로 기본 처리합니다.
      프록시 통합에서 패스스루 동작을 수정할 수 없다는 교재 서술은 맞습니다.
    replacement: 'passthroughBehavior = WHEN_NO_MATCH / WHEN_NO_TEMPLATES(권장) / NEVER'
    evidence: https://docs.aws.amazon.com/apigateway/latest/developerguide/integration-passthrough-behaviors.html

  - id: canary-promote-mechanism
    module: M10
    state: changed
    title: Canary 를 승격하면 트래픽 100% 가 새 버전으로 간다
    courseware_location: '슬라이드 33·36 "Canary 릴리스 2/2"·"Canary 릴리스 단계(3/3)"'
    detail: >-
      교재는 "canary 버전을 홍보하고 트래픽을 100% 이 API 버전으로 보낼 수 있습니다"라고
      결과만 서술합니다. 실제 승격 메커니즘은 ① 스테이지의 deploymentId 를 카나리의
      deploymentId 로 재설정하고 ② 카나리 스테이지 변수를 스테이지 변수로 복사하고
      ③ 카나리 트래픽 비율을 0.0% 로 내리는 것입니다. 결과적으로 프로덕션이 새 버전을
      서비스하지만 승격만으로는 카나리가 비활성화되지 않으며, 일반 프로덕션 배포로
      되돌리려면 canarySettings 를 제거해야 합니다.
    replacement: 'deploymentId 복사 + stageVariableOverrides 복사 + percentTraffic 0.0. 카나리 해제는 canarySettings 제거'
    evidence: https://docs.aws.amazon.com/apigateway/latest/developerguide/promote-canary-deployment.html

  - id: http-integration-vpc-wording
    module: M10
    state: changed
    title: 'HTTP·HTTP_PROXY 를 "VPC 에 있는 프라이빗 HTTP 엔드포인트를 포함한 HTTP 엔드포인트" 로 정의'
    courseware_location: '슬라이드 14 "통합 유형" 강사 노트의 HTTP·HTTP_PROXY 정의'
    detail: >-
      교재는 HTTP 와 HTTP_PROXY 를 모두 "VPC에 있는 프라이빗 HTTP 엔드포인트를 포함한
      HTTP 엔드포인트와 통합"으로 설명합니다. 현재 통합 유형 문서는 두 유형을 백엔드
      HTTP 엔드포인트 통합으로만 기술하고, 프라이빗 통합은 HTTP 프록시 통합에
      connectionType=VPC_LINK 와 VPC 링크 V2 의 connectionId 를 지정하는 별도 설정으로
      다룹니다. VPC 링크 V2 는 NLB 뿐 아니라 ALB 도 대상으로 삼을 수 있고,
      connectionId 를 스테이지 변수로 넘길 수 있습니다.
    replacement: 'HTTP·HTTP_PROXY 는 백엔드 HTTP 엔드포인트 통합. 프라이빗 통합은 HTTP_PROXY + connectionType=VPC_LINK + VPC 링크 V2'
    evidence: https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-private-integration.html

  - id: mapping-templates-over-proxy
    module: M10
    state: discouraged
    title: 데이터 변환의 주 경로로 매핑 템플릿을 쓰기
    courseware_location: '슬라이드 16~20 "요청 및 응답 처리" 전체와 슬라이드 10 의 데이터 변환 항목'
    detail: >-
      교재는 요청·응답 처리를 매핑 템플릿 중심으로 다섯 슬라이드에 걸쳐 설명합니다.
      현재 문서는 데이터 변환 절 첫머리에서 "가능하면 REST API 에 프록시 통합을
      쓰라"고 권장하고, 변환이 필요한 경우에도 "가능하면 파라미터 매핑을 쓰라"고 하며
      본문을 바꿔야 하거나 조건부 재정의가 필요하고 프록시 통합을 쓸 수 없을 때만
      매핑 템플릿 변환을 쓰라고 안내합니다. 매핑 템플릿 문서에도 같은 권고가 있습니다.
      매핑 템플릿은 계속 동작하며 교재 내용이 틀린 것은 아니지만 현재 권장 순서와
      우선순위가 다릅니다.
    replacement: '① 프록시 통합 → ② 파라미터 매핑(VTL 불필요) → ③ 매핑 템플릿 변환'
    evidence: https://docs.aws.amazon.com/apigateway/latest/developerguide/rest-api-data-transformations.html

  - id: api-keys-for-access-control
    module: M10
    state: discouraged
    title: API 키로 API 액세스를 통제한다
    courseware_location: '슬라이드 10 "API Gateway 개발자 기능" 의 "API 키 구성" 과 슬라이드 13 강사 노트의 API Key Required'
    detail: >-
      교재는 API 키를 개발자 기능으로 제시하고 "API 키가 메서드를 호출하게 하려면
      API Key Required를 true로 설정하십시오"라고 안내합니다. 사용량 계획 문서의 모범
      사례는 "API 액세스를 제어하는 인증·권한 부여에 API 키를 쓰지 말라"고 명시합니다.
      한 사용량 계획에 여러 API 가 있으면 그중 한 API 의 유효한 API 키를 가진 사용자가
      그 계획의 모든 API 에 액세스할 수 있기 때문입니다. 또 API 키에 기밀 정보를 넣지
      말고 API Gateway 가 생성한 키를 쓰라고 안내합니다. API 키 자체는 계속 동작하며
      클라이언트 식별·사용량 추적·클라이언트별 제한에는 여전히 정당한 용도입니다.
    replacement: '액세스 제어는 IAM 역할 · Lambda 권한 부여자 · Amazon Cognito 사용자 풀. API 키는 클라이언트 식별과 사용량 계획 연결에만'
    evidence: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-usage-plans.html

  - id: usage-plan-quota-for-cost-control
    module: M10
    state: discouraged
    title: 사용량 계획 할당량으로 비용과 액세스를 통제한다
    courseware_location: '슬라이드 10 "API Gateway 개발자 기능" 강사 노트의 API 키·제한 항목 (교재는 한도의 성격을 서술하지 않음)'
    detail: >-
      교재는 "고객은 합의된 요청 속도와 할당량을 바탕으로 이러한 API에 액세스할 수
      있습니다"라고만 서술합니다. 현재 문서는 사용량 계획의 제한과 할당량이 하드 한도가
      아니라 best-effort 로 적용되므로 클라이언트가 초과할 수 있다고 명시하고, 비용
      통제나 API 액세스 차단에 의존하지 말라고 경고합니다. 비용 모니터링에는 AWS Budgets,
      요청 관리에는 AWS WAF 를 고려하라고 안내합니다. 스테이지 수준 제한 설정에도 같은
      경고가 붙어 있습니다.
    replacement: '비용은 AWS Budgets 로 모니터링, 요청 차단은 AWS WAF. 사용량 계획은 사용량 관리 목표치로만'
    evidence: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-usage-plans.html

  - id: stage-variables-for-sensitive-data
    module: M10
    state: discouraged
    title: 스테이지 변수로 구성을 Lambda 함수에 전달한다
    courseware_location: '슬라이드 31 "스테이지 변수 사용" 본문의 용례 "구성을 Lambda 함수로 전달"'
    detail: >-
      교재는 스테이지 변수의 용례로 "구성을 Lambda 함수로 전달"을 제시합니다. 현재 문서는
      스테이지 변수가 자격 증명 같은 민감한 데이터에 쓰도록 의도된 것이 아니라고 명시하고,
      통합에 민감한 데이터를 넘겨야 하면 Lambda 권한 부여자의 출력을 쓰라고 안내합니다.
      민감하지 않은 구성 전달은 여전히 정당한 용도이며 문서도 사용 사례로 제시합니다.
    replacement: 민감하지 않은 구성만 스테이지 변수로 전달. 자격 증명은 Lambda 권한 부여자 출력 사용
    evidence: https://docs.aws.amazon.com/apigateway/latest/developerguide/stage-variables.html

  - id: data-tracing-in-production
    module: M10
    state: discouraged
    title: 스테이지 로깅에서 Data tracing 활성화
    courseware_location: '슬라이드 34 "Canary 릴리스 단계(1/3)" 의 "CloudWatch를 이용한 로깅을 활성화합니다" (교재는 로깅 수준을 구분하지 않음)'
    detail: >-
      교재는 canary 스테이지에서 "CloudWatch를 이용한 로깅을 활성화합니다"라고만
      서술하고 로깅 수준이나 Data tracing 을 구분하지 않습니다. 현재 문서는 Data tracing
      이 문제 해결에 유용하지만 민감한 데이터가 로깅될 수 있어 프로덕션 API 에는 쓰지
      않도록 권장하고, 실행 로깅은 ERROR 또는 INFO 수준으로 쓰라고 안내합니다.
      메서드 수준 CloudWatch 지표(Detailed metrics)에는 요금이 부과됩니다.
    replacement: '실행 로깅은 Errors only 또는 Errors and info logs. Data tracing 은 문제 해결 중에만 임시로'
    evidence: https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-logging.html
