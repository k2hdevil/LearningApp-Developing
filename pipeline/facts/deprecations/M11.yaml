# 폐기·변경 레지스트리 (M11 · 모듈 11 모던 애플리케이션 구축)
#
# 교재(Developing on AWS 강사용 덱)에 등장하지만 현재는 종료·비권장·변경된 항목을 기록합니다.
# 본문에서 조용히 지우지 않고 여기에 근거와 함께 남긴 뒤, 모듈 문서의
# '교재 대비 변경 사항' 장에 delta로 표시합니다. 수강생이 공식 교재를 들고
# 있으므로 "책에는 있는데 자료에는 없다"는 질문에 답할 수 있어야 합니다.
#
# state 값
#   ended       : 서비스·버전 지원 종료. 본문에서 제거하고 대체안을 제시한다.
#   discouraged : 동작하지만 권장되지 않음. 본문 주 경로에서 빼고 주의로만 남긴다.
#   changed     : 동작·기본값·표기가 바뀜. 본문을 새 내용으로 교체한다.
#   incorrect   : 교재 기술이 사실과 다름. 교정한다.
#
# courseware_internal: true 는 교재 안에서 본문과 강사 노트가 어긋나는 등
#   외부 문서로 검증할 대상이 아닌 항목입니다. evidence 를 비워 둡니다.
#
# verified_on 은 아래 항목을 공식 문서로 확인한 날짜입니다.

verified_on: 2026-08-31

items:
  - id: workflow-studio-name
    module: M11
    state: incorrect
    title: State Function Workflow Studio
    courseware_location: '슬라이드 25 "Step Functions 시작하기" 본문의 시각화 도구 이름'
    detail: >-
      슬라이드 본문은 시각화 도구 이름을 "State Function Workflow Studio"로 적고 같은
      슬라이드의 강사 노트는 "Workflow Studio"로 적습니다. 공식 이름은 Workflow Studio 이며
      AWS Step Functions 콘솔에서 워크플로를 편집할 때 쓰는 시각적 도구입니다. Design,
      Code, Config 세 모드를 제공하고, 콘솔 외에 AWS Infrastructure Composer 안에서와
      VS Code 용 AWS Toolkit 을 통해서도 쓸 수 있습니다.
    replacement: Workflow Studio
    evidence: https://docs.aws.amazon.com/step-functions/latest/dg/workflow-studio.html

  - id: account-id-five-digits
    module: M11
    state: incorrect
    title: 'arn:aws:lambda:us-east-1:12342:function:Iterate'
    courseware_location: '슬라이드 27 "예: Lamda를 사용한 루프 반복" ASL 정의의 Iterator 상태 Resource 값'
    detail: >-
      Resource ARN 의 계정 ID 자리가 12342 로 5자리입니다. ARN 의 일반 형식은
      arn:partition:service:region:account-id:resource-id 이고 account-id 는 하이픈 없는
      12자리 AWS 계정 ID 입니다(문서 예시 123456789012). 따라서 교재의 값은 유효한 ARN 이
      아닙니다. 반면 슬라이드 36 의 FunctionName ARN 에는 실제 계정처럼 보이는 12자리
      숫자가 들어 있어, 최종 문서에서는 양쪽 모두 예시용 값으로 바꿨습니다.
    replacement: 'arn:aws:lambda:us-east-1:123456789012:function:Iterate'
    evidence: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference-arns.html

  - id: state-types-seven-vs-eight
    module: M11
    state: incorrect
    title: 상태 타입을 7개로 제시
    courseware_location: '슬라이드 26 "태스크 상태(State)의 내부 구조" 강사 노트의 상태 목록'
    detail: >-
      강사 노트는 상태를 태스크 / 선택 / 실패 또는 성공(Succeed or Fail) / 전달 / 대기 /
      병렬 / 맵 일곱 항목으로 제시하면서 Succeed 와 Fail 을 한 항목으로 묶습니다. 공식
      워크플로 상태 참조 목록은 Task, Choice, Parallel, Map, Pass, Wait, Succeed, Fail
      여덟 개이고, Workflow Studio 는 Task(Actions)를 제외한 7개를 Flow 상태로 분류합니다.
      각 설명 자체는 문서와 일치합니다.
    replacement: Task / Choice / Parallel / Map / Pass / Wait / Succeed / Fail 여덟 개
    evidence: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-states.html

  - id: io-fields-mismatch
    module: M11
    state: incorrect
    title: 입력·출력 처리 필드 목록이 본문과 강사 노트에서 다름
    courseware_location: '슬라이드 26 다이어그램(InputPath·Parameters·ResultPath·OutputPath)과 같은 슬라이드 강사 노트(InputPath·Parameters·ResultSelector)'
    detail: >-
      슬라이드 다이어그램은 네 필드를 표기하고 강사 노트는 조작 필드로 세 개를 나열하는데
      두 목록이 서로 다릅니다(ResultSelector 는 다이어그램에 없고, ResultPath·OutputPath 는
      강사 노트 목록에 없습니다). JSONPath 를 쓰는 상태 머신의 정확한 목록은 다섯 개이고
      적용 순서는 InputPath → Parameters → ResultSelector → ResultPath → OutputPath 입니다.
    replacement: InputPath / Parameters / ResultSelector / ResultPath / OutputPath 다섯 개, 이 순서로 적용
    evidence: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-input-output-filtering.html

  - id: jsonpath-only-fields
    module: M11
    state: changed
    title: JSONPath 만으로 데이터를 전달·변환
    courseware_location: '슬라이드 26 "태스크 상태(State)의 내부 구조" 전체와 슬라이드 27·36 의 ASL 정의'
    detail: >-
      교재는 상태 간 데이터 전달·변환을 JSONPath 기반 필드와 '$' 표기법으로만 설명합니다.
      현재 Step Functions 는 JSONata 를 쿼리·변환 언어로 지원하고, 새 상태 머신에는 JSONata
      를 권장합니다. JSONata 를 선택하면 다섯 개의 JSONPath 필드가 Arguments 와 Output 두
      필드로 줄고 JSON 키 이름에 .$ 를 쓰지 않습니다. 또 변수(Variables)의 Assign 필드로
      한 단계에서 저장한 데이터를 이후 어느 단계에서든 참조할 수 있습니다. 쿼리 언어를
      지정하지 않은 상태 머신은 하위 호환을 위해 JSONPath 로 기본 설정되므로 교재 예제는
      지금도 동작합니다.
    replacement: 새 상태 머신은 QueryLanguage 를 JSONata 로 설정하고 Arguments·Output·Assign 을 사용. 기존 상태 머신은 상태 단위로 점진 전환
    evidence: https://docs.aws.amazon.com/step-functions/latest/dg/transforming-data.html

  - id: map-iterator-parameters-fields
    module: M11
    state: discouraged
    title: Map 상태의 Iterator 필드와 Parameters 필드
    courseware_location: '슬라이드 26 강사 노트의 Map 상태 설명("상태 입력에서 어레이의 여러 항목에 대해 동일한 단계를 실행합니다")'
    detail: >-
      Map 상태 안에서 반복할 단계를 정의하던 Iterator 필드는 사용이 중단되어(deprecated)
      ItemProcessor 로 대체되었고, 배열 항목 값을 재정의하던 Parameters 필드도 사용이
      중단되어 ItemSelector 로 대체되었습니다. 문서는 기존 정의가 계속 동작하지만 새 필드로
      바꾸도록 강력히 권장합니다. 교재 슬라이드 27 에 등장하는 "Iterator" 는 Map 상태의
      필드가 아니라 Task 상태의 이름이므로 이 사용 중단과는 무관합니다.
    replacement: Iterator → ItemProcessor, Map 안의 Parameters → ItemSelector
    evidence: https://docs.aws.amazon.com/step-functions/latest/dg/state-map-inline.html

  - id: stepfunctions-local-unsupported
    module: M11
    state: ended
    title: AWS Step Functions Local · 데이터 흐름 시뮬레이터
    courseware_location: '슬라이드 29~30 "데모: AWS Step Functions를 사용하여 Lambda 함수 오케스트레이션"(테스트 방법이 언급되지 않은 지점)'
    detail: >-
      다운로드해 로컬 개발 환경에서 실행하던 AWS Step Functions Local 은 현재 공식 문서에서
      기능 동등성을 제공하지 않으며 지원되지 않는다(unsupported)고 명시되어 있습니다.
      최적화 서비스 통합, 크로스 계정 액세스, 분산 맵을 지원하지 않습니다. JSONPath 구문을
      테스트하기 위해 만든 콘솔 도구인 데이터 흐름 시뮬레이터(Data flow simulator)도
      지원되지 않습니다. 교재는 두 도구를 언급하지 않지만, 로컬 테스트 방법을 찾는 수강생이
      가장 먼저 마주치는 경로여서 등재했습니다.
    replacement: TestState API 또는 콘솔의 Test State 로 개별 상태를 테스트. VS Code 용 AWS Toolkit 의 Workflow Studio 안에서도 개별 상태를 테스트할 수 있음
    evidence: https://docs.aws.amazon.com/step-functions/latest/dg/test-and-debug.html

  - id: cloudwatch-events-renamed
    module: M11
    state: changed
    title: Amazon CloudWatch Events
    courseware_location: '슬라이드 18 "서버리스 애플리케이션 스택" 애플리케이션 통합 계층의 Amazon EventBridge'
    detail: >-
      교재는 EventBridge 이름만 나열하고 이전 이름을 다루지 않습니다. Amazon EventBridge 는
      이전에 Amazon CloudWatch Events 라고 불렸습니다. CloudWatch Events 에서 만든 기본
      이벤트 버스와 규칙이 EventBridge 콘솔에도 나타나고, EventBridge 가 동일한
      CloudWatch Events API 를 쓰므로 기존 코드는 그대로 동작합니다. 다만 EventBridge 에
      추가되는 새 기능(파트너 이벤트, 스키마 레지스트리, EventBridge Pipes 등)은
      CloudWatch Events 에 추가되지 않습니다.
    replacement: Amazon EventBridge. 이벤트 버스 / EventBridge Pipes / EventBridge Scheduler 세 가지 처리 방식
    evidence: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-cwe-now-eb.html

  - id: slide16-strikethrough-lost
    module: M11
    state: incorrect
    title: '"기존 배포 및 운영"과 "서버리스 배포 및 운영" 목록이 동일하게 추출됨'
    courseware_location: '슬라이드 16 "서버리스 컴퓨팅이란?" 두 개의 둥근 사각형 목록'
    detail: >-
      두 목록의 7개 항목이 완전히 같은 텍스트로 추출됩니다. 원본 슬라이드는 서버리스 쪽
      항목에 취소선을 넣어 없어지는 작업을 표현한 것으로 보이나 텍스트만으로는 구분되지
      않습니다. 이 문서는 강사 노트("서버리스 애플리케이션에서는 사용자가 서버를 프로비저닝,
      크기 조정, 관리할 필요가 없습니다")를 근거로 서버리스 쪽에서 무엇이 없어지는지를 표로
      구분했습니다. 교재 자체의 표기 문제여서 외부 문서로 검증할 대상이 아닙니다.
    replacement: 기존 배포·운영의 7개 작업 중 어떤 것이 서버리스에서 없어지는지를 표로 구분
    courseware_internal: true
    evidence: ''

  - id: slide18-three-layers-vs-nine
    module: M11
    state: incorrect
    title: '"3가지 계층"과 슬라이드 본문 9개 계층의 불일치'
    courseware_location: '슬라이드 18 "서버리스 애플리케이션 스택" 강사 노트의 "사용자 스택의 3가지 계층"'
    detail: >-
      강사 노트는 "3가지 계층"이라 하면서 컴퓨팅 / 애플리케이션 통합 / 데이터 저장 세
      가지를 나열합니다. 슬라이드 본문은 컴퓨팅·API 프록시·애플리케이션 통합·오케스트레이션·
      데이터베이스·스토리지·분석·개발자 도구·가시성 9개 계층을 제시합니다. 또 강사 노트는
      AWS Step Functions 를 "애플리케이션 통합"에 넣지만 슬라이드 본문은 "오케스트레이션"으로
      따로 둡니다. 교재 내부 불일치입니다.
    replacement: 슬라이드 본문의 9개 계층을 기준으로 정리하고, 강사 노트의 3계층은 그중 핵심 세 축으로 표시
    courseware_internal: true
    evidence: ''

  - id: slide36-title-and-comment
    module: M11
    state: incorrect
    title: '슬라이드 36 의 제목과 Comment 가 내용과 맞지 않음'
    courseware_location: '슬라이드 36 "예: Lamda를 사용한 루프 반복"의 제목과 ASL 정의의 Comment 값'
    detail: >-
      슬라이드 36 의 제목이 슬라이드 27 과 같은 "예: Lamda를 사용한 루프 반복"인데 내용은
      루프 반복이 아니라 DynamoDB GetItem → Lambda invoke 순차 워크플로입니다. 또 Comment
      값이 "Example of the Amazon States Language using a Pass state"인데 이 정의에는
      Pass 상태가 없습니다. 강사 노트는 상태 이름을 DynamoDBGetItem(공백 없음)이라 쓰지만
      코드의 상태 이름은 "DynamoDB GetItem"(공백 있음)이고, 파라미터 이름을 tableName
      (소문자 t)이라 쓰지만 코드는 TableName 입니다. 슬라이드 27 의 제목도 "Lamda"로
      오타입니다. 모두 교재 내부 불일치입니다.
    replacement: 제목·Comment 를 내용에 맞게 고치고 상태 이름·파라미터 이름을 코드 기준으로 통일
    courseware_internal: true
    evidence: ''

  - id: slide27-smart-quotes
    module: M11
    state: incorrect
    title: 'ASL 정의의 닫는 인용부호가 왼쪽 큰따옴표'
    courseware_location: '슬라이드 27 ASL 정의의 "Next": "Iterator“ / "Next": "ExampleWork“ / "Default": "Done“'
    detail: >-
      추출된 텍스트에서 일부 문자열의 닫는 인용부호가 곧은 인용부호(")가 아니라 왼쪽
      큰따옴표(“)입니다. 그대로는 JSON 으로 파싱되지 않습니다. 슬라이드 36 의 Catch 대상
      "Fail" 도 States 블록에 Fail 이라는 이름의 상태가 정의되어 있는지 텍스트가 잘려
      확인할 수 없습니다. 교재 자체의 표기 오류여서 외부 문서로 검증할 대상이 아니며,
      최종 문서에서는 파싱 가능한 JSON 으로 교정했습니다.
    replacement: 곧은 인용부호로 교정하고 Catch 대상 상태를 정의에 포함
    courseware_internal: true
    evidence: ''

  - id: no-workflow-type-choice
    module: M11
    state: changed
    title: 워크플로 유형(Standard / Express) 선택이 교재에 없음
    courseware_location: '슬라이드 24 "AWS Step Functions" 와 슬라이드 25 "Step Functions 시작하기"'
    detail: >-
      교재는 Step Functions 를 소개하고 워크플로를 정의·시각화·실행하는 흐름을 제시하지만
      워크플로 유형을 전혀 언급하지 않습니다. 실제로는 상태 머신을 만들 때 Standard(기본값)
      또는 Express 를 반드시 선택해야 하고 생성 후에는 변경할 수 없습니다. Standard 는
      최대 1년·exactly-once·상태 전환 과금이고, Express 는 최대 5분·at-least-once(비동기)
      또는 at-most-once(동기)·실행 수와 지속 시간 과금입니다. Express 는 .sync 와
      .waitForTaskToken 패턴, Distributed Map, Activities 를 지원하지 않습니다.
    replacement: 상태 머신 생성 시 Standard / Express 를 선택. 비멱등 작업·감사 필요는 Standard, 고빈도 이벤트 처리는 Express
    evidence: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html

  - id: integration-targets-nine-services
    module: M11
    state: changed
    title: 통합 대상을 9개 서비스와 "그 외 다수"로 제시
    courseware_location: '슬라이드 28 "서비스 통합" 다이어그램의 서비스 목록'
    detail: >-
      교재는 통합 대상을 AWS Lambda, AWS Batch, AWS Fargate, Amazon ECS, Amazon DynamoDB,
      Amazon SNS, Amazon SQS, AWS Glue, Amazon SageMaker 아홉 개와 "그 외 다수"로 제시합니다.
      현재 Step Functions 의 통합 유형은 두 가지로 구분됩니다. 최적화 통합(Optimized
      integrations)은 특정 서비스용 사용자 지정 옵션을 제공하며 표에 21개 서비스가 나열되고,
      AWS SDK 통합은 200개 이상 서비스의 API 작업을 arn:aws:states:::aws-sdk:서비스:API
      형식으로 직접 호출합니다. 또 arn:aws:states:::http:invoke 리소스를 쓰는 HTTP Task 로
      AWS 외부의 HTTPS API 도 호출할 수 있습니다.
    replacement: 최적화 통합 + AWS SDK 통합(200개 이상 서비스) + HTTP Task(외부 HTTPS API)
    evidence: https://docs.aws.amazon.com/step-functions/latest/dg/supported-services-awssdk.html

  - id: map-inline-only
    module: M11
    state: changed
    title: Map 상태를 인라인 동작으로만 설명
    courseware_location: '슬라이드 26 강사 노트의 "맵(Map) - 상태 입력에서 어레이의 여러 항목에 대해 동일한 단계를 실행합니다"'
    detail: >-
      교재의 Map 설명은 처리 모드를 구분하지 않습니다. 현재 Map 상태에는 Inline 과
      Distributed 두 처리 모드가 있습니다. Inline(기본)은 JSON 배열만 입력으로 받고 최대
      40개의 동시 반복을 지원하며 반복 이력이 부모 워크플로 실행 이력에 추가됩니다.
      Distributed 는 각 반복을 자체 실행 이력을 가진 하위 워크플로 실행으로 돌려 높은
      동시성을 내고(지정하지 않으면 10,000 병렬), Amazon S3 의 대규모 데이터 소스에서 입력을
      읽을 수 있으며 Standard 워크플로에서만 지원됩니다. 데이터 세트가 256KiB 를 넘거나
      실행 이벤트 이력이 25,000개를 넘거나 40개보다 많은 동시 반복이 필요하면 Distributed
      를 씁니다.
    replacement: Inline 모드(최대 40 동시 반복) / Distributed 모드(대규모 병렬, Standard 전용)
    evidence: https://docs.aws.amazon.com/step-functions/latest/dg/state-map-distributed.html
