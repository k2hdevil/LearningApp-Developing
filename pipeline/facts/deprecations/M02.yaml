# 폐기·변경 레지스트리 (M02 · 모듈 2 AWS에 웹 애플리케이션 구축)
#
# 교재(Developing on AWS 강사용 덱)에 등장하지만 현재는 종료·비권장·변경된 항목을 기록합니다.
# 본문에서 조용히 지우지 않고 여기에 근거와 함께 남긴 뒤, 모듈 문서의
# '교재 대비 변경 사항' 장에 delta로 표시합니다. 수강생이 공식 교재를 들고
# 있으므로 "책에는 있는데 자료에는 없다"는 질문에 답할 수 있어야 합니다.
#
# M02는 과정 애플리케이션(Pollynotes)의 아키텍처 워크스루 모듈입니다. 슬라이드 4~13이
# 같은 다이어그램을 두고 서비스를 개요 수준으로 소개하므로, 등재 대상은
#   (1) 교재가 단정한 프레이밍이 현재 지침과 다른 항목 (REST API 단독, EC2 대 Lambda, 콘솔 기능 동등성)
#   (2) 서비스의 문서 서술·콘솔 위치가 옮겨진 항목 (X-Ray 콘솔, Cognito managed login·기능 요금제,
#       S3 정적 웹 사이트 호스팅 권장 경로, DynamoDB 기본 용량 모드)
#   (3) 교재 내부에서 서로 어긋나는 표기 (외부 문서로 검증할 대상이 아님)
# 세 종류입니다. (3)은 evidence 를 붙이지 않고 courseware_internal: true 로 표시합니다.
#
# state 값
#   ended       : 서비스·버전 지원 종료. 본문에서 제거하고 대체안을 제시한다.
#   discouraged : 동작하지만 권장되지 않음. 본문 주 경로에서 빼고 주의로만 남긴다.
#   changed     : 동작·기본값·표기가 바뀜. 본문을 새 내용으로 교체한다.
#   incorrect   : 교재 기술이 사실과 다름. 교정한다.
#
# verified_on 은 아래 항목을 공식 문서로 확인한 날짜입니다.

verified_on: 2026-08-30

items:
  - id: apigateway-rest-api-only
    module: M02
    state: incorrect
    title: REST API
    courseware_location: '슬라이드 10 "모든 서비스 연결" 다이어그램의 텍스트 상자 "REST API / API Gateway가 요청을 AWS 리소스로 라우팅"'
    detail: >-
      교재 슬라이드 10 은 API Gateway 가 만드는 API 유형을 "REST API" 하나로만 표기합니다.
      현재 문서는 Amazon API Gateway 를 "어떤 규모에서도 REST, HTTP, WebSocket API 를
      생성·게시·유지 관리·모니터링·보호하는 서비스" 로 기술합니다. AWS 는 한쪽을 일률적으로
      권장하지 않고 기능·가격 기준으로 고르라고 안내합니다. API 키, 클라이언트별 스로틀링,
      요청 검증, AWS WAF 통합, 프라이빗 엔드포인트가 필요하면 REST API 를, 그 기능이 필요
      없으면 더 저렴한 HTTP API 를 선택하라는 것입니다. 이 과정이 REST API 를 쓰는 것은
      잘못된 선택이 아니지만, 교재는 선택 자체가 존재한다는 사실을 다루지 않습니다.
    replacement: REST API / HTTP API / WebSocket API 세 가지. 선택 기준은 "Choose between REST APIs and HTTP APIs"
    evidence: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-vs-rest.html

  - id: ec2-vs-lambda-cost-framing
    module: M02
    state: changed
    title: 지속적인 모니터링과 유지 관리
    courseware_location: '슬라이드 9 "사용자 저장 데이터 처리" 강사 노트의 "Amazon EC2 인스턴스는 애플리케이션의 컴퓨팅 요구 사항을 해결하지만 지속적인 모니터링과 유지 관리가 필요합니다. 비용을 절감하면서 애플리케이션 개발을 간소화하기 위해 ... AWS Lambda 함수를 생성합니다"'
    detail: >-
      교재는 EC2 를 "지속적인 모니터링과 유지 관리가 필요" 한 선택지로, Lambda 를
      "비용을 절감하면서 애플리케이션 개발을 간소화" 하는 대안으로 단정적으로 대비시킵니다.
      유지 관리 책임 부분은 현재 결정 안내서의 관리 오버헤드 서술과 방향이 같습니다.
      EC2 인스턴스 관리는 서버 설정·확장·패치·보안에 대한 책임을 포함하고 전담 운영 팀을
      요구할 수 있다고 기술합니다. 그러나 안내서는 같은 문단에서 "컴퓨팅 환경에 대한 세밀한
      제어가 필요한 사용 사례에서는 그 오버헤드가 정당화되는 경우가 많다" 고 덧붙이고,
      컴퓨팅 서비스 선택을 워크로드 유형·성능·확장성·관리 오버헤드·비용 최적화·지연 시간과
      처리량·컴플라이언스·통합·안정성·개발 경험 열 가지 요소의 균형 문제로 제시합니다.
      비용도 Lambda 로 옮기는 문제가 아니라 인스턴스 선택(Graviton 최대 40% 가격 대비 성능),
      구매 플랜(Savings Plans 최대 72%, Spot 최대 90%), 적정 크기 조정(Auto Scaling,
      Compute Optimizer 최대 25%)으로 접근합니다. 안내서는 "단일 워크로드에서 여러 유형의
      컴퓨팅 솔루션을 함께 사용할 수 있다" 고도 기술합니다. 즉 "Lambda 가 언제나 더 저렴하고
      간단하다" 는 결론은 문서가 지지하지 않습니다. 이 과정의 CRUD 워크로드에 Lambda 가
      맞는다는 판단 자체는 유효하고, 근거는 비용이 아니라 요청·이벤트 구동 워크로드라는
      특성입니다.
    replacement: 워크로드 특성에 따른 선택. 요청·이벤트 구동 CRUD 는 Lambda Functions, 세밀한 제어가 필요하면 EC2
    evidence: https://docs.aws.amazon.com/decision-guides/latest/decision-guides/choosing-aws-compute-service.html

  - id: console-supports-all-functions
    module: M02
    state: incorrect
    title: AWS Management Console은 액세스 권한을 획득하고 애플리케이션을 관리하는 데 필요한 모든 기능을 지원합니다
    courseware_location: 슬라이드 6 "개발자 도구" 강사 노트 첫 문단
    detail: >-
      교재는 콘솔을 기준점으로 두고 "AWS Management Console 은 ... 필요한 모든 기능을
      지원한다" 고 서술합니다. 문서의 동등성 서술은 범위와 방향이 다릅니다. AWS CLI 문서는
      "AWS Management Console 의 모든 IaaS 관리·운영·액세스 기능은 AWS API 와 AWS CLI 에서
      사용할 수 있고, 새 AWS IaaS 기능·서비스는 출시 시점 또는 출시 후 180일 안에 API·CLI 에서
      완전한 콘솔 기능을 제공한다" 고 적습니다. 범위가 IaaS 로 한정되고, 방향은 "콘솔 기능이
      API·CLI 에도 있다" 입니다. 콘솔이 모든 기능의 상위 집합이라고 문서가 서술하지는
      않습니다. 같은 노트의 결론("개발자는 콘솔 인터페이스를 사용하지 않고 이러한 도구로
      애플리케이션을 구축할 수 있습니다")은 문서와 방향이 같으므로 이 항목은 근거 문장의
      범위·방향 교정입니다.
    replacement: 콘솔의 IaaS 관리·운영·액세스 기능은 AWS API·AWS CLI 에서도 모두 제공되며, 새 IaaS 기능은 출시 시점 또는 180일 안에 도달합니다
    evidence: https://docs.aws.amazon.com/cli/latest/userguide/cli-chap-welcome.html

  - id: xray-console-no-longer-developed
    module: M02
    state: discouraged
    title: AWS X-Ray 콘솔
    courseware_location: '슬라이드 12 "애플리케이션을 관측가능하게 설정" 본문의 "AWS X-Ray / 추적" 과 슬라이드 4~13 다이어그램의 AWS X-Ray 레이블'
    detail: >-
      교재는 Amazon CloudWatch(관찰 기능)와 AWS X-Ray(추적)를 나란히 놓인 별개 서비스로
      제시합니다. 현재 문서는 "AWS 는 X-Ray 콘솔을 더 이상 개발하지 않는다" 고 명시하고,
      CloudWatch 콘솔에 X-Ray 콘솔에서 다시 설계한 새 X-Ray 기능이 포함되어 있다고
      기술합니다. X-Ray Service map 과 CloudWatch ServiceLens map 은 CloudWatch 콘솔 안의
      X-Ray trace map 으로 통합되었고, X-Ray Insights 도 CloudWatch 콘솔의 Insights 에
      포함됩니다. X-Ray 자체가 종료된 것은 아니므로 state 는 ended 가 아니라 discouraged
      입니다. 달라지는 것은 화면 경로입니다. M01 도 같은 사안을 같은 근거로 기록했습니다.
    replacement: Amazon CloudWatch 콘솔의 X-Ray traces → Trace Map. 서비스 단위 관찰은 CloudWatch Application Signals
    evidence: https://docs.aws.amazon.com/xray/latest/devguide/aws-xray-interface-console.html

  - id: cloudwatch-xray-separate-services
    module: M02
    state: changed
    title: 관찰 기능
    courseware_location: '슬라이드 12 본문의 네 항목 "Amazon CloudWatch / 관찰 기능 / AWS X-Ray / 추적"'
    detail: >-
      교재는 관찰 기능을 CloudWatch 에, 추적을 X-Ray 에 배정해 서비스 단위로 나눕니다.
      현재 CloudWatch 문서는 추적을 CloudWatch 관찰 가능성 이야기의 일부로 다룹니다.
      CloudWatch 에이전트가 EC2 플릿에서 지표·로그·추적을 함께 수집하고, 교차 계정 관찰
      가능성에서 중앙 계정에서 소스 계정의 지표·로그·추적을 보며, 네이티브 OTLP 엔드포인트가
      OpenTelemetry 표준으로 지표·로그·추적을 수집합니다. 교재에 없는 Application Signals,
      CloudWatch Synthetics canary, CloudWatch RUM, 서비스 수준 목표(SLO), Lambda Insights
      도 CloudWatch 의 APM·인프라 모니터링 항목에 들어 있습니다.
    replacement: CloudWatch 관찰 가능성 안에 지표·경보·대시보드·로그·추적·APM(Application Signals·Synthetics·RUM·SLO)이 함께 있음
    evidence: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/WhatIsCloudWatch.html

  - id: cognito-builtin-signup-signin-ui
    module: M02
    state: changed
    title: 기본 제공 가입 및 로그인 옵션
    courseware_location: '슬라이드 11 "사용자 액세스" 강사 노트의 "사용자 풀은 애플리케이션 사용자의 기본 제공 가입 및 로그인 옵션을 생성하는 사용자 디렉터리입니다"'
    detail: >-
      사용자 풀이 가입·로그인 화면을 제공한다는 사실은 그대로입니다. 달라진 것은 그 화면의
      이름과 사용자 지정 경로입니다. 현재 문서에는 managed login 과 hosted UI (classic) 두
      브랜딩 버전이 있고, 문서는 classic hosted UI 를 managed login 의 "더 얇고 덜 사용자
      지정 가능한 선행 버전" 이라고 기술합니다. 두 버전 모두 가입·로그인·암호 관리를 지원하고
      MFA 완료와 webAuthn 인증자 등록을 포함하지만, managed login 은 속성 변경·MFA 기본 설정
      같은 사용자 자기 서비스 프로필 관리를 지원하지 않아 그 부분은 애플리케이션 코드로 직접
      구현해야 합니다. TLS 요구도 다릅니다. managed login 은 사용자 지정 도메인과 접두사
      도메인 모두에 TLS 1.2 를 요구하고 classic hosted UI 는 사용자 지정 도메인에 요구하지
      않습니다. 콘솔에서 앱 클라이언트를 만들면 브랜딩 스타일이 자동 할당되지만
      CreateUserPoolClient 로 만들면 CreateManagedLoginBranding 을 호출할 때까지 managed
      login 을 쓸 수 없습니다.
    replacement: managed login (권장 브랜딩 버전) / hosted UI (classic)
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-managed-login.html

  - id: cognito-feature-plans-added
    module: M02
    state: changed
    title: Amazon Cognito
    courseware_location: 슬라이드 11 본문의 "Amazon Cognito / 사용자 풀 / 자격 증명 풀" 구성
    detail: >-
      교재는 Amazon Cognito 를 사용자 풀·자격 증명 풀 두 구성 요소로만 소개하고 요금제
      개념을 다루지 않습니다. 현재 사용자 풀에는 기능 요금제(feature plan)가 있습니다.
      Lite(로그인 기능과 classic hosted UI 를 포함한 저비용 요금제), Essentials(최신 인증 기능
      전체, 선택 기반 로그인·이메일 MFA 포함), Plus(Essentials 에 위협 보호 추가) 세 가지이고
      신규 사용자 풀의 기본값은 Essentials 입니다. 요금제는 사용자 풀 단위로 적용되며 앱
      클라이언트별로 다르게 둘 수 없습니다. API 에서는 CreateUserPool·UpdateUserPool 의
      UserPoolTier 파라미터, AWS CLI 에서는 --user-pool-tier 인자로 설정하고 값을 지정하지
      않으면 Essentials 가 됩니다. 예전에 "advanced security features" 요금 구조에 있던
      기능들은 지금 Essentials 또는 Plus 로 편입되었습니다. 실습에서 사용자 풀을 만들 때
      교재에 없는 선택 화면을 만나게 됩니다.
    replacement: Lite / Essentials(기본값) / Plus 기능 요금제
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-sign-in-feature-plans.html

  - id: s3-frontend-hosting-recommendation
    module: M02
    state: changed
    title: 프런트엔드 호스팅
    courseware_location: '슬라이드 7 "애플리케이션 저장 및 호스팅" 본문의 "Amazon S3 / 프런트엔드 호스팅 / 사용자 파일 스토리지" 와 강사 노트의 "Amazon S3 버킷을 사용하여 애플리케이션의 프런트 엔드로 작동하는 웹 사이트를 호스팅"'
    detail: >-
      S3 가 호스팅과 파일 스토리지 두 요구를 모두 충족한다는 교재 서술 자체는 유지됩니다.
      문서의 사용 사례 목록에도 "웹 사이트" 와 "모바일 애플리케이션" 이 함께 있습니다.
      달라진 것은 권장 경로입니다. 정적 웹 사이트 호스팅 문서는 "S3 에 저장된 정적 웹 사이트
      콘텐츠를 호스팅하려면 AWS Amplify Hosting 을 사용하는 것을 권장한다" 고 명시합니다.
      Amplify Hosting 은 CloudFront 기반 전역 CDN 에 배포하는 완전 관리형 서비스로 공개
      HTTPS URL 을 생성합니다. 또 버킷이 SSE-KMS 로 암호화되어 있으면 SSE-KMS 가 익명
      사용자를 지원하지 않으므로 CloudFront 배포가 필수이고, 오리진 보호에는 OAI 가 아니라
      OAC 를 써야 합니다. M06 6.1절이 같은 근거로 같은 내용을 기록했습니다.
    replacement: AWS Amplify Hosting(1순위 권장) / CloudFront + OAC(SSE-KMS 버킷은 필수) / S3 웹 사이트 엔드포인트(교재 방식)
    evidence: https://docs.aws.amazon.com/AmazonS3/latest/userguide/WebsiteHosting.html

  - id: dynamodb-fast-and-predictable-wording
    module: M02
    state: changed
    title: 완전관리형 NoSQL 데이터베이스 서비스로서 원활한 확장성과 함께 빠르고 예측 가능한 성능
    courseware_location: 슬라이드 8 "사용자 저장 데이터 관리" 강사 노트
    detail: >-
      교재는 DynamoDB 를 "완전관리형 NoSQL 데이터베이스 서비스로서 원활한 확장성과 함께
      빠르고 예측 가능한 성능을 제공" 한다고 서술합니다. 현재 문서의 첫 문장은 "어떤
      규모에서도 한 자릿수 밀리초 성능을 내는 서버리스 완전 관리형 분산 NoSQL 데이터베이스"
      입니다. 성능 서술이 "빠르고 예측 가능한" 에서 "한 자릿수 밀리초" 로 구체화되었고,
      "서버리스" 와 "분산" 이 정의 문장에 들어왔습니다. 서버리스 특성으로는 다운타임 없는
      유지 관리, 버전(주·부·패치) 없음, 유지 관리 기간 없음, 온디맨드에서 트래픽이 없으면
      0 까지 축소되고 콜드 스타트가 없다는 점이 기술됩니다. 의미가 뒤집히는 오류는 아니지만
      수강생이 문서를 찾아갈 때 문장이 달라 보입니다.
    replacement: 어떤 규모에서도 한 자릿수 밀리초 성능을 내는 서버리스 완전 관리형 분산 NoSQL 데이터베이스
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html

  - id: dynamodb-capacity-sizing-default-mode
    module: M02
    state: changed
    title: 용량 크기 조정
    courseware_location: 슬라이드 8 본문의 "용량 크기 조정" 항목과 강사 노트의 "이 확장성을 사용하여 애플리케이션의 기능적 용량 요구 사항을 충족할 수 있습니다"
    detail: >-
      교재는 "용량 크기 조정" 이라고만 적고 용량 모드를 구분하지 않습니다. 현재 문서는
      "온디맨드 모드가 기본이자 권장 처리량 옵션" 이라고 명시합니다. 온디맨드는 용량 계획을
      없애고 요청당 과금하며 이미 도달한 트래픽 수준으로는 즉시 대응하고 새 최고치에서는
      자동 확장하며, 트래픽이 0 이면 처리량 요금이 부과되지 않습니다. 프로비저닝 모드와 같은
      한 자릿수 밀리초 지연 시간·SLA·보안을 제공합니다. 기본 설정으로 테이블을 만들면
      온디맨드 모드가 되므로 예전 화면 캡처와 실습 화면이 다를 수 있습니다. M07 3.13.5 절과
      M08 2.5절이 같은 근거로 같은 내용을 기록했습니다.
    replacement: 온디맨드 용량 모드(기본이자 권장) / 프로비저닝된 용량 모드
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/on-demand-capacity-mode.html

  - id: lambda-two-compute-primitives
    module: M02
    state: changed
    title: AWS Lambda
    courseware_location: 슬라이드 9 본문의 "AWS Lambda / 서버리스 / 용량 크기 조정" 과 다이어그램의 "비즈니스 로직" 상자
    detail: >-
      교재는 Lambda 를 함수 하나의 개념으로만 다룹니다. 현재 Lambda 문서는 워크로드 패턴에
      따라 설계된 두 가지 컴퓨팅 프리미티브를 제시합니다. Lambda Functions 는 이벤트·API
      호출에 응답해 코드를 실행하고 각 호출이 독립적으로 실행되며 수요에 맞춰 수평 확장되고,
      Lambda MicroVMs 는 시작이 거의 즉시이고 최대 8시간까지 상태를 유지하는 격리된 컴퓨팅
      환경입니다. 두 프리미티브는 서버 관리 불필요·사용량 기반 과금·관리형 네트워킹·
      Firecracker 가상화를 공유합니다. 이 과정의 실습은 Lambda Functions 경로이므로 실습
      내용이 달라지는 것은 아니지만, 문서를 찾아갈 때 두 프리미티브가 구분되어 있다는 점을
      알아야 합니다. M01·M09 도 같은 사안을 기록했습니다.
    replacement: Lambda Functions(이 과정의 실습 경로) / Lambda MicroVMs
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/welcome.html

