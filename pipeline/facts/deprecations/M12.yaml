# 폐기·변경 레지스트리 (M12 · 모듈 12 내 애플리케이션의 사용자에게 액세스 권한 부여하기)
#
# 교재(Developing on AWS 강사용 덱)에 등장하지만 현재는 종료·비권장·변경된 항목을 기록합니다.
# 본문에서 조용히 지우지 않고 여기에 근거와 함께 남긴 뒤, 모듈 문서의
# '교재 대비 변경 사항' 장에 delta로 표시합니다. 수강생이 공식 교재를 들고
# 있으므로 "책에는 있는데 자료에는 없다"는 질문에 답할 수 있어야 합니다.
#
# state 값
#   ended       : 서비스·버전 지원 종료. 본문에서 제거하고 대체안을 제시한다.
#   discouraged : 동작하지만 권장되지 않음. 본문 주 경로에서 빼고 주의로만 남긴다.
#   changed     : 동작·기본값·표기가 바뀜. 본문을 새 내용으로 교체한다.
#   incorrect   : 교재 기술이 사실과 다름. 교정한다.
#
# courseware_internal: true 는 교재 안에서 본문과 강사 노트가 어긋나는 등
#   외부 문서로 검증할 대상이 아닌 항목입니다. evidence 를 비워 둡니다.
#
# verified_on 은 아래 항목을 공식 문서로 확인한 날짜입니다.

verified_on: 2026-09-01

items:
  # ---------------------------------------------------------------
  # incorrect — 교재 기술이 공식 문서와 다름 (외부 근거 있음)
  # ---------------------------------------------------------------
  - id: jwt-signature-hmac
    module: M12
    state: incorrect
    title: 'HMACSHA256(base64UrlEncode(header) + "." + base64UrlEncode(payload), {secret})'
    courseware_location: '슬라이드 18 "JSON 웹 토큰: ID, Access 및 Refresh" 본문의 서명 예시'
    detail: >-
      슬라이드 18 은 JWT 헤더에 alg 를 RS256 으로 적으면서 같은 슬라이드의 서명 줄을
      HMACSHA256(..., {secret}) 로 표기합니다. HMACSHA256 은 공유 비밀 키를 쓰는 대칭
      HMAC 이고 RS256 은 SHA-256 을 쓰는 RSA 비대칭 서명이므로 한 슬라이드 안에서 두
      알고리즘이 섞여 있습니다. 공식 문서는 사용자 풀이 RS256 암호화 알고리즘을
      사용한다고 명시하며, Amazon Cognito 는 사용자 풀마다 RSA 키 페어를 두 쌍 만들어
      액세스 토큰과 ID 토큰을 각각 다른 프라이빗 키로 서명합니다. 따라서 검증은 공유
      비밀이 아니라 사용자 풀의 공개 JWKS 로 합니다.
    replacement: 'RS256 (RSA + SHA-256) 비대칭 서명. 검증은 jwks_uri 의 공개 키로 수행'
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/amazon-cognito-user-pools-using-the-id-token.html

  - id: payload-described-as-encrypted
    module: M12
    state: incorrect
    title: 'JWT 페이로드를 "암호화된 정보"로 기술'
    courseware_location: '슬라이드 18 강사 노트("키의 클레임에 대한 암호화된 정보"), 슬라이드 29 지식 확인 문제 4 정답 "참", 슬라이드 36 용어("클레임: 암호화된 사용자 정보가 있는 페이로드")'
    detail: >-
      교재는 세 곳에서 JWT 페이로드를 암호화된 정보라고 기술합니다. 공식 문서는
      Amazon Cognito 가 토큰을 base64url 로 인코딩한 문자열로 발급하며 ID 토큰과 액세스
      토큰은 base64url 에서 평문 JSON 으로 디코딩할 수 있다고 명시합니다. 암호화되는
      것은 refresh 토큰이며 이는 사용자 풀 사용자·관리자에게 불투명하고 사용자 풀만
      읽을 수 있습니다. 슬라이드 18 자체가 페이로드를 평문 JSON 으로 보여 주므로
      교재 안에서도 어긋납니다. 페이로드는 누구든 디코딩해 읽을 수 있으므로 비밀을
      담아서는 안 되고, 무결성은 암호화가 아니라 서명 검증으로 보장합니다.
    replacement: 'base64url 로 인코딩되고 서명된 정보(암호화되지 않음). 슬라이드 29 문제 4 의 정답은 "거짓"으로 교정'
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/amazon-cognito-user-pools-using-tokens-with-identity-providers.html

  - id: iso-9001-compliance
    module: M12
    state: incorrect
    title: 'ISO(International Organization for Standardization) 9001'
    courseware_location: '슬라이드 9 "Amazon Cognito란?" 강사 노트의 보안·규정 준수 표준 목록'
    detail: >-
      강사 노트는 Amazon Cognito 가 준수하는 표준으로 PCI DSS, SOC, ISO 9001 을
      나열합니다. Amazon Cognito 문서가 명시하는 ISO 표준은 ISO 27001(정보 보안 관리
      체계)이며 ISO 9001(품질 경영 시스템)이 아닙니다. 문서는 공동 책임 모델의
      클라우드의 보안 의무가 SOC 1-3, PCI DSS, ISO 27001 을 준수하고 HIPAA-BAA
      대상이라고 기술하고, 고객이 설계하는 클라우드에서의 보안은 SOC 1-3, ISO 27001,
      HIPAA-BAA 로는 준수하도록 설계할 수 있으나 PCI DSS 로는 그럴 수 없다고 명시합니다.
      또 규정 준수 검증 페이지가 나열하는 프로그램은 SOC, PCI, FedRAMP, HIPAA 입니다.
      교재 목록은 여기에 표준 기반 인증(OAuth 2.0·SAML 2.0·OIDC)과 MFA 를 함께 넣어
      규정 준수 프로그램과 서비스 기능을 한 목록에 섞어 놓았습니다.
    replacement: 'SOC 1-3 / PCI DSS / ISO 27001 / HIPAA-BAA 대상. 클라우드에서의 보안은 PCI DSS 준수로 설계할 수 없음'
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html

  - id: login-for-amazon
    module: M12
    state: incorrect
    title: Login for Amazon
    courseware_location: '슬라이드 10 "Amazon Cognito 구성 요소(1/3)" 강사 노트의 소셜 아이덴티티 공급자 목록'
    detail: >-
      슬라이드 10 강사 노트가 서드 파티 공급자 이름을 Login for Amazon 으로 씁니다.
      공식 이름은 Login with Amazon 입니다. 같은 덱의 슬라이드 9·19·24 강사 노트는
      Login with Amazon 으로 올바르게 표기하므로 교재 안에서도 표기가 갈립니다.
    replacement: Login with Amazon
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-social-idp.html

  - id: path-parameter-parentheses
    module: M12
    state: incorrect
    title: /notes/(id)
    courseware_location: '슬라이드 24 "애플리케이션" 과 슬라이드 31 "실습 6 워크플로" 다이어그램의 API 경로 표'
    detail: >-
      두 슬라이드의 API 경로 표가 삭제·업데이트 경로를 /notes/(id) 처럼 소괄호로
      표기합니다. API Gateway 경로 파라미터 표기는 중괄호입니다. 문서의 PetStore 샘플
      API 에서 개별 리소스 경로는 /pets/{petId} 이고 get-resources 응답의 pathPart 도
      {petId} 입니다.
    replacement: /notes/{id}
    evidence: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-method-settings-method-request.html

  - id: jwt-claim-names-capitalized
    module: M12
    state: incorrect
    title: 'Sub / Aud / Jti / Scope 처럼 클레임 이름을 대문자로 시작'
    courseware_location: '슬라이드 18 강사 노트의 ID 토큰·Access 토큰 클레임 설명 표'
    detail: >-
      강사 노트가 클레임 이름을 Sub, Aud, Jti, Scope 처럼 첫 글자를 대문자로 씁니다.
      JWT 클레임 이름은 대소문자를 구분하고 공식 문서의 ID 토큰·액세스 토큰 페이로드
      표기는 모두 소문자(sub, aud, jti, scope)입니다. 같은 노트의 다른 줄과 슬라이드
      본문 코드 예시는 소문자를 쓰므로 교재 안에서도 표기가 갈립니다.
    replacement: 'sub / aud / jti / scope (모두 소문자)'
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/amazon-cognito-user-pools-using-the-id-token.html

  - id: refresh-token-signup-baseline
    module: M12
    state: incorrect
    title: 'Refresh 토큰은 애플리케이션 사용자가 사용자 풀에 가입한 후 30일 후에 만료'
    courseware_location: '슬라이드 18 강사 노트의 Refresh 토큰 설명'
    detail: >-
      강사 노트는 refresh 토큰 기본 만료의 기준점을 가입 시점으로 씁니다. 공식 문서의
      표현은 사용자가 사용자 풀에 로그인한 후(signs into your user pool) 30일이므로
      기준은 가입이 아니라 로그인입니다. 설정 범위 60분~10년은 교재 서술과 일치합니다.
    replacement: '사용자가 사용자 풀에 로그인한 후 30일(기본값). 앱 클라이언트별로 60분~10년 설정 가능'
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/amazon-cognito-user-pools-using-the-refresh-token.html

  - id: custom-attribute-examples-are-standard
    module: M12
    state: incorrect
    title: '사용자 지정 속성의 예로 닉네임·그림 제시'
    courseware_location: '슬라이드 15 "속성, 범위 및 그룹" 본문의 속성 열("표준 속성(이메일, 이름) / 사용자 지정(닉네임, 그림)")'
    detail: >-
      슬라이드 본문이 사용자 지정 속성의 예로 닉네임과 그림을 듭니다. nickname 과
      picture 는 OpenID Connect 명세에 근거한 사용자 풀 표준 속성 18개(name,
      family_name, given_name, middle_name, nickname, preferred_username, profile,
      picture, website, gender, birthdate, zoneinfo, locale, updated_at, address,
      email, phone_number, sub)에 포함되므로 사용자 지정 속성이 아닙니다. 실제 사용자
      지정 속성은 이름에 custom: 접두사가 붙고 사용자 풀당 최대 50개이며 추가 후
      제거·변경할 수 없습니다.
    replacement: '표준 속성 18개에 nickname·picture 포함. 사용자 지정 속성은 custom: 접두사, 최대 50개, 추가 후 변경 불가'
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-attributes.html

  - id: basic-flow-apis-with-enhanced-flow-reference
    module: M12
    state: incorrect
    title: 'GetOpenIdToken + AssumeRoleWithWebIdentity 를 제시하면서 Enhanced Flow 문서를 참조'
    courseware_location: '슬라이드 25 "API에 대한 액세스를 부여하는 대체 솔루션" 강사 노트의 IAM 자격 증명 기반 정책용 인증 워크플로 3단계와 참조 링크'
    detail: >-
      강사 노트 3단계는 사용자가 GetOpenIdToken 과 AssumeRoleWithWebIdentity 요청을
      발행한다고 서술하고, 참조 링크로 Understanding Amazon Cognito Authentication
      Part 4 Enhanced Flow 블로그를 제시합니다. 공식 문서 기준으로 GetId →
      GetOpenIdToken → AssumeRoleWithWebIdentity 는 basic(classic) 흐름의 작업
      순서이고 enhanced 흐름은 GetId → GetCredentialsForIdentity 두 단계입니다.
      즉 설명하는 흐름과 참조하는 문서가 서로 다른 흐름입니다. 참조 URL 자체는
      살아 있으나(HTTP 200) 블로그 내용은 근거로 쓰지 않았습니다.
    replacement: 'enhanced 흐름은 GetId → GetCredentialsForIdentity, basic(classic) 흐름은 GetId → GetOpenIdToken → AssumeRoleWithWebIdentity'
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/authentication-flow.html

  - id: aws-access-keys-wording
    module: M12
    state: incorrect
    title: '사용자에게 AWS 액세스 키를 부여해야 하는가?'
    courseware_location: '슬라이드 10 "Amazon Cognito 구성 요소(1/3)" 본문의 자격 증명 풀 질문'
    detail: >-
      슬라이드 본문은 자격 증명 풀을 선택하는 질문을 사용자에게 AWS 액세스 키를
      부여해야 하는가로 씁니다. 공식 문서는 자격 증명 풀이 임시 AWS 자격 증명
      (temporary AWS credentials)을 발급한다고 기술하며, 같은 덱의 슬라이드 10 강사
      노트와 슬라이드 21 도 임시 AWS 보안 인증 정보로 씁니다. 액세스 키라는 표현은
      IAM 사용자의 장기 액세스 키와 혼동될 수 있습니다.
    replacement: '사용자에게 임시 AWS 자격 증명을 발급해야 하는가?'
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html

  # ---------------------------------------------------------------
  # changed — 동작·기본값·이름이 바뀜
