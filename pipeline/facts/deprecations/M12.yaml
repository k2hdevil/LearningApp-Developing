  - id: advanced-security-features-renamed
    module: M12
    state: changed
    title: 고급 보안 기능(advanced security features)
    courseware_location: '슬라이드 9 "Amazon Cognito란?" 강사 노트의 규정 준수 항목("고급 보안 기능으로 사용자를 보호합니다")'
    detail: >-
      강사 노트는 사용자 보호 기능을 고급 보안 기능이라고 부릅니다. 공식 문서는 이
      기능을 위협 보호(threat protection)로 부르며 이전에 advanced security features
      라고 불렸다고 명시합니다. 위협 보호는 Plus 기능 요금제에서 제공되고 구성 요소는
      침해된 자격 증명 감지, 적응형 인증, IP 주소 허용·차단 목록, 로그 내보내기입니다.
      예전 advanced security features 요금 구조에 있던 기능들은 현재 Essentials 또는
      Plus 요금제로 편입되었습니다. 제약도 있습니다. USER_SRP_AUTH 흐름에서는 적응형
      인증만 켤 수 있고, 페더레이션 로그인에는 위협 보호를 쓸 수 없으며, 위협 보호는
      요청 속도 제한을 적용하지 않으므로 대량 트래픽 공격 방어에는 AWS WAF 웹 ACL 을
      함께 써야 합니다.
    replacement: '위협 보호(threat protection). Plus 기능 요금제'
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pool-settings-threat-protection.html

  - id: hosted-ui-classic
    module: M12
    state: changed
    title: 호스트된 UI
    courseware_location: '슬라이드 11·12 "Amazon Cognito 구성 요소(2/3)·(3/3)" 본문의 사용자 풀 특징'
    detail: >-
      슬라이드 본문은 사용자 풀의 특징을 호스트된 UI 로 적습니다. 현재 사용자 풀의
      기본 제공 로그인 화면은 managed login 과 hosted UI (classic) 두 브랜딩 버전으로
      나뉘고, 문서는 classic hosted UI 를 managed login 의 더 얇고 덜 사용자 지정
      가능한 선행 버전으로 기술합니다. managed login 은 속성 변경·MFA 기본 설정 같은
      사용자 자체 서비스 프로필 관리를 지원하지 않으므로 프로필 관리는 애플리케이션
      코드로 구현해야 합니다. 두 버전 모두 사용자 지정 CORS 오리진 정책을 지원하지
      않고, managed login 은 사용자 지정 도메인과 접두사 도메인 모두에 TLS 1.2 를
      요구합니다. 브랜딩 버전을 바꾸면 사용자 세션이 유지되지 않습니다.
    replacement: 'managed login(최신) / hosted UI (classic)(선행 버전)'
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-managed-login.html

  - id: feature-plans-added
    module: M12
    state: changed
    title: 기능 요금제(Lite / Essentials / Plus) 선택이 교재에 없음
    courseware_location: '슬라이드 9~12 "Amazon Cognito" 섹션 전체와 슬라이드 27 데모 노트("사용자 풀 및 앱 클라이언트 ID 생성")'
    detail: >-
      교재는 Amazon Cognito 를 사용자 풀·자격 증명 풀 두 구성 요소로만 소개하고 기능
      요금제 개념을 다루지 않습니다. 현재 사용자 풀에는 Lite·Essentials·Plus 기능
      요금제가 있고 신규 사용자 풀의 기본값은 Essentials 입니다. 요금제는 사용자 풀
      단위로 적용되며 사용자 풀 안의 앱 클라이언트별로 다르게 둘 수 없습니다.
      CreateUserPool·UpdateUserPool 의 UserPoolTier 파라미터(CLI 는 --user-pool-tier)로
      설정하고 값을 주지 않으면 Essentials 가 기본값이며, AdvancedSecurityMode 를
      AUDIT 또는 ENFORCED 로 설정하면 요금제가 PLUS 여야 합니다. M12 의 여러 기능이
      요금제에 따라 갈립니다. 패스키 인증은 Lite 제외, 이메일 MFA·이메일 OTP 와 암호
      이력(PasswordHistorySize)은 Essentials 이상, 위협 보호는 Plus, 액세스 토큰
      사용자 지정은 Lite 아닌 요금제와 이벤트 버전 2 가 필요합니다.
    replacement: 'Lite / Essentials(신규 기본값) / Plus. UserPoolTier 파라미터로 설정'
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-sign-in-feature-plans.html

  - id: sns-sms-replaced-by-end-user-messaging
    module: M12
    state: changed
    title: 'SMS 전송을 Amazon SNS 로만 설명'
    courseware_location: '슬라이드 14 "가입 및 로그인을 위한 사용자 풀 생성" 강사 노트 6번("단문 메시지 서비스(SMS)와 사용자 지정 이메일 전송 옵션을 설정합니다")'
    detail: >-
      교재는 SMS·이메일 전송을 옵션을 설정한다고만 적습니다. 문서는 2024년 11월에
      AWS 가 Amazon SNS SMS 메시징을 AWS End User Messaging SMS 로 대체했다고 명시하고,
      현재 사용자 풀의 SMS 구성 경로가 두 갈래라고 기술합니다. Amazon SNS 경로는
      Amazon Cognito 가 Amazon SNS Publish 를 호출하고 그것이 AWS End User Messaging
      SMS 로 전달되며 sns:Publish 권한이 필요합니다. AWS End User Messaging SMS 직접
      경로는 SendTextMessage 를 직접 호출하며 sms-voice:SendTextMessage 권한이
      필요합니다. 두 구성은 상호 배타적이어서 한쪽을 설정하면 다른 쪽이 지워집니다.
      처음 문자 메시지를 보내면 계정이 샌드박스 환경에 놓입니다.
    replacement: 'Amazon SNS 경로(sns:Publish) 또는 AWS End User Messaging SMS 직접 경로(sms-voice:SendTextMessage). 상호 배타적'
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-sms-settings.html

  - id: console-user-pool-wizard-changed
    module: M12
    state: changed
    title: 콘솔에서 사용자 풀을 만드는 흐름
    courseware_location: '슬라이드 27 "데모 노트" 의 "Cognito UI 설명 - 사용자 풀과 자격 증명 풀 표시", "사용자 풀 및 앱 클라이언트 ID 생성"'
    detail: >-
      데모가 콘솔 조작을 전제하는데 현재 콘솔의 사용자 풀 생성은 애플리케이션 중심
      흐름으로 바뀌었습니다. Define your application 에서 애플리케이션 유형을 고르고,
      이름을 입력하고, Configure options 에서 로그인 식별자와 가입 필수 속성을 정하고,
      반환 URL 을 입력한 뒤 Create your application 을 선택하면 Amazon Cognito 가
      해당 유형의 기본 설정으로 사용자 풀과 앱 클라이언트를 함께 만듭니다. 외부 IdP·
      MFA 같은 옵션은 리소스를 만든 뒤 구성합니다. 이 과정에서 되돌릴 수 없는 기본
      구성이 생기며 문서가 표로 제시하는 항목은 클라이언트 보안 암호, preferred_username
      별칭 미허용, 사용자 이름 대소문자 구분 없음 세 가지입니다. 문서는 콘솔로 테스트
      환경을 만든 뒤 완성된 설계를 CloudFormation·CDK 로 프로덕션에 배포하도록
      권장합니다.
    replacement: '애플리케이션 중심 생성 흐름(Define your application → Configure options → Add a return URL → Create your application)'
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/getting-started-user-pools-application.html

  - id: user-auth-choice-based-flow-added
    module: M12
    state: changed
    title: '"인증 흐름 지원" 이라고만 적고 흐름 이름을 제시하지 않음'
    courseware_location: '슬라이드 14 본문의 보안 요구 사항 지정 열("인증 흐름 지원")'
    detail: >-
      교재는 사용자 풀의 인증 흐름을 이름 하나도 제시하지 않습니다. 실제로는 앱
      클라이언트의 ExplicitAuthFlows 에 허용할 흐름을 명시적으로 골라야 하고 값은
      ALLOW_USER_PASSWORD_AUTH, ALLOW_ADMIN_USER_PASSWORD_AUTH, ALLOW_USER_SRP_AUTH,
      ALLOW_USER_AUTH 입니다. 교재 이후 추가된 선택 기반 로그인(USER_AUTH)은 사용자
      풀의 SignInPolicy.AllowedFirstAuthFactors 에 PASSWORD·EMAIL_OTP·SMS_OTP·
      WEB_AUTHN 을 지정해 사용자가 로그인 방법을 고르게 하며, 암호 없는 로그인(OTP)과
      패스키(WebAuthn)는 이 흐름을 통해서만 쓸 수 있습니다. 문서는 사용자 지정 앱의
      사용자 이름·암호 인증에는 SRP 를 쓰는 것을 보안 모범 사례로 제시합니다.
    replacement: 'ExplicitAuthFlows 로 흐름 선택. 암호 없는 로그인·패스키는 ALLOW_USER_AUTH(선택 기반 로그인) 전용'
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/amazon-cognito-user-pools-authentication-flow-methods.html

  # ---------------------------------------------------------------
  # discouraged — 동작하지만 권장되지 않음
  # ---------------------------------------------------------------
  - id: implicit-grant-legacy
    module: M12
    state: discouraged
    title: 암묵적 흐름(implicit grant)
    courseware_location: '슬라이드 15 "속성, 범위 및 그룹" 강사 노트의 범위 설명("OAuth2.0 권한 부여 코드 부여 흐름, 암묵적 흐름과 클라이언트 보안 인증 정보 흐름에서 범위를 요청할 수 있습니다")'
    detail: >-
      교재는 세 그랜트를 아무런 우열 없이 나란히 제시합니다. 공식 문서는 암묵적
      그랜트를 레거시 권한 부여 그랜트(a legacy authorization grant)로 명시하고,
      권한 부여 코드 그랜트와 달리 사용자가 토큰을 가로채 검사할 수 있으므로 암묵적
      그랜트를 통한 토큰 전달을 막으려면 앱 클라이언트가 권한 부여 코드 그랜트만
      지원하도록 구성하라고 안내합니다. 암묵적 그랜트는 refresh 토큰을 발급하지 않고
      PKCE 와 호환되지 않습니다. 또 퍼블릭 클라이언트 앱의 보안 모범 사례는 권한 부여
      코드 그랜트만 활성화하고 PKCE 를 구현하는 것입니다. 클라이언트 자격 증명 그랜트는
      암묵적·권한 부여 코드 그랜트와 같은 앱 클라이언트에서 함께 활성화할 수 없습니다.
    replacement: '권한 부여 코드 그랜트 + PKCE. 퍼블릭 클라이언트에서는 권한 부여 코드 그랜트만 활성화'
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/federation-endpoints-oauth-grants.html

  - id: identity-pool-basic-classic-flow
    module: M12
    state: discouraged
    title: '자격 증명 풀 basic(classic) 흐름'
    courseware_location: '슬라이드 25 강사 노트의 IAM 자격 증명 기반 정책용 인증 워크플로(GetOpenIdToken + AssumeRoleWithWebIdentity)'
    detail: >-
      교재가 제시하는 GetOpenIdToken + AssumeRoleWithWebIdentity 는 자격 증명 풀의
      basic(classic) 흐름입니다. 문서는 enhanced 흐름이 개발자 노력이 가장 적은 가장
      안전한 선택이라고 명시하고, 새 자격 증명 풀을 만들 때 basic(classic) 인증을
      기본으로 활성화하지 않는 것을 모범 사례로 제시합니다. basic 흐름을 쓰려면 먼저
      웹 자격 증명용 IAM 역할의 신뢰 관계를 평가하고 역할 선택 로직을 클라이언트에
      구현한 뒤 클라이언트가 사용자에 의해 변조되지 않도록 보호해야 합니다. 역할
      매핑(RoleMappings)이 있는 자격 증명 풀에서는 GetOpenIdToken 이 오류를 반환합니다.
      basic 흐름에서만 유효한 것도 있습니다. 네트워크 기반 조건 키(aws:SourceIp)는
      enhanced 흐름 역할의 신뢰 정책에 넣으면 절대 충족되지 않습니다.
    replacement: 'enhanced 흐름(GetId → GetCredentialsForIdentity). 자격 증명은 1시간 유효'
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/authentication-flow.html

  - id: unused-account-validity-days
    module: M12
    state: discouraged
    title: UnusedAccountValidityDays
    courseware_location: '슬라이드 14 강사 노트 3번의 "임시 암호 만료 기간 설정"'
    detail: >-
      교재는 임시 암호 만료 기간을 설정한다고만 적습니다. 현재 이 값은 PasswordPolicyType
      의 TemporaryPasswordValidityDays 이며 기본값 7일, 유효 범위 0~365 입니다. 문서는
      사용자 풀에 TemporaryPasswordValidityDays 를 설정하면 그 사용자 풀에서 레거시
      파라미터 UnusedAccountValidityDays 에 더 이상 값을 설정할 수 없다고 명시합니다.
      오래된 자료나 기존 템플릿에서 UnusedAccountValidityDays 를 만나면 새 파라미터로
      바꿔야 합니다.
    replacement: 'TemporaryPasswordValidityDays (기본 7일, 0~365)'
    evidence: https://docs.aws.amazon.com/cognito-user-identity-pools/latest/APIReference/API_PasswordPolicyType.html

  - id: developer-attributes-legacy
    module: M12
    state: discouraged
    title: '개발자 속성(dev: 접두사)'
    courseware_location: '슬라이드 15 강사 노트의 속성 설명(표준 속성과 사용자 지정 속성만 다루는 지점)'
    detail: >-
      교재는 속성을 표준 속성과 사용자 지정 속성으로만 나눕니다. 문서는 사용자 풀을
      만들 때 CreateUserPool 의 SchemaAttributes 로 dev: 접두사를 갖는 개발자 속성
      (developer attributes)도 추가할 수 있지만, 이는 앱 클라이언트 읽기·쓰기 권한으로
      Amazon Cognito 가 대체한 레거시 기능이라고 명시합니다. 개발자 속성은 AWS 자격
      증명으로만 수정할 수 있습니다.
    replacement: '앱 클라이언트별 속성 읽기·쓰기 권한(ReadAttributes / WriteAttributes)'
    evidence: https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-attributes.html

  - id: token-authorizer-vs-request-authorizer
    module: M12
    state: discouraged
    title: 'Lambda 권한 부여자 TOKEN 유형'
    courseware_location: '슬라이드 25 본문("Lambda 권한 부여자 - 토큰 기반 / 요청은 파라미터 기반")과 강사 노트의 두 유형 설명'
    detail: >-
      교재는 두 유형을 토큰 기반(토큰 권한 부여자)과 요청 파라미터 기반(요청 권한
      부여자)으로 부르고 어느 쪽이 권장인지 밝히지 않습니다. 공식 유형 값은 TOKEN 과
      REQUEST 이며, 문서는 여러 자격 증명 소스를 쓸 수 있고 캐시 키를 분리할 수 있다는
      이유로 REQUEST 권한 부여자를 권장합니다. 또 Lambda 권한 부여자의 이전 명칭은
      사용자 지정 권한 부여자(custom authorizer)입니다.
    replacement: 'REQUEST 권한 부여자 권장. TOKEN 은 전달자 토큰 하나만 쓰는 경우에 한정'
    evidence: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-use-lambda-authorizer.html

