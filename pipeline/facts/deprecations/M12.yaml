      추출된 텍스트에서 kid 값의 닫는 인용부호가 곧은 인용부호(")가 아니라 왼쪽
      큰따옴표(“)입니다. 그대로는 JSON 으로 파싱되지 않습니다. 같은 슬라이드 본문의
      헤더 코드 블록도 kid 줄 끝의 쉼표가 보이지 않고 마지막 alg 줄 뒤에는 쉼표가
      남아 있어 유효한 JSON 이 아닙니다. 교재 자체의 표기 오류여서 외부 문서로
