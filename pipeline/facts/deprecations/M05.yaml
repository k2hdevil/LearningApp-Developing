# 폐기·변경 레지스트리
#
# 교재(Developing on AWS 강사용 덱)에 등장하지만 현재는 종료·비권장·변경된 항목을 기록합니다.
# 본문에서 조용히 지우지 않고 여기에 근거와 함께 남긴 뒤, 각 모듈 끝
# '교재 대비 변경 사항' 섹션에 delta로 표시합니다. 수강생이 공식 교재를 들고
# 있으므로 "책에는 있는데 자료에는 없다"는 질문에 답할 수 있어야 합니다.
#
# state 값
#   ended       : 서비스·버전 지원 종료. 본문에서 제거하고 대체안을 제시한다.
#   discouraged : 동작하지만 권장되지 않음. 본문 주 경로에서 빼고 주의로만 남긴다.
#   changed     : 동작·기본값·표기가 바뀜. 본문을 새 내용으로 교체한다.
#   incorrect   : 교재 기술이 사실과 다름. 교정한다.
#
# verified_on 은 아래 항목을 공식 문서로 확인한 날짜입니다.

verified_on: 2026-08-25

items:
  - id: java-sdk-v1
    module: M05
    state: ended
    title: AWS SDK for Java 1.x
    courseware_location: '슬라이드 28 "예제: S3 클라이언트 구성 및 생성(Java)"'
    detail: >-
      AWS SDK for Java 1.x는 2025년 12월 31일 지원이 종료되었습니다.
      교재 예제는 v2 문법(S3Client.builder())과 v1 문법(createBucket(new CreateBucketRequest(...)))을
      혼용하고 있으며, 변수를 s3로 선언한 뒤 s3Client를 호출하는 오류도 있습니다.
    replacement: AWS SDK for Java 2.x (software.amazon.awssdk)
    evidence: https://docs.aws.amazon.com/sdk-for-java/v1/developer-guide/getting-started.html

  - id: boto3-resource-interface
    module: M05
    state: discouraged
    title: boto3 리소스(resource) 인터페이스
    courseware_location: '슬라이드 26·27 "예시/예제: S3 클라이언트 생성(Python)"'
    detail: >-
      AWS Python SDK 팀은 boto3 리소스 인터페이스에 새 기능을 추가할 계획이 없습니다.
      기존 인터페이스는 boto3 수명 주기 동안 계속 동작하지만, 최신 서비스 기능은
      클라이언트 인터페이스를 통해 제공됩니다. 교재는 클라이언트와 리소스를
      동등한 선택지로 제시하고 예제도 리소스 API를 사용합니다.
    replacement: boto3 클라이언트 인터페이스 boto3.client('s3')
    evidence: https://boto3.amazonaws.com/v1/documentation/api/latest/guide/resources.html

  - id: s3-path-style-addressing
    module: M05
    state: discouraged
    title: 경로 스타일(path-style) S3 요청
    courseware_location: '슬라이드 23 "1단계: 서비스 구성"의 ~/.aws/config 예시 addressing_style = path'
    detail: >-
      경로 스타일 URL은 현재 모든 리전에서 계속 동작하지만 향후 중단될 예정입니다
      (2020년 9월 23일 업데이트로 폐기 시점이 연기됨). 브라우저에서 접근하는
      웹사이트 콘텐츠에는 동일 출처 보안 모델과 충돌할 수 있어 사용을 피하도록
      권장됩니다.
    replacement: 가상 호스팅 스타일 URL (SDK 기본값). 웹 콘텐츠는 S3 웹사이트 엔드포인트 또는 CloudFront
    evidence: https://docs.aws.amazon.com/AmazonS3/latest/userguide/VirtualHosting.html

  - id: s3-acl-as-primary-control
    module: M05
    state: changed
    title: ACL을 액세스 제어 수단으로 사용
    courseware_location: 슬라이드 13 "액세스 제어"
    detail: >-
      S3 Object Ownership의 기본값이 '버킷 소유자 적용(Bucket owner enforced)'이며
      신규 버킷에서 모든 ACL이 비활성화되어 있습니다. ACL이 비활성화된 버킷에서는
      ACL 설정·업데이트 요청이 실패하고, 액세스는 정책으로만 평가됩니다.
      교재는 ACL을 '레거시'로만 표기하고 기본 비활성화 사실을 다루지 않습니다.
    replacement: IAM 자격 증명 정책 + S3 버킷 정책
    evidence: https://docs.aws.amazon.com/AmazonS3/latest/userguide/about-object-ownership.html

  - id: s3-read-after-write-consistency-wording
    module: M05
    state: changed
    title: "'생성 후 읽기의 일관성' 표기"
    courseware_location: 슬라이드 6 "Amazon S3 개요" 성능 항목
    detail: >-
      Amazon S3는 모든 리전에서 객체 PUT·DELETE에 대해 강력한 읽기 후 쓰기 일관성
      (strong read-after-write consistency)을 제공합니다. 교재 표기는 신규 객체
      생성에만 일관성이 보장되던 이전 모델을 반영한 것입니다. 단, 버킷 구성은
      여전히 최종 일관성 모델을 따릅니다.
    replacement: 강력한 읽기 후 쓰기 일관성 (객체 작업) / 최종 일관성 (버킷 구성)
    evidence: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html

  - id: s3-bucket-naming-charset
    module: M05
    state: incorrect
    title: 버킷 이름에 허용되는 문자
    courseware_location: 슬라이드 7 "Amazon S3 구성 요소" 강사 노트
    detail: >-
      교재는 "소문자, 숫자, 하이픈(-)만 사용해야 합니다"라고 기재하지만,
      마침표(.)도 허용됩니다. 다만 SSL 와일드카드 인증서가 마침표를 포함한
      버킷 이름과 매칭되지 않고 Transfer Acceleration에서 사용할 수 없으므로
      실무에서는 마침표를 피하는 것이 좋습니다. 교재에는 예약 접두사·접미사
      규칙도 없습니다.
    replacement: 소문자·숫자·마침표(.)·하이픈(-). 실무 권장은 마침표 회피
    evidence: https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucketnamingrules.html

  - id: s3-access-point-attachment-wording
    module: M05
    state: incorrect
    title: "액세스 포인트가 '버킷에 연결되지 않는다'는 서술"
    courseware_location: 슬라이드 15 "Amazon S3 액세스 포인트" 강사 노트 첫 문단
    detail: >-
      교재 강사 노트 첫 문단은 "버킷에 연결되지 않습니다"라고 서술하지만,
      같은 노트 뒷부분과 지식 확인 6번 정답(참)은 연결된다고 기재해 자체 모순입니다.
      공식 문서는 액세스 포인트가 데이터 소스에 연결(attached)되는 명명된
      네트워크 엔드포인트라고 정의합니다.
    replacement: 액세스 포인트는 데이터 소스(버킷, FSx for NetApp ONTAP·OpenZFS 볼륨, AWS Backup의 S3 복구 지점)에 연결된다
    evidence: https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-points.html

  - id: s3-docs-dev-path
    module: M05
    state: changed
    title: 구버전 문서 경로 /AmazonS3/latest/dev/
    courseware_location: 슬라이드 7 강사 노트의 BucketRestrictions.html 링크
    detail: >-
      교재가 인용한 경로는 구버전 개발자 안내서(dev) 경로입니다.
      현재 Amazon S3 문서는 userguide 경로를 사용합니다.
    replacement: https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucketnamingrules.html
    evidence: https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucketnamingrules.html
