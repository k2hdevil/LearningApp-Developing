# 폐기·변경 레지스트리 (M08 · 모듈 8 데이터베이스 작업 처리)
#
# 교재(Developing on AWS 강사용 덱)에 등장하지만 현재는 종료·비권장·변경된 항목을 기록합니다.
# 본문에서 조용히 지우지 않고 여기에 근거와 함께 남긴 뒤, 모듈 문서의
# '교재 대비 변경 사항' 장에 delta로 표시합니다. 수강생이 공식 교재를 들고
# 있으므로 "책에는 있는데 자료에는 없다"는 질문에 답할 수 있어야 합니다.
#
# state 값
#   ended       : 서비스·버전 지원 종료. 본문에서 제거하고 대체안을 제시한다.
#   discouraged : 동작하지만 권장되지 않음. 본문 주 경로에서 빼고 주의로만 남긴다.
#   changed     : 동작·기본값·표기가 바뀜. 본문을 새 내용으로 교체한다.
#   incorrect   : 교재 기술이 사실과 다름. 교정한다.
#
# verified_on 은 아래 항목을 공식 문서로 확인한 날짜입니다.

verified_on: 2026-08-30

items:
  - id: java-sdk-v1-document-api
    module: M08
    state: ended
    title: AWS SDK for Java 1.x Document API
    courseware_location: '슬라이드 19~20 "테이블 업데이트, 리스트 및 삭제(Java)"의 dynamoDB.getTable / withReadCapacityUnits / TableCollection<ListTablesResult>'
    detail: >-
      AWS SDK for Java 1.x 는 2024년 1월 12일에 지원 종료가 발표되고 2024년 7월 31일
      유지 관리 모드에 들어갔으며 2025년 12월 31일 지원이 종료되었습니다. 교재 슬라이드
      19~20의 Java 예제는 1.x Document API 문법입니다(dynamoDB.getTable("Notes"),
      new ProvisionedThroughput().withReadCapacityUnits(15L),
      TableCollection<ListTablesResult>). 같은 모듈의 슬라이드 13~14·18·41~42는 2.x
      문법이어서 교재 안에서 버전이 섞여 있습니다. 1.x 패키지는 com.amazonaws,
      2.x 패키지는 software.amazon.awssdk 입니다.
    replacement: AWS SDK for Java 2.x. 테이블 작업은 DynamoDbClient(하위 수준), 매핑은 DynamoDbEnhancedClient, 데이터 유형 설명자를 피하려면 EnhancedDocument
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ProgrammingWithJava.html

  - id: java-createtableresult
    module: M08
    state: changed
    title: CreateTableResult
    courseware_location: '슬라이드 14 "AWS SDK for Java 하위 수준 인터페이스를 사용한 테이블 생성(2/2)"의 CreateTableResult result = ddb.createTable(request)'
    detail: >-
      교재 슬라이드 14는 요청을 CreateTableRequest.builder() 로 만드는 2.x 문법을 쓰면서
      반환 형식은 1.x 클래스 이름인 CreateTableResult 로 받습니다. AWS SDK for Java 2.x
      의 DynamoDB 모델에는 CreateTableResponse 클래스가 있고 tableDescription() 으로
      테이블 속성을 반환합니다.
    replacement: CreateTableResponse response = ddb.createTable(request);
    evidence: https://sdk.amazonaws.com/java/api/latest/software/amazon/awssdk/services/dynamodb/model/CreateTableResponse.html

  - id: java-createtable-string-argument
    module: M08
    state: incorrect
    title: 'ddb.createTable("Notes") 와 dbWaiter.waitUntilTableExists("Notes")'
    courseware_location: '슬라이드 18 "Waiter 사용: Java용 AWS SDK" 코드'
    detail: >-
      슬라이드 주석과 강사 노트는 "CreateTableRequest 객체의 정보를 사용하여 테이블을
      생성"한다고 서술하지만 코드는 문자열 리터럴을 넘깁니다. DynamoDbClient 의
      createTable 은 요청 객체 또는 빌더 Consumer 를 받는 두 오버로드만 노출되어 있고
      문자열을 받는 오버로드는 없습니다. DynamoDbWaiter 의 waitUntilTableExists 도
      공식 예제에서 DescribeTableRequest 를 구성하는 빌더를 받습니다.
    replacement: 'createTable(CreateTableRequest) / waiter.waitUntilTableExists(b -> b.tableName("Notes").build())'
    evidence: https://docs.aws.amazon.com/sdk-for-java/latest/developer-guide/ddb-en-client-gs-ddbtable.html

  - id: dynamodbpartition-annotation
    module: M08
    state: incorrect
    title: '@DynamoDbPartition'
    courseware_location: '슬라이드 41 "Java: DynamoDB 확장 클라이언트" 코드의 파티션 키 주석'
    detail: >-
      확장 클라이언트의 공식 데이터 클래스 주석 목록에 @DynamoDbPartition 이라는 이름은
      없습니다. 파티션 키 주석의 정확한 이름은 @DynamoDbPartitionKey 입니다. 같은
      슬라이드의 강사 노트는 @DynamoDbPartitionKey 로 올바르게 적고 있어 코드와
      노트가 서로 어긋납니다. 속성 수준 주석은 getter 또는 setter 중 한쪽에만 붙일 수
      있습니다.
    replacement: '@DynamoDbPartitionKey'
    evidence: https://docs.aws.amazon.com/sdk-for-java/latest/developer-guide/ddb-en-client-anno-index.html

  - id: condition-expression-favorite-not-yes
    module: M08
    state: incorrect
    title: '--condition-expression "Favorite NOT yes"'
    courseware_location: '슬라이드 37 "조건부 쓰기 작업" CLI 예제'
    detail: >-
      조건 표현식 문법은 operand comparator operand | operand BETWEEN ... | operand IN
      (...) | function | condition AND condition | condition OR condition |
      NOT condition | (condition) 입니다. NOT 은 조건 하나를 부정하는 논리 연산자여서
      'Favorite NOT yes' 처럼 이항 비교로 쓸 수 없고, yes 같은 값은 리터럴로 쓸 수 없어
      표현식 속성 값으로 넘겨야 합니다. 또 교재의 expression-attribute-values.json 에는
      :newnote 만 있고 조건에 필요한 값이 없습니다.
    replacement: '--condition-expression "attribute_not_exists(Favorite) OR Favorite <> :fav" 와 함께 :fav 값을 --expression-attribute-values 로 전달'
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Expressions.OperatorsAndFunctions.html

  - id: throughput-decrease-4-per-day
    module: M08
    state: changed
    title: 프로비저닝된 처리량 감소 하루 최대 4번
    courseware_location: '슬라이드 21 "테이블 업데이트, 리스트 및 삭제(.NET) - 1/2" 강사 노트'
    detail: >-
      교재는 "언제든 하루에 최대 4번 줄일 수 있습니다"라고 기재합니다. 현재 문서는 하루
      (UTC 기준)를 4회의 감소 횟수로 시작하고 매시간 1회가 추가되며 동시에 보유할 수
      있는 최대치가 4회여서, 24시간 전체로는 최대 27회까지 줄일 수 있다고 기술합니다.
      테이블과 GSI의 감소 한도는 분리되어 있지만 한 요청이 둘을 함께 줄이면서 어느
      한쪽이 한도를 넘으면 요청 전체가 거부됩니다.
    replacement: 하루 시작 시 4회 · 매시간 1회 보충 · 24시간 최대 27회
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ServiceQuotas.html

  - id: capacity-mode-switch-once-per-24h
    module: M08
    state: changed
    title: 용량 모드 전환 24시간마다 한 번
    courseware_location: '슬라이드 10 "초기 처리량 선택" 강사 노트의 참고 문구'
    detail: >-
      교재는 "24시간마다 한 번씩 읽기 및 쓰기 용량 모드를 전환할 수 있습니다"라고
      기재합니다. 현재 문서는 프로비저닝에서 온디맨드로는 24시간 롤링 윈도 안에서 최대
      4번까지 전환할 수 있고, 온디맨드에서 프로비저닝으로는 언제든 전환할 수 있다고
      기술합니다.
    replacement: 프로비저닝→온디맨드는 24시간 롤링 윈도 내 최대 4회 · 온디맨드→프로비저닝은 제한 없음
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-switching-capacity-modes.html

  - id: must-provision-capacity-at-create
    module: M08
    state: changed
    title: 테이블 생성 시 용량을 프로비저닝해야 한다
    courseware_location: '슬라이드 10 "초기 처리량 선택" 강사 노트의 "용량 모드 변경"'
    detail: >-
      교재는 "AWS CLI 또는 AWS SDK를 사용하여 테이블을 생성할 때 테이블의 용량을
      프로비저닝해야 합니다"라고 기재합니다. CreateTable 의 BillingMode 는 필수가 아니고
      유효값은 PROVISIONED 와 PAY_PER_REQUEST 이며, PAY_PER_REQUEST 를 선택하면
      ProvisionedThroughput 을 지정할 수 없습니다. 문서는 대부분의 DynamoDB 워크로드에
      PAY_PER_REQUEST 를 권장하고 온디맨드를 "기본이자 권장 처리량 옵션"으로 기술합니다.
      확장 클라이언트에서 빌더 없이 createTable() 을 호출하면 청구 모드가 온디맨드로
      설정됩니다.
    replacement: BillingMode=PAY_PER_REQUEST(온디맨드) 또는 BillingMode=PROVISIONED + ProvisionedThroughput
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/on-demand-capacity-mode.html

  - id: filter-expression-reduces-reads
    module: M08
    state: incorrect
    title: 필터 표현식으로 읽는 항목 수를 줄일 수 있다
    courseware_location: '슬라이드 30 "데이터 쿼리" 강사 노트의 마지막 문단'
    detail: >-
      교재는 "필터 표현식을 결합하고 결과를 제한할 수 있습니다. 둘을 결합하면 필요한
      것보다 많은 항목을 읽지 않고도 구체화된 데이터 세트를 얻을 수 있습니다"라고
      기재합니다. 문서는 DynamoDB가 반환된 데이터 양이 아니라 항목 크기를 기준으로
      소비 읽기 용량을 계산하며 FilterExpression 사용 여부와 무관하게 소비 용량이
      같다고 명시합니다. Scan 문서도 필터 표현식이 있든 없든 소비 읽기 용량이 같다고
      기술합니다. 읽는 양을 줄이는 것은 KeyConditionExpression 과 Limit 입니다.
    replacement: 읽는 양은 KeyConditionExpression·Limit·보조 인덱스로 줄인다. 필터는 반환 결과만 걸러낸다
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_Query.html

  - id: failed-conditional-write-1-wcu
    module: M08
    state: changed
    title: 항목이 없을 때 실패한 조건부 쓰기가 1 WCU를 소비한다
    courseware_location: '슬라이드 37 "조건부 쓰기 작업" 강사 노트의 참고 문구'
    detail: >-
      교재는 "항목이 현재 테이블에 존재하지 않는 경우 DynamoDB는 쓰기 용량 단위 1개를
      소비합니다"라고 기재합니다. 현재 문서는 조건이 false로 평가되어도 쓰기 용량을
      소비하며 소비량은 기존 항목 또는 생성·업데이트를 시도한 새 항목의 크기에 따라
      달라진다고 기술하고, '1개'라는 고정값을 제시하지 않습니다(문서 예시: 기존
      항목 300KB, 새 항목 310KB 이면 310KB 기준).
    replacement: 항목 크기(기존 항목 또는 시도한 새 항목) 기준으로 소비. 조건이 false여도 소비됨
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/read-write-operations.html

  - id: rcu-2kb-query-1-rcu
    module: M08
    state: incorrect
    title: 2KB 항목을 반환한 쿼리는 1 RCU가 부과된다
    courseware_location: '슬라이드 10 "초기 처리량 선택" 강사 노트의 RCU/WCU 예제'
    detail: >-
      교재는 읽기 일관성 모델을 명시하지 않고 "단일 응답 항목을 반환한 쿼리는 크기가
      2KB입니다. 이 테이블은 이 작업에 대해 1 RCU가 부과됩니다"라고 기재합니다.
      4KB 이하 항목에 대한 강력한 일관성 읽기는 1 RCU, 최종 일관성 읽기는 0.5 RCU,
      트랜잭션 읽기는 2 RCU 입니다. Query·GetItem 의 기본값은 최종 일관성 읽기이므로
      2KB 쿼리의 기본 소비량은 0.5 RCU 입니다. 같은 예제의 쓰기 2 WCU 는 맞습니다.
    replacement: 2KB 읽기 = 강력한 일관성 1 RCU / 최종 일관성(기본값) 0.5 RCU / 트랜잭션 2 RCU
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/read-write-operations.html

  - id: sort-key-operator-and
    module: M08
    state: incorrect
    title: 정렬 키 조건 표현식 연산자 목록에 AND가 있고 BETWEEN이 빠짐
    courseware_location: '슬라이드 30 "데이터 쿼리" 본문과 강사 노트'
    detail: >-
      슬라이드 본문은 정렬 키 조건 표현식으로 "=, <, >, <=, >=, AND, BETWEEN 또는
      begins_with"를 나열합니다. AND 는 독립된 비교 연산자가 아니라
      BETWEEN :v1 AND :v2 구문의 일부입니다. 반대로 같은 슬라이드의 강사 노트 목록에는
      BETWEEN 이 빠져 있어 본문과 노트가 서로 다릅니다. begins_with 는 숫자 유형 정렬
      키에 쓸 수 없고 함수 이름은 대소문자를 구분합니다.
    replacement: '=, <, <=, >, >=, BETWEEN :v1 AND :v2, begins_with(sortKeyName, :val)'
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_Query.html

  - id: lastevaluatedkey-means-more-data
    module: M08
    state: changed
    title: LastEvaluatedKey가 있으면 읽을 항목이 더 있다
    courseware_location: '슬라이드 31 "결과 페이지 매김(Pagination)" 본문과 강사 노트'
    detail: >-
      교재는 "쿼리에 LastEvaluatedKey 요소가 있고 값이 null이 아닌 경우" 다음 페이지를
      요청한다고만 서술합니다. 현재 문서는 비어 있지 않은 LastEvaluatedKey 가 이전
      Query 가 페이지 경계(1MB 또는 Limit)에서 멈췄다는 뜻일 뿐이며 일치하는 항목이 더
      남아 있다는 보장이 아니라고 명시합니다. 특히 FilterExpression 을 쓰면 한 페이지가
      일치 항목 0개를 반환하면서도 LastEvaluatedKey 를 포함할 수 있습니다.
    replacement: LastEvaluatedKey가 빌 때까지 반복 요청. 비어 있지 않다고 해서 일치 항목이 남았다는 뜻은 아니다
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Query.Pagination.html

  - id: putitem-attribute-value-null
    module: M08
    state: changed
    title: 속성 값은 null일 수 없다
    courseware_location: '슬라이드 25 "항목 생성" 강사 노트'
    detail: >-
      교재는 "항목을 추가하는 경우 기본 키 속성만 필수 속성입니다. 속성 값은 null일 수
      없습니다"라고만 기재합니다. 현재 PutItem 문서는 빈 문자열과 빈 이진 속성 값이
      허용되며, 테이블·인덱스의 키 속성으로 쓰이는 문자열·이진 값만 길이가 0보다
      커야 한다고 명시합니다. 세트 유형 속성은 비어 있을 수 없고 빈 값이 든 요청은
      ValidationException 으로 거부됩니다.
    replacement: 키가 아닌 속성에는 빈 문자열·빈 이진 값 허용. 키 속성은 길이 > 0
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_PutItem.html

  - id: elasticache-memcached-redis-only
    module: M08
    state: changed
    title: ElastiCache는 Memcached 또는 Redis 프로토콜을 준수하는 서버 노드를 실행한다
    courseware_location: '슬라이드 47 "DynamoDB 캐싱 옵션" 강사 노트'
    detail: >-
      교재는 ElastiCache를 "Memcached 또는 Redis 프로토콜을 준수하는 서버 노드를 배포 및
      실행하는 웹 서비스"로 서술합니다. 현재 문서는 ElastiCache가 Valkey, Memcached,
      Redis OSS 세 엔진과 작동한다고 기술하고, 노드 기반 클러스터 외에 서버리스 캐시
      형식도 제시합니다. 서버리스는 Valkey 7.2 이상, Memcached 1.6.22 이상,
      Redis OSS 7.1과 호환됩니다.
    replacement: Valkey · Memcached · Redis OSS 세 엔진 / 서버리스 캐시와 노드 기반 클러스터 두 형식
    evidence: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html

  - id: dax-write-ops-missing-transactwriteitems
    module: M08
    state: changed
    title: DAX 지원 쓰기 작업 4개
    courseware_location: '슬라이드 48 "Amazon DynamoDB Accelerator(DAX)" 지원되는 쓰기 작업 목록'
    detail: >-
      교재는 DAX의 write-through 쓰기 작업을 BatchWriteItem, UpdateItem, DeleteItem,
      PutItem 네 개로 제시합니다. 현재 문서는 DAX 클라이언트가 이 네 개와 함께
      TransactWriteItems 도 지원한다고 기술하며, TransactWriteItems 는 DynamoDB가
      트랜잭션 완료를 확인한 뒤 백그라운드에서 TransactGetItems 로 항목 캐시를
      채우는 방식으로 처리된다고 설명합니다.
    replacement: 'PutItem · UpdateItem · DeleteItem · BatchWriteItem · TransactWriteItems'
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.consistency.html

  - id: dotnet-sync-dynamodb-methods
    module: M08
    state: changed
    title: .NET 동기 메서드 (client.CreateTable / UpdateTable / DeleteTable / ListTables)
    courseware_location: 슬라이드 16, 21, 22 .NET 예제
    detail: >-
      교재 .NET 예제는 client.CreateTable(request), client.UpdateTable(request),
      client.DeleteTable(request), client.ListTables(request) 처럼 동기 메서드를
      호출합니다. AWS SDK for .NET(v4)의 현재 공식 DynamoDB CreateTable 코드 예제는
      await _amazonDynamoDB.CreateTableAsync(...) 형태의 비동기 호출을 사용하고
      BillingMode = BillingMode.PAY_PER_REQUEST 를 지정합니다.
    replacement: CreateTableAsync / UpdateTableAsync / DeleteTableAsync / ListTablesAsync
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/example_dynamodb_CreateTable_section.html

  - id: dotnet-document-model-null-assignment
    module: M08
    state: changed
    title: 'note["Favorite"] = null 로 속성 삭제'
    courseware_location: '슬라이드 44 ".NET: 문서 모델" UpdateItem 예제'
    detail: >-
      교재 예제는 문서 모델에서 note["Favorite"] = null; 로 기존 속성을 삭제한다고
      주석을 달았습니다. 현재 문서 모델 문서는 DynamoDB의 null 유형에 DynamoDBNull 을
      쓰도록 기술하고, 문자열 유형의 빈 문자열 값과 List·Map 안의 빈 문자열 값은 쓰기
      요청에서 제거된다고 설명합니다. 속성을 실제로 제거하려면 하위 수준
      UpdateExpression 의 REMOVE 절을 쓰는 것이 명확합니다.
    replacement: DynamoDBNull 사용 또는 UpdateExpression "REMOVE Favorite"
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DotNetSDKMidLevel.html

  - id: boto3-resource-interface-m08
    module: M08
    state: discouraged
    title: boto3 리소스 인터페이스로 DynamoDB 테이블 다루기
    courseware_location: 슬라이드 40~44 "보다 상위 수준의 인터페이스" (Python은 교재에 없음)
    detail: >-
      교재는 상위 수준 인터페이스로 Java 확장 클라이언트와 .NET 객체 지속성·문서 모델만
      다루고 Python을 다루지 않습니다. Python에서 상위 수준 인터페이스를 찾으면
      boto3 리소스 인터페이스(boto3.resource('dynamodb').Table(...))가 먼저 눈에
      띄지만, AWS Python SDK 팀은 리소스 인터페이스에 새 기능을 추가할 계획이 없고
      최신 서비스 기능은 클라이언트 인터페이스로 제공됩니다. 리소스 인스턴스는 스레드
      안전하지 않아 스레드·프로세스마다 새로 만들어야 합니다.
    replacement: boto3.client('dynamodb') 기준으로 작성. 필요하면 TypeSerializer/TypeDeserializer 로 값 변환
    evidence: https://boto3.amazonaws.com/v1/documentation/api/latest/guide/resources.html

  - id: legacy-conditional-parameters-m08
    module: M08
    state: discouraged
    title: 레거시 조건 파라미터 (ScanFilter / QueryFilter / AttributeUpdates / Expected / KeyConditions / AttributesToGet / ConditionalOperator)
    courseware_location: 교재에 등장하지 않음 (슬라이드 25~39는 모두 표현식 기반 파라미터 사용)
    detail: >-
      교재 예제는 모두 표현식 기반 파라미터를 씁니다. 다만 API에는 레거시 조건 파라미터가
      남아 있고, 오래된 예제 코드를 유지 보수할 때 만나게 됩니다. AWS는 표현식 파라미터
      사용을 권장하며 한 호출에서 레거시 파라미터와 표현식 파라미터를 섞어 쓰면 오류가
      발생합니다. 교재가 표현식 기반만 쓴다는 점은 현재 권장 사항과 일치합니다.
    replacement: AttributesToGet→ProjectionExpression / Expected→ConditionExpression / KeyConditions→KeyConditionExpression / QueryFilter·ScanFilter→FilterExpression / AttributeUpdates→UpdateExpression
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/LegacyConditionalParameters.html

  - id: dotnet-typo-noteid-i
    module: M08
    state: incorrect
    title: 'AttributeName = "NoteId",I 와 },,'
    courseware_location: '슬라이드 16 "AWS SDK for .NET 하위 수준 인터페이스를 사용한 테이블 생성(2/2)" 코드'
    detail: >-
      슬라이드 16 코드에 잉여 문자 I(AttributeName = "NoteId",I)와 쉼표 중복(},,)이
      있습니다. 컴파일되지 않는 표기 오류이며 AWS 문서로 검증할 성질의 사실이 아니라
      교재 자체의 오타입니다.
    replacement: 'AttributeName = "NoteId", 와 },'
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/example_dynamodb_CreateTable_section.html

  - id: noteid-type-inconsistency
    module: M08
    state: incorrect
    title: NoteId 속성 유형이 슬라이드마다 S와 N으로 엇갈림
    courseware_location: 슬라이드 13 코드·강사 노트 vs 슬라이드 14 강사 노트 vs 슬라이드 15~16·25 이후 CLI 예제
    detail: >-
      슬라이드 13 코드는 UserId 와 NoteId 를 모두 ScalarAttributeType.S 로 정의하고
      강사 노트도 "primarykey(UserId)와 sortKey(NoteId)는 모두 문자열(S)"이라고 씁니다.
      그런데 슬라이드 14 강사 노트는 같은 코드에 대해 "sortKey(NoteId)는 숫자(N)"라고
      씁니다. 슬라이드 15의 .NET 예제와 슬라이드 25 이후의 모든 CLI 예제는 NoteId 를
      N 으로 씁니다. AttributeType 유효값은 S·N·B 이고 기본 키 속성의 데이터 유형은
      문자열·숫자·이진 중 하나여야 하므로 둘 다 문법적으로는 가능하지만, 하나의 Notes
      테이블에 대해 두 정의가 공존할 수는 없습니다.
    replacement: 'NoteId 를 N(숫자)으로 통일. 슬라이드 25 이후 CLI 예제({"NoteId":{"N":"42"}})와 일치'
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_AttributeDefinition.html

  - id: enhanced-client-note-class-inconsistency
    module: M08
    state: incorrect
    title: 확장 클라이언트 예제의 클래스 이름·setter 타입 불일치
    courseware_location: '슬라이드 41~42 "Java: DynamoDB 확장 클라이언트"'
    detail: >-
      세 가지 불일치가 있습니다. ① 슬라이드 41 코드의 클래스 이름은 Note 인데 강사 노트는
      데이터 클래스를 NotesItems 라고 하고 슬라이드 42 강사 노트는 NotesItem 이라고
      합니다. ② 필드는 private String noteId 이고 getter 는 String 을 반환하는데 setter
      는 setNoteId(Integer noteId) 로 타입이 어긋나 컴파일되지 않습니다.
      ③ 슬라이드 42는 note.setNodeId("9") 로 존재하지 않는 메서드를 호출합니다
      (슬라이드 41 클래스에는 setNoteId 만 있음). 확장 클라이언트는 getter/setter 쌍으로
      속성을 매핑하므로 타입이 일치해야 합니다.
    replacement: 클래스 이름 Note 로 통일 · setNoteId(String noteId) · note.setNoteId("9")
    evidence: https://docs.aws.amazon.com/sdk-for-java/latest/developer-guide/ddb-en-client-anno-index.html

  - id: query-cli-missing-brace
    module: M08
    state: incorrect
    title: query CLI 예제의 JSON에 닫는 중괄호 누락
    courseware_location: '슬라이드 30 "데이터 쿼리" CLI 예제의 --expression-attribute-values'
    detail: >-
      교재 CLI 예제는 --expression-attribute-values '{":userid":{"S":"StudentA"}' 로
      닫는 중괄호가 하나 빠져 있어 JSON 파싱에 실패합니다. 교재 자체의 표기 오류입니다.
      Scan 문서의 공식 예제 형식은
      --expression-attribute-values '{":name":{"S":"User A"}}' 입니다.
    replacement: '--expression-attribute-values ''{":userid":{"S":"StudentA"}}'''
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Scan.html

  - id: listtables-no-pagination-mention
    module: M08
    state: changed
    title: ListTables 작업은 파라미터가 필요하지 않다
    courseware_location: 슬라이드 19~20·22 강사 노트와 슬라이드 22 본문
    detail: >-
      "ListTables 작업은 파라미터가 필요하지 않습니다"는 지금도 맞습니다. 다만 교재
      Java 리스트 예제는 전체 테이블을 한 번에 순회하는 것처럼 보입니다. ListTables
      출력은 페이지 매김되며 한 페이지에 최대 100개의 테이블 이름을 반환하고,
      Limit 미지정 시 한도는 100(유효 범위 1~100)입니다. 전체를 얻으려면 응답의
      LastEvaluatedTableName 을 다음 요청의 ExclusiveStartTableName 으로 넘겨야 합니다.
    replacement: LastEvaluatedTableName → ExclusiveStartTableName 루프 또는 SDK 페이지네이터 사용
    evidence: https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_ListTables.html
